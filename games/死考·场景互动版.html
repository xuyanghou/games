<style>

  .hotcard{position:absolute;left:16px;bottom:44px;width:560px;background:rgba(10,9,8,.94);

  .portrait .nm i{display:block;font-style:normal;font-family:'Noto Sans SC',sans-serif;font-size:10px;letter-spacing:.16em;color:#d8785f;margin-top:3px}
  .portrait .no{position:absolute;right:12px;top:10px;font-family:'Noto Sans SC',sans-serif;font-size:9.5px;letter-spacing:.2em;color:#8c8578}

  .speech{height:150px;border:1px solid rgba(216,209,198,.12);background:rgba(16,15,14,.6);padding:12px 14px;position:relative}
  .speech .who{font-family:'Noto Sans SC',sans-serif;font-size:10px;letter-spacing:.2em;color:#c8503f;margin-bottom:6px}
  .speech .ln{font-size:14px;line-height:1.82;color:#ded6c9}

  .team .row i{font-style:normal;font-family:'Noto Sans SC',sans-serif;font-size:10px;color:#8c8578}
  .team .row.hurt i{color:#c8503f}
  .team .row.gone i{color:#5a544b}
  .team .row b{font-weight:500;letter-spacing:.06em}

  .log{height:156px;border:1px solid rgba(216,209,198,.12);background:rgba(16,15,14,.5);padding:10px 12px;overflow:hidden}
  .log .li{font-family:'Noto Sans SC',sans-serif;font-size:10.5px;line-height:1.75;color:#8c8578;
    display:flex;gap:8px;margin-bottom:3px}
  .log .li em{font-style:normal;color:#c8503f;flex:0 0 auto}

  /* ---------- 遮罩层 ---------- */
  .ov{position:absolute;inset:0;background:#070708;z-index:20;display:flex;align-items:center;justify-content:center}
  .ov .box{width:900px;max-height:760px}
  .ov h2{font-size:34px;letter-spacing:.2em;font-weight:900;margin-bottom:8px}
  .ov h2 em{font-style:normal;color:#c8503f}
  .ov .sub{font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:.24em;color:#6f6a60;margin-bottom:22px}

  .ov .btns{display:flex;gap:12px;margin-top:26px}
  .ov .btn{border:1px solid rgba(216,209,198,.4);background:transparent;color:#e6ddd0;
    font-family:'Noto Sans SC',sans-serif;font-size:12.5px;letter-spacing:.2em;padding:12px 26px;cursor:pointer}
  .ov .btn:hover{border-color:#c8503f;background:rgba(60,24,20,.4)}
  .ov .btn.ghost{border-color:rgba(216,209,198,.16);color:#8c8578}

  .coverbg{position:absolute;left:0;top:0;width:1440px;height:900px;object-fit:cover;opacity:.42;
    filter:saturate(.6) brightness(.7)}
  .covshade{position:absolute;left:0;top:0;width:1440px;height:900px;background:

  .covwrap{position:relative;z-index:3;width:1200px;display:flex;align-items:center;gap:84px}

  .covleft h2 em{font-style:normal;color:#c8503f}
  .covleft .en{font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:.4em;color:#6f6a60;margin-bottom:26px}
  .covleft p{font-size:14.5px;line-height:2;color:#b8ac9d;margin-bottom:12px}
  .covleft p b{color:#e6ddd0;font-weight:500}
  .covleft .how{font-family:'Noto Sans SC',sans-serif;font-size:12px;line-height:1.95;color:#7d7568;
    border-left:2px solid rgba(200,80,63,.55);padding-left:14px;margin:22px 0 26px}
  .covright{width:380px}
  .covright .ph{width:380px;height:470px;border:1px solid rgba(216,209,198,.2);overflow:hidden;position:relative}
  .covright .ph img{width:380px;height:470px;object-fit:cover;display:block;filter:saturate(.7) contrast(1.05)}
  .covright .ph .pl{position:absolute;left:14px;bottom:12px;font-family:'Noto Sans SC',sans-serif;
    font-size:10px;letter-spacing:.24em;color:#d8c7b7}
  .covright .meta{margin-top:14px;display:flex;gap:18px}
  .covright .meta div{flex:1}
  .covright .meta span{display:block;font-family:'Noto Sans SC',sans-serif;font-size:9.5px;letter-spacing:.2em;color:#6f6a60}
  .covright .meta b{font-size:20px;color:#e6ddd0;font-weight:600}
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
  .gcard{border:1px solid rgba(216,209,198,.14);background:rgba(16,15,14,.6)}
  .gcard img{width:100%;height:220px;object-fit:cover;object-position:50% 15%;display:block;filter:saturate(.8)}
  .gcard .gi{padding:10px 12px}
  .gcard .gn{font-size:16px;letter-spacing:.1em;color:#e6ddd0}
  .gcard .gr{font-family:'Noto Sans SC',sans-serif;font-size:9.5px;letter-spacing:.16em;color:#c8503f;margin:2px 0 8px}
  .stat{display:flex;align-items:center;gap:7px;margin-bottom:4px;
    font-family:'Noto Sans SC',sans-serif;font-size:9.5px;color:#8c8578}
  .stat span{width:26px;flex:0 0 26px}
  .stat u{flex:1;height:3px;background:rgba(255,255,255,.1);text-decoration:none}
  .stat u i{display:block;height:3px;background:#a8322c}
  .gcard .gq{font-size:11px;line-height:1.7;color:#a89f92;margin-top:7px}

  .arch{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:4px}
  .ac{border:1px solid rgba(216,209,198,.14);padding:12px 14px;background:rgba(16,15,14,.55)}
  .ac.lock{opacity:.35}
  .ac .an{font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:.2em;color:#c8503f;margin-bottom:5px}
  .ac .at{font-size:12.5px;line-height:1.75;color:#b8ac9d}

  .warp{position:absolute;inset:0;z-index:30;background:rgba(30,6,4,.92);display:flex;align-items:center;justify-content:center;
    animation:fl .18s steps(2) infinite}
  @keyframes fl{0%{opacity:.95}50%{opacity:1}100%{opacity:.93}}
  .warp .wb{width:640px;border:1px solid rgba(200,80,63,.5);padding:28px;background:rgba(12,7,6,.9)}
  .warp .wk{font-family:'Noto Sans SC',sans-serif;font-size:10px;letter-spacing:.4em;color:#e0705c}
  .warp h3{font-size:26px;letter-spacing:.16em;margin:10px 0 14px;color:#f0ddd2}
  .warp p{font-size:14px;line-height:1.95;color:#d8c3b6}
  .warp button{margin-top:22px;min-width:218px;text-align:center;padding:12px 20px}

  .endstat{display:flex;gap:14px;margin:18px 0 6px}
  .endstat div{flex:1;border:1px solid rgba(216,209,198,.14);padding:12px 14px}
  .endstat div span{display:block;font-family:'Noto Sans SC',sans-serif;font-size:10px;letter-spacing:.2em;color:#6f6a60}
  .endstat div b{font-size:24px;color:#e6ddd0;font-weight:600}
</style>

<body>
<main data-canvas-root style="width:1440px;height:900px;">

  <div class="top">
    <div class="brand">
      <h1>死<em>考</em></h1>
      <span>DEATH EXAM · 三千万考生</span>
    </div>
    <div class="hud" id="hud"></div>
    <div class="navb">
      <button data-nav="cast">人物档案</button>
      <button data-nav="arch">世界观</button>
      <button data-nav="settle">结算</button>

  </div>

  <div class="grid">
    <div class="col-l" id="colL"></div>
    <div></div>
    <div style="display:flex;flex-direction:column;gap:12px" id="colC"></div>
    <div></div>
    <div class="col-r" id="colR"></div>
  </div>
  <div class="safe"></div>

</main>

<script>
/* ================= 资源 ================= */
const IMG = {
  yard:'https://aka.doubaocdn.com/s/Sur53Y2Nj8',
  lab:'https://aka.doubaocdn.com/s/jh7vTL0YpV',
  city:'https://aka.doubaocdn.com/s/Lb7qvCnR6A',
  temple:'https://aka.doubaocdn.com/s/xOr1PdiPlD',
  gate:'https://aka.doubaocdn.com/s/YO7nU6kU12',
  yelin:'https://aka.doubaocdn.com/s/v9h2MU5bKe',
  anko:'https://aka.doubaocdn.com/s/YFu1VXhJLS',
  hezheng:'https://aka.doubaocdn.com/s/LfOVFpd5jV',
  huangliang:'https://aka.doubaocdn.com/s/u9fZW7ItzL'
};

/* ================= 人物 ================= */
const CAST = {
  yelin:{name:'夜林', role:'考生 017 · 前盗墓贼 / 死囚', img:'yelin',
    stats:{推理:92, 体能:68, 共情:41, 运气:55},
    quote:'比起杀人，我似乎更擅长杀神。',
    bio:'十八岁，因盗墓入狱，执行前被异管局提走。判场里靠一条消防斧救过整队人，也靠一句话把监考系统问崩过一次。'},
  anko:{name:'安可', role:'考生 031 · 医疗兵', img:'anko',
    stats:{推理:74, 体能:71, 共情:78, 运气:60},
    quote:'别谢我，你死了我少一个挡在前面的。',
    bio:'尸潮考场里被卡在公交车残骸上，夜林把她拽出来。此后一直负责给队伍止血、也负责数还剩几个人。'},
  hezheng:{name:'贺铮', role:'考生 044 · 前军人', img:'hezheng',
    stats:{推理:55, 体能:93, 共情:62, 运气:48},
    quote:'你们先走，我数过子弹了。',
    bio:'尸潮那场留在路口断后，之后失联。有人说在道观里见过他，也有人说那是鬼借了他的脸。'},
  huangliang:{name:'黄粱', role:'考生 068 · 技术', img:'huangliang',
    stats:{推理:88, 体能:46, 共情:50, 运气:72},
    quote:'系统不会无缘无故安排东西，也不会无缘无故写你的名字。',
    bio:'拆过监考耳机，也拆过自己的工牌。道观那场之后设备断电，只剩下手写的笔记。'}
};

/* ================= 世界观档案 ================= */
const ARCH = [

/* ================= 状态 ================= */
const state = {
  stage:0, san:100, sum:0, clues:[], items:[], violations:0,
  explored:{}, logs:[], overlay:null, teamStatus:[]
};

/* ================= 渲染 ================= */
const $ = s=>document.querySelector(s);
const hudEl = $('#hud'), colL = $('#colL'), colC = $('#colC'), colR = $('#colR');

function pushLog(t){ state.logs.unshift(t); if(state.logs.length>4) state.logs.pop(); }
function addClue(c){ if(c && !state.clues.includes(c)){ state.clues.push(c); pushLog('记下线索：'+c); } }

function renderHUD(){
  const s = state;
  hudEl.innerHTML =
    '<span class="sum">分数 <b>'+s.sum+'</b></span>'+
    '<span>理智 <b>'+Math.max(s.san,0)+'</b><span class="bar"><i style="width:'+Math.max(s.san,0)+'%"></i></span></span>'+
    '<span>线索 <b>'+s.clues.length+'</b> 条</span>'+
    '<span class="viol '+(s.violations?'on':'')+'">违规 <b>'+s.violations+'</b> / 2</span>';
}

function renderStages(){
  const list = S.map((st,i)=>{
    const done = i < state.stage;
    const cur = i === state.stage;
    const lock = i > state.stage;
    return '<div class="stg '+(cur?'cur':'')+(lock?' lock':'')+'" data-st="'+i+'">'+
      '<div class="c">'+st.code+'</div><div class="n">'+st.name+'</div>'+
      '<div class="s">'+(done?'已通过':(cur?'进行中':(lock?'未解锁':'待进入')))+'</div></div>';
  }).join('');
  const st = S[state.stage];
  const rules = '<div class="rules"><div class="sec-t">本场致命规则</div><ul>'+
    st.rules.map((r,i)=>'<li><b>'+['一','二','三'][i]+'</b> · '+r+'</li>').join('')+'</ul></div>';
  const cl = state.clues.length
    ? state.clues.map(c=>'<span class="clue new">'+c+'</span>').join('')
    : '<span class="clue">还没有记下任何东西</span>';
  colL.innerHTML = '<div class="sec-t">考场序列</div><div class="stages">'+list+'</div>'+rules+
    '<div class="clues"><div class="sec-t">已获得的线索</div><div class="list">'+cl+'</div></div>';
  colL.querySelectorAll('.stg').forEach(el=>{
    el.onclick = ()=>{ const i=+el.dataset.st; if(i<=state.stage){ state.stage=i; renderAll(); } };
  });
}

function renderCenter(){
  const st = S[state.stage];
  const ex = state.explored[state.stage]||[];
  const hotHTML = st.hot.map((h,i)=>{
    const done = ex.includes(i);
    return '<div class="hot '+(done?'done':'')+(h.x>68?' rev':'')+'" style="left:'+h.x+'%;top:'+h.y+'%" data-h="'+i+'">'+
      '<div class="ring"></div><div class="dot"></div><div class="lab">'+h.n+'</div></div>';
  }).join('');
  const hint = '<div class="hintline"><b>'+st.code+' · '+st.env.slice(0,20)+'…</b>'+
    '<span>可查看 '+ex.length+' / '+st.hot.length+' · 至少 2 处才能推进</span></div>';

  colC.innerHTML =
    '<div class="scene" id="scene"><img src="'+IMG[st.bg]+'" alt="">'+
      '<div class="shade"></div>'+
      '<div class="tag-l">'+st.name+'</div><div class="tag-r">'+st.level+' 级</div>'+
      hotHTML + hint +
      '<div class="hotcard" id="hotcard"><div class="hn"></div><div class="ht"></div><div class="hg"></div><div class="hc">关闭</div></div>'+
    '</div>'+
    '<div class="env"><div class="p">环境</div><div class="t">'+st.env+'</div><div class="pt"><i></i>异象 · '+st.portent+'</div></div>'+
    '<div class="acts">'+st.acts.map((a,i)=>{
      const dim = a.need && (state.explored[state.stage]||[]).length < a.need;
      return '<div class="act '+(dim?'dim':'')+'" data-a="'+i+'"><div class="k">行动 '+a.k+'</div>'+
        '<div class="tt">'+a.t+'</div><div class="rk">'+a.rk+'</div><div class="go">'+(dim?'线索不足':'执行 →')+'</div></div>';
    }).join('')+'</div>';

  const scene = $('#scene');
  scene.querySelectorAll('.hot').forEach(el=>{
    el.onclick = ()=> openHot(+el.dataset.h);
  });
  $('#hotcard').querySelector('.hc').onclick = ()=>{ $('#hotcard').classList.remove('on'); };
  document.querySelectorAll('#colC .act').forEach(el=>{
    el.onclick = ()=>{ if(!el.classList.contains('dim')) doAct(+el.dataset.a); };
  });
}

function openHot(i){
  const st = S[state.stage], h = st.hot[i];
  const ex = state.explored[state.stage] || (state.explored[state.stage]=[]);
  const first = !ex.includes(i);
  if(first){
    ex.push(i);
    if(h.g){
      if(h.g.sum){ state.sum += h.g.sum; }
      if(h.g.san){ state.san += h.g.san; }
      if(h.g.clue){ addClue(h.g.clue); }
      if(h.g.item && !state.items.includes(h.g.item)){ state.items.push(h.g.item); pushLog('获得：'+h.g.item); }
    }
    pushLog('查看：'+h.n);
    document.querySelectorAll('#scene .hot')[i].classList.add('done');
  }
  const card = $('#hotcard');
  card.querySelector('.hn').textContent = first ? '首次查看 · '+h.n : '再次查看 · '+h.n;
  card.querySelector('.ht').textContent = h.t;
  const gains = [];
  if(h.g && h.g.sum) gains.push('<em>+'+h.g.sum+' 分</em>');
  if(h.g && h.g.san) gains.push((h.g.san>0?'+':'')+h.g.san+' 理智');
  if(h.g && h.g.clue) gains.push('线索「'+h.g.clue+'」');
  if(h.g && h.g.item) gains.push('道具「'+h.g.item+'」');
  card.querySelector('.hg').innerHTML = gains.length? gains.join(' ') : '<span>没有留下可以计分的东西</span>';
  card.classList.add('on');
  renderHUD(); renderRight(); renderStages2();
}

function renderStages2(){
  const st = S[state.stage];
  const ex = state.explored[state.stage]||[];
  const hint = document.querySelector('.hintline');
  if(hint) hint.querySelector('span').textContent = '可查看 '+ex.length+' / '+st.hot.length+' · 至少 2 处才能推进';
  refreshActs();
}

function refreshActs(){
  const st = S[state.stage];
  const ex = (state.explored[state.stage]||[]).length;
  document.querySelectorAll('#colC .act').forEach((el,i)=>{
    const a = st.acts[i];
    if(a.need && ex < a.need) el.classList.add('dim');
    else el.classList.remove('dim');
  });
}

  colR.innerHTML =
    '<div class="portrait"><img src="'+IMG[p.img]+'" alt="">'+
      '<div class="ov"></div><div class="no">'+st.code+'</div>'+
      '<div class="nm"><b>'+p.name+'</b><i>'+p.role+'</i></div></div>'+
    '<div class="speech"><div class="who">'+p.name+' · 当前发言</div><div class="ln">'+st.line+'</div></div>'+
    '<div class="team"><div class="sec-t">队伍状态</div>'+teamRows+'</div>'+
    '<div class="log"><div class="sec-t">行动记录</div>'+
      (state.logs.length? state.logs.map(l=>'<div class="li"><em>·</em>'+l+'</div>').join('') : '<div class="li"><em>·</em>考场尚未开始</div>')+
    '</div>';
}

function renderAll(){ renderHUD(); renderStages(); renderCenter(); renderRight(); }

/* ================= 行动 ================= */
function doAct(i){
  const st = S[state.stage], a = st.acts[i];
  if(a.v){ violate(a, st); return; }
  if(a.req && state.sum < a.req){
    showWarp('兑换窗口 · 分数不足', '窗口后面的人看了一眼你的分数，把帘子放下了。帘子后面有金属摩擦声，很轻，像有人在数零钱。', false, ()=>{
      state.san -= 10; if(state.san<=0) return ending('death', a); renderAll();
    });
    return;
  }
  if(a.need && (state.explored[state.stage]||[]).length < a.need){
    state.san -= 8; pushLog('推进失败：线索不足，你多绕了一圈');
    renderAll(); return;
  }
  if(a.sum) state.sum += a.sum;
  if(a.san) state.san += a.san;
  if(a.clue) addClue(a.clue);
  pushLog(a.t);
  if(a.res) st.line = '“'+a.res+'”';

  if(a.end){ return ending(a.end, a); }
  if(a.next!=null){ state.stage = a.next; }

  if(state.san <= 0){ return ending('death', a); }
  renderAll();
}

/* 规则触犯 */
function violate(a, st){
  if(state.violations >= 1){
    state.violations = 2;
    return ending('death', a);
  }
  state.violations = 1;
  const texts = {
    1:'灯从最远处开始灭，一盏一盏，朝你过来。墙上渗出带铁锈味的薄液，顺着木纹往下爬。你听见很多人在很近的地方，一起把一口气放完。',
    2:'所有舱里的“人形”同时转头。玻璃上浮出一层白雾，雾里有一个手印，从里面按的。走廊的金属摩擦声停了——它已经知道你在哪。',
    3:'开阔地的声音传得比你想的远。远处成片的黑影像被一根线拽着，一起转头。你的脚步已经连成一条线，那条线通向它们。'
  };
  showWarp('第一次触犯 · 世界开始扭曲', texts[a.v], false, ()=>{
    state.san -= 14;
    state.violations = 1;
    if(state.san<=0) return ending('death', a);
    renderAll();
  });
}

function showWarp(k, text, fatal, cb){
  const el = document.createElement('div');
  el.className='warp';
  el.innerHTML='<div class="wb"><div class="wk">规则判定</div><h3>'+k+'</h3><p>'+text+'</p>'+
    '<button class="btn" id="wbtn">'+(fatal?'承受结果':'撑住 —— 回到那一刻')+'</button></div>';
  document.querySelector('main').appendChild(el);
  el.querySelector('#wbtn').onclick=()=>{ el.remove(); cb(); };
}

/* ================= 结局 ================= */
const ENDINGS = {
  win:{t:'存活 · 通关', p:'你推开了青铜门。门后没有神，只有一间更旧的教室：黑板上写着一行粉笔字——“本次考试到此结束，请考生把名字留在门口”。你回头时，门已经不见了，队伍里少了一个人，谁也没说是谁。'},
  gene:{t:'存活 · 兑换完成', p:'你把分数推到窗口。暴君基因落进你手里的时候，你听见系统说了一句很客气的话：“欢迎成为考题。”你的名字从名册上被移到了另一本册子上。'},
  lose:{t:'存活 · 弃考', p:'你在门前回头。雾一下子散了，青铜门变成一堵墙。你回到现实，带着一张没有成绩的准考证。很多年后你还在想：那扇门后面，到底有没有人在等。'},
  death:{t:'死亡 · 副本失败', p:'规则完成了它的判定。你最后看到的，是名册上你的名字被人用红笔轻轻描了一遍，描完之后，那一行变得比其他行都亮。'}
};

function ending(kind, a){
  const e = ENDINGS[kind] || ENDINGS.death;
  if(kind==='death' && state.violations<2) state.violations = 2;
  const score = kind==='win'? state.sum + 60 : (kind==='gene'? state.sum : (kind==='lose'? Math.round(state.sum*0.6): 0));
  const html = '<div class="ov"><div class="box">'+
    '<div class="sub">结算 · '+S[state.stage].name+'</div>'+
    '<h2>'+e.t.replace(' · ','<em> · </em>')+'</h2>'+
    '<p>'+e.p+'</p>'+
    '<div class="endstat">'+
      '<div><span>本场得分</span><b>'+state.sum+'</b></div>'+
      '<div><span>理智剩余</span><b>'+Math.max(state.san,0)+'</b></div>'+
      '<div><span>线索</span><b>'+state.clues.length+'</b></div>'+
      '<div><span>违规次数</span><b>'+state.violations+'</b></div>'+
    '</div>'+
    '<p style="margin-top:14px;color:#8c8578">道具：'+(state.items.length?state.items.join(' / '):'无')+
    '　·　记录分数（含结算加成）：<b style="color:#d8b06a">'+score+'</b></p>'+
    '<div class="btns"><button class="btn" id="again">再进一次</button>'+
    '<button class="btn ghost" id="tohome">返回封面</button></div>'+
  '</div></div>';
  const el=document.createElement('div'); el.innerHTML=html;
  const ov = el.firstChild;
  document.querySelector('main').appendChild(ov);
  ov.querySelector('#again').onclick=()=>{ ov.remove(); reset(); renderAll(); };
  ov.querySelector('#tohome').onclick=()=>{ ov.remove(); reset(); renderAll(); showIntro(); };
}

/* ================= 遮罩：封面 / 人物 / 档案 ================= */
function showIntro(){
  const ov=document.createElement('div');
  ov.className='ov';
  ov.innerHTML='<img class="coverbg" src="'+IMG.gate+'" alt="">'+
    '<div class="covshade"></div>'+
    '<div class="covwrap">'+
      '<div class="covleft">'+
        '<div class="kick">无限流 · 场景互动 · 单人</div>'+
        '<h2>死<em>考</em></h2>'+
        '<div class="en">DEATH EXAM · 三千万考生</div>'+
        '<p>死亡高考降临，<b>三千万考生</b>被拉进地狱。考题被换成了丧尸、异种、厉鬼——答对得分，答错完蛋。</p>'+
        '<p>你是<b>夜林</b>，十八岁，前盗墓贼，死囚。军方把你从刑场提出来，只提了一个条件：活下去，并传回情报。</p>'+
        '<div class="how">点场景里的亮点查看环境与线索，每一处都有代价或收益<br>'+
        '每场至少查看 2 处，才能推进到下一个考场<br>'+
        '触犯致命规则第一次只会“世界扭曲”，第二次才判死</div>'+
        '<div class="btns"><button class="btn" id="start">进入判场</button>'+
        '<button class="btn ghost" id="codex">先看人物</button></div>'+
      '</div>'+
      '<div class="covright">'+
        '<div class="ph"><img src="'+IMG.yelin+'" alt=""><div class="pl">考生 017 · 夜林</div></div>'+
        '<div class="meta"><div><span>考场</span><b>04</b></div>'+
        '<div><span>考生</span><b>3000万</b></div>'+
        '<div><span>规则</span><b>即死</b></div></div>'+
      '</div>'+
    '</div>';
  document.querySelector('main').appendChild(ov);
  ov.querySelector('#start').onclick=()=>{ ov.remove(); };
  ov.querySelector('#codex').onclick=()=>{ ov.remove(); showCast(); };
}

function showCast(){
  const ov=document.createElement('div'); ov.className='ov';
  const cards = Object.keys(CAST).map(k=>{
    const c=CAST[k];
    const stats = Object.keys(c.stats).map(s=>'<div class="stat"><span>'+s+'</span><u><i style="width:'+c.stats[s]+'%"></i></u></div>').join('');
    return '<div class="gcard"><img src="'+IMG[c.img]+'" alt="">'+
      '<div class="gi"><div class="gn">'+c.name+'</div><div class="gr">'+c.role+'</div>'+stats+
      '<div class="gq">「'+c.quote+'」</div></div></div>';
  }).join('');
  ov.innerHTML='<div class="box"><div class="sub">人物建模 · 灵安小队</div><h2>档案</h2>'+
    '<div class="gallery">'+cards+'</div>'+
    '<div class="btns"><button class="btn" id="cl">关闭</button></div></div>';
  document.querySelector('main').appendChild(ov);
  ov.querySelector('#cl').onclick=()=>ov.remove();
}

function showArch(){
  const ov=document.createElement('div'); ov.className='ov';
  const unlocked = new Set(state.clues.concat(['死亡高考','异管局','分数兑换']));
  const items = ARCH.map(a=>{
    const on = unlocked.has(a.n) || unlocked.has(a.id) || (a.id==='exam') || (a.id==='bureau') || (a.id==='score');
    return '<div class="ac '+(on?'':'lock')+'"><div class="an">'+(on?a.n:'未解锁')+'</div>'+
      '<div class="at">'+(on?a.t:'继续推进考场，才能读到这条记录。')+'</div></div>';
  }).join('');
  ov.innerHTML='<div class="box"><div class="sub">世界观档案 · 随线索解锁</div><h2>死考</h2>'+
    '<div class="arch">'+items+'</div>'+
    '<div class="btns"><button class="btn" id="cl">关闭</button></div></div>';
  document.querySelector('main').appendChild(ov);
  ov.querySelector('#cl').onclick=()=>ov.remove();
}

/* ================= 结算按钮 ================= */
function settleNow(){
  const sum=state.sum, san=Math.max(state.san,0);
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="box"><div class="sub">中途结算</div><h2>交卷</h2>'+
    '<p>你现在可以停在这里。已拿到的分数按六成记账，线索与道具保留在档案里。</p>'+
    '<div class="endstat"><div><span>当前分数</span><b>'+sum+'</b></div>'+
    '<div><span>理智</span><b>'+san+'</b></div><div><span>线索</span><b>'+state.clues.length+'</b></div>'+
    '<div><span>记录得分</span><b>'+Math.round(sum*0.6)+'</b></div></div>'+
    '<div class="btns"><button class="btn" id="ok">确认交卷</button><button class="btn ghost" id="no">继续</button></div></div>';
  document.querySelector('main').appendChild(ov);
  ov.querySelector('#no').onclick=()=>ov.remove();
  ov.querySelector('#ok').onclick=()=>{ ov.remove(); reset(); renderAll(); };
}

/* ================= 启动 ================= */
function reset(){
  state.stage=0; state.san=100; state.sum=0; state.clues=[]; state.items=[];
  state.violations=0; state.explored={}; state.logs=[]; state.overlay=null;
}
renderAll();
if(location.hash === '#play'){ /* 直接进入场景，用于预览 */ } else { showIntro(); }

document.querySelectorAll('.navb button').forEach(b=>{
  b.onclick=()=>{
    const n=b.dataset.nav;
    if(n==='cast') showCast();
    else if(n==='arch') showArch();
    else settleNow();
  };
});
</script>
</body>
</html>
