<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>钢铁突击 · 跑轰射击</title>
<style>
    :root {
        --bg: #0a0f1a;
        --panel: rgba(255,255,255,0.06);
        --stroke: rgba(255,255,255,0.12);
        --text: #fff;
        --dim: rgba(255,255,255,0.55);
        --orange: #ff7a2c;
    }
    * { box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
        font-family:'Noto Sans SC', -apple-system, "Segoe UI", sans-serif; }
    #wrap { position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:10px; padding:12px; }

    .head { width:100%; max-width:800px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .title h1 { font-size:1.4rem; font-weight:900; letter-spacing:3px;
        background:linear-gradient(90deg,#ffcc00,#ff5c2c); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .title p { font-size:0.7rem; color:var(--dim); margin-top:2px; }
    .scores { display:flex; gap:7px; flex-wrap:wrap; }
    .box { background:var(--panel); border:1px solid var(--stroke); border-radius:11px; padding:5px 12px; text-align:center; min-width:58px; }
    .box .k { font-size:0.6rem; color:var(--dim); }
    .box .v { font-size:1.05rem; font-weight:900; font-variant-numeric:tabular-nums; }

    canvas { width:100%; max-width:800px; aspect-ratio:16/10; background:#1b2430; border-radius:12px;
        border:1px solid var(--stroke); display:block; box-shadow:0 16px 44px rgba(0,0,0,0.5); }

    .bar { width:100%; max-width:800px; display:flex; gap:8px; }
    .btn { flex:1; padding:10px; border-radius:11px; border:1px solid var(--stroke); cursor:pointer;
        background:var(--panel); color:var(--text); font-family:inherit; font-size:0.85rem; font-weight:700; letter-spacing:1px; }
    .btn:hover { background:rgba(255,255,255,0.12); }
    .btn.primary { background:linear-gradient(90deg,#ffcc00,#ff5c2c); color:#2a1400; border:none; }

    .tip { font-size:0.7rem; color:var(--dim); letter-spacing:1px; text-align:center; }
    .tip b { color:var(--orange); }

    .touch { width:100%; max-width:800px; display:none; gap:8px; }
    .touch .tb { flex:1; padding:14px 0; border-radius:12px; border:1px solid var(--stroke);
        background:var(--panel); color:var(--text); font-size:1rem; font-weight:800; text-align:center; }
    .touch .tb:active { background:rgba(255,255,255,0.2); }
    @media (pointer: coarse) { .touch { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
    <div class="head">
        <div class="title">
            <h1>钢铁突击</h1>
            <p>跑轰射击 · 丛林突袭</p>
        </div>
        <div class="scores">
            <div class="box"><div class="k">分数</div><div class="v" id="score">0</div></div>
            <div class="box"><div class="k">生命</div><div class="v" id="lives">♥♥♥</div></div>
            <div class="box"><div class="k">武器</div><div class="v" id="weapon">标准</div></div>
            <div class="box"><div class="k">最高</div><div class="v" id="best">0</div></div>
            <div class="box"><div class="k">进度</div><div class="v" id="progress">0%</div></div>
        </div>
    </div>

    <canvas id="cv" width="800" height="500"></canvas>

    <div class="touch">
        <div class="tb" data-key="left">◀</div>
        <div class="tb" data-key="up">▲</div>
        <div class="tb" data-key="fire">射</div>
        <div class="tb" data-key="jump">跳</div>
        <div class="tb" data-key="down">▼</div>
        <div class="tb" data-key="right">▶</div>
    </div>

    <div class="bar">
        <button class="btn" id="pause-btn">⏸ 暂停</button>
        <button class="btn primary" id="new-btn">重新开始</button>
    </div>

    <p class="tip"><b>← →</b> 移动 · <b>↑ ↓</b> 瞄准八方向 · <b>Z / J</b> 射击 · <b>X / K / 空格</b> 跳 · 拾取 <b>S</b> 散弹 / <b>L</b> 激光</p>
</div>

<script>
'use strict';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND = H - 58;
const STAGE_LEN = 5600;

const WEAPONS = {
    normal: { name: '标准', cd: 0.15, dmg: 1, spread: 0, speed: 660, color: '#fff8b0' },
    spread: { name: '散弹', cd: 0.34, dmg: 1, spread: 0.26, count: 5, speed: 560, color: '#ffd08a' },
    laser:  { name: '激光', cd: 0.26, dmg: 3, spread: 0.02, count: 1, speed: 1000, color: '#7df3ff', pierce: true },
    rifle:  { name: '步枪', cd: 0.085, dmg: 1, spread: 0.05, count: 1, speed: 820, color: '#b0ff9d' }
};

let player, bullets, eBullets, enemies, pickups, particles, camX, weapon;
let score, lives, ammo, gameState, spawnTimer, banner, bannerT, invuln, shake;
let stageNo, boss, bossActive, waveT, muzzle, combo, comboT;
let best = parseInt(localStorage.getItem('contra_best') || '0', 10) || 0;

function reset() {
    player = {
        x: 90, y: GROUND - 40, w: 26, h: 40,
        vx: 0, vy: 0, onGround: true,
        aim: { x: 1, y: 0 },
        facing: 1,
        fireCd: 0,
        walk: 0,
        jumpCd: 0,
        jumps: 0,
        weaponTime: 0
    };
    bullets = []; eBullets = []; enemies = []; pickups = []; particles = [];
    camX = 0;
    score = 0;
    lives = 3;
    ammo = 40;
    weapon = WEAPONS.normal;
    player.weaponTime = 0;
    gameState = 'play';
    spawnTimer = 0.6;
    stageNo = 1;
    invuln = 0;
    shake = 0;
    combo = 0; comboT = 0;
    boss = null; bossActive = false; waveT = 0;
    muzzle = 0;
    banner = '第 1 关 · 向前推进';
    bannerT = 2.2;
    updateHUD();
}

function updateHUD() {
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = '♥'.repeat(Math.max(0, lives)) || '—';
    document.getElementById('weapon').textContent = weapon.name + (player.weaponTime > 0 ? ' ' + Math.ceil(player.weaponTime) + 's' : '');
    document.getElementById('best').textContent = best;
    document.getElementById('progress').textContent = Math.min(100, Math.floor(player.x / STAGE_LEN * 100)) + '%';
}

/* ===================== 更新 ===================== */
function update(dt) {
    if (gameState !== 'play') return;

    const P = player;

    /* 移动 */
    const acc = P.onGround ? 2100 : 1200;
    if (keys.left) { P.vx -= acc * dt; P.facing = -1; }
    else if (keys.right) { P.vx += acc * dt; P.facing = 1; }
    else {
        const fr = P.onGround ? 2500 : 550;
        if (P.vx > 0) P.vx = Math.max(0, P.vx - fr * dt);
        else P.vx = Math.min(0, P.vx + fr * dt);
    }
    P.vx = Math.max(-235, Math.min(235, P.vx));

    /* 跳跃（可二段跳） */
    if (keys.jumpJust) {
        keys.jumpJust = false;
        if (P.onGround && P.jumpCd <= 0) {
            P.vy = -640; P.onGround = false; P.jumpCd = 0.2;
            tone(420, 0.07, 0.05);
            spawnDust(P.x + P.w / 2, GROUND);
        } else if (!P.onGround && P.jumps < 2) {
            P.vy = -560; P.jumps++;
            tone(600, 0.07, 0.05);
            spawnParticles(P.x + P.w / 2, P.y + P.h, '#9fc4ff', 8);
        }
    }
    P.jumpCd -= dt;

    /* 瞄准 */
    let ax = 0, ay = 0;
    if (keys.up) ay = -1;
    if (keys.down && P.onGround) ay = 1;
    if (keys.left) ax = -1;
    if (keys.right) ax = 1;
    if (ax === 0 && ay === 0) ax = P.facing;
    if (ax !== 0) P.facing = ax;
    P.aim = { x: ax, y: ay };

    /* 重力 */
    P.vy += 1850 * dt;
    P.x += P.vx * dt;
    P.y += P.vy * dt;
    if (P.x < 0) { P.x = 0; P.vx = 0; }
    if (P.x > STAGE_LEN + 100) P.x = STAGE_LEN + 100;
    if (P.y + P.h >= GROUND) { P.y = GROUND - P.h; P.vy = 0; P.onGround = true; P.jumps = 0; }
    else P.onGround = false;

    if (Math.abs(P.vx) > 12) P.walk += dt * 12;

    /* 武器持续时间 */
    if (P.weaponTime > 0) {
        P.weaponTime -= dt;
        if (P.weaponTime <= 0) { weapon = WEAPONS.normal; updateHUD(); }
    }

    /* 射击 */
    P.fireCd -= dt;
    if (keys.fire && P.fireCd <= 0) {
        if (ammo > 0) {
            fire();
            ammo--;
            P.fireCd = weapon.cd;
            muzzle = 0.06;
            tone(560, 0.05, 0.06);
            if (ammo === 0) { banner = '弹 药 耗 尽 ！'; bannerT = 1.6; }
        } else {
            tone(120, 0.05, 0.04);
            P.fireCd = 0.35;
            banner = '弹 药 耗 尽 ！去捡弹药箱';
            bannerT = 1.2;
        }
    }
    if (muzzle > 0) muzzle -= dt;

    /* 相机 */
    const target = Math.max(0, Math.min(STAGE_LEN - W + 100, P.x - W * 0.38));
    camX += (target - camX) * Math.min(1, 7 * dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 3);

    /* BOSS 触发：到达 60% 进度 */
    if (!bossActive && !boss && P.x > STAGE_LEN * 0.62) {
        bossActive = true;
        spawnBoss();
    }

    /* 生成敌人 */
    if (!boss) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            spawnTimer = Math.max(0.45, 1.45 - stageNo * 0.07);
            spawnEnemy();
        }
    }

    /* 敌人 */
    for (const e of enemies) {
        if (e.dead) continue;
        const ex = e.x - camX;
        if (ex < -160 || ex > W + 160) continue;

        e.t += dt;
        const dx = P.x - e.x;
        const dist = Math.abs(dx);

        if (e.type === 'turret') {
            /* 炮台：固定位置，扇形弹幕 */
            e.cool -= dt;
            if (e.cool <= 0 && dist < 520) {
                e.cool = 1.7;
                const ang = Math.atan2(P.y - e.y, P.x - e.x);
                for (let k = -1; k <= 1; k++) {
                    const a2 = ang + k * 0.28;
                    eBullets.push({ x: e.x + e.w / 2, y: e.y + 8, vx: Math.cos(a2) * 230, vy: Math.sin(a2) * 230, life: 4 });
                }
                tone(200, 0.05, 0.03);
            }
        } else if (e.type === 'jumper') {
            /* 跳跳怪：跳跃接近 */
            e.vy += 1750 * dt;
            e.x += e.vx * dt;
            e.y += e.vy * dt;
            if (e.y + e.h >= GROUND) {
                e.y = GROUND - e.h; e.vy = 0;
                if (dist < 420) e.vx = Math.sign(dx) * 150;
                e.cool -= dt;
                if (e.cool <= 0) { e.vy = -560; e.cool = 1.5; }
            }
            if (e.x < camX - 220) { e.dead = true; continue; }
        } else {
            e.vx += Math.sign(dx) * 700 * dt;
            e.vx = Math.max(-115, Math.min(115, e.vx));
            e.face = Math.sign(dx) || e.face;
            e.cool -= dt;
            if (e.shooter && e.cool <= 0 && dist < 360) {
                e.cool = 1.3 + Math.random() * 1.1;
                eBullets.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: Math.sign(dx) * 260, vy: 0, life: 3 });
                tone(200, 0.05, 0.03);
            }
            if (e.type === 'tank' && e.cool <= 0 && dist < 300) {
                e.cool = 2.4;
                for (let k = -2; k <= 2; k++) {
                    eBullets.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: Math.sign(dx) * 170, vy: k * 55, life: 3.4 });
                }
                tone(150, 0.08, 0.04);
            }
        }

        if (e.type !== 'turret' && e.type !== 'jumper') {
            e.vy += 1750 * dt;
            e.x += e.vx * dt;
            e.y += e.vy * dt;
            if (e.y + e.h >= GROUND) { e.y = GROUND - e.h; e.vy = 0; }
        }
        if (e.x < camX - 240) { e.dead = true; continue; }

        /* 碰撞 */
        if (P.x + P.w > e.x + 3 && P.x < e.x + e.w - 3 &&
            P.y + P.h > e.y + 3 && P.y < e.y + e.h - 3) {
            if (invuln <= 0) hurtPlayer();
        }
    }

    /* BOSS */
    if (boss) updateBoss(dt);

    /* 玩家子弹 */
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        let hit = false;

        /* 命中 BOSS */
        if (boss && !boss.dead) {
            if (b.x > boss.x - boss.w / 2 && b.x < boss.x + boss.w / 2 &&
                b.y > boss.y - boss.h / 2 && b.y < boss.y + boss.h / 2) {
                damageBoss(b.dmg, b.x, b.y);
                if (!weapon.pierce) { bullets.splice(i, 1); continue; }
            }
        }

        for (const e of enemies) {
            if (e.dead) continue;
            if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                e.hp -= b.dmg;
                e.flash = 0.1;
                spawnParticles(b.x, b.y, weapon.color, 4);
                if (e.hp <= 0) {
                    e.dead = true;
                    score += e.score;
                    combo++; comboT = 1.5;
                    spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff5c2c', 16);
                    tone(180, 0.1, 0.07);
                    shake = Math.max(shake, 0.12);
                    updateHUD();
                }
                hit = true;
                break;
            }
        }
        if (hit && !weapon.pierce) { bullets.splice(i, 1); continue; }
        if (b.life <= 0 || b.x < camX - 60 || b.x > camX + W + 60 || b.y < 0 || b.y > H) {
            bullets.splice(i, 1);
        }
    }

    /* 敌人子弹 */
    for (let i = eBullets.length - 1; i >= 0; i--) {
        const b = eBullets[i];
        b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
        if (b.x > P.x && b.x < P.x + P.w && b.y > P.y && b.y < P.y + P.h) {
            if (invuln <= 0) hurtPlayer();
            eBullets.splice(i, 1);
            continue;
        }
        if (b.life <= 0 || b.x < camX - 80 || b.x > camX + W + 80) eBullets.splice(i, 1);
    }

    /* 掉落物 */
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        const px = p.x - camX;
        if (px < -50 || px > W + 50) continue;
        p.vy = (p.vy || 0) + 1400 * dt;
        p.y += p.vy * dt;
        if (p.y + 24 > GROUND) { p.y = GROUND - 24; p.vy = 0; }
        if (P.x + P.w > p.x && P.x < p.x + 24 && P.y + P.h > p.y && P.y < p.y + 24) {
            pickups.splice(i, 1);
            if (p.kind === 'ammo') {
                ammo = Math.min(120, ammo + p.amount);
                spawnParticles(p.x + 12, p.y + 12, '#46e08a', 10);
                tone(900, 0.08, 0.07);
            } else {
                weapon = WEAPONS[p.kind];
                player.weaponTime = p.kind === 'laser' ? 14 : 18;
                spawnParticles(p.x + 12, p.y + 12, p.color || '#7df3ff', 14);
                tone(700, 0.08, 0.08); setTimeout(() => tone(1200, 0.1, 0.07), 80);
                banner = '获得 ' + weapon.name + '！';
                bannerT = 1.8;
            }
            updateHUD();
        }
    }

    /* 通关：必须先击破 BOSS */
    if (P.x >= STAGE_LEN && !boss) {
        gameState = 'win';
        score += lives * 300 + combo * 30;
        if (score > best) { best = score; localStorage.setItem('contra_best', String(best)); }
        banner = '突 突 突 破 ！';
        bannerT = 99;
        updateHUD();
    }
    /* BOSS 战期间持续补充弹药，避免卡死 */
    if (boss && ammo < 20) {
        ammo = Math.min(40, ammo + dt * 12);
    }

    /* BOSS 存在时玩家无法越过终点线 */
    if (boss && P.x > boss.x - 70) { P.x = boss.x - 70; P.vx = 0; }

    if (invuln > 0) invuln -= dt;
    if (bannerT > 0) bannerT -= dt;
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    updateParticles(dt);
}

/* ===================== BOSS ===================== */
function spawnBoss() {
    boss = {
        x: camX + W + 90, y: GROUND - 46, w: 76, h: 90,
        hp: 90, maxHp: 90, t: 0, cool: 1.2, flash: 0,
        entered: false, dead: false, phase: 0
    };
    banner = 'W A R N I N G ！ 铁 血 巨 炮';
    bannerT = 2.6;
    tone(120, 0.5, 0.1);
}

function updateBoss(dt) {
    const B = boss;
    const P = player;
    B.t += dt;
    B.flash -= dt;
    B.cool -= dt;

    if (!B.entered) {
        B.x -= 90 * dt;
        if (B.x <= camX + W - 120) { B.x = camX + W - 120; B.entered = true; B.anchorX = B.x; }
        return;
    }

    /* 移动 & 阶段切换 */
    B.phase = B.hp < B.maxHp * 0.4 ? 2 : (B.hp < B.maxHp * 0.75 ? 1 : 0);
    /* BOSS 停下驻守，玩家追上来即可开打 */
    B.x += (B.anchorX - B.x) * Math.min(1, 1.4 * dt) + Math.sin(B.t * 1.1) * 45 * dt;

    if (B.cool <= 0) {
        if (B.phase === 0) {
            /* 扇形弹幕 */
            B.cool = 1.3;
            for (let k = -3; k <= 3; k++) {
                const ang = Math.PI / 2 + k * 0.24;
                eBullets.push({ x: B.x, y: B.y + 26, vx: Math.cos(ang) * 200, vy: Math.sin(ang) * 200, life: 5 });
            }
        } else if (B.phase === 1) {
            /* 落点轰炸 */
            B.cool = 0.85;
            const tx = P.x + (Math.random() - 0.5) * 220;
            for (let k = 0; k < 3; k++) {
                eBullets.push({ x: tx + k * 26 - 26, y: -20, vx: 0, vy: 300, life: 4, bomb: true });
            }
        } else {
            /* 狂暴旋转弹幕 */
            B.cool = 0.42;
            const base = B.t * 2.4;
            for (let k = 0; k < 8; k++) {
                const ang = base + k * Math.PI / 4;
                eBullets.push({ x: B.x, y: B.y, vx: Math.cos(ang) * 240, vy: Math.sin(ang) * 240, life: 4.5 });
            }
            B.x += Math.sin(B.t * 3) * 60 * dt;
        }
        tone(140, 0.06, 0.04);
    }
}

function damageBoss(dmg, x, y) {
    const B = boss;
    B.hp -= dmg;
    B.flash = 0.07;
    spawnParticles(x, y, '#ffd08a', 4);
    if (B.hp <= 0 && !B.dead) {
        B.dead = true;
        score += 5000;
        shake = 0.6;
        spawnParticles(B.x, B.y, '#ff5c2c', 60);
        for (let i = 0; i < 8; i++) {
            setTimeout(() => spawnParticles(B.x + (Math.random() - 0.5) * 60, B.y + (Math.random() - 0.5) * 60, '#ffcc00', 14), i * 130);
        }
        tone(90, 0.6, 0.12);
        boss = null;
        banner = 'B O S S 击 破 ！';
        bannerT = 2.6;
        /* 掉道具 */
        pickups.push({ x: B.x, y: GROUND - 30, kind: 'spread', color: '#ffd08a' });
        pickups.push({ x: B.x + 40, y: GROUND - 30, kind: 'ammo', amount: 40 });
        updateHUD();
    }
}

/* ===================== 射击 ===================== */
function fire() {
    const P = player;
    const cx = P.x + P.w / 2 + P.aim.x * 16;
    const cy = P.y + P.h / 2 + P.aim.y * 16 - 4;
    const count = weapon.count || 1;
    for (let i = 0; i < count; i++) {
        let ang = Math.atan2(P.aim.y, P.aim.x);
        if (count > 1) ang += (i - (count - 1) / 2) * weapon.spread;
        const sp = weapon.speed * (0.92 + Math.random() * 0.16);
        bullets.push({
            x: cx, y: cy,
            vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
            life: weapon.pierce ? 1.4 : 1.6,
            dmg: weapon.dmg,
            pierce: !!weapon.pierce,
            color: weapon.color
        });
    }
    spawnParticles(cx - P.aim.x * 8, cy - P.aim.y * 8, '#fff8d0', 3);
}

/* ===================== 敌人生成 ===================== */
function spawnEnemy() {
    const side = Math.random() < 0.55 ? 'right' : 'ground';
    let x;
    if (side === 'right') x = camX + W + 30 + Math.random() * 60;
    else x = camX + 120 + Math.random() * (W - 200);
    if (Math.abs(x - player.x) < 190) x += 280;

    const roll = Math.random();
    let type = 'grunt';
    if (roll > 0.86) type = 'turret';
    else if (roll > 0.72) type = 'jumper';
    else if (roll > 0.56) type = 'shooter';
    else if (roll > 0.38) type = 'tank';

    const stats = {
        grunt:   { w: 24, h: 34, hp: 1, speed: 95,  score: 100 },
        shooter: { w: 24, h: 34, hp: 2, speed: 55,  score: 180 },
        tank:    { w: 36, h: 44, hp: 5, speed: 42,  score: 300 },
        jumper:  { w: 26, h: 32, hp: 2, speed: 120, score: 220 },
        turret:  { w: 32, h: 30, hp: 6, speed: 0,   score: 400 }
    }[type];

    enemies.push({
        x, y: GROUND - stats.h,
        w: stats.w, h: stats.h,
        hp: stats.hp, maxHp: stats.hp,
        vx: -stats.speed, vy: 0,
        type, score: stats.score,
        face: -1, t: 0, cool: 1.2, flash: 0,
        shooter: type === 'shooter' || type === 'tank'
    });

    /* 弹药箱 */
    if (Math.random() < 0.3) {
        pickups.push({ x: camX + 150 + Math.random() * (W - 250), y: GROUND - 30, kind: 'ammo', amount: 20, vy: 0 });
    }
    /* 武器箱 */
    if (Math.random() < 0.10) {
        const kinds = ['spread', 'laser', 'rifle'];
        const k = kinds[Math.floor(Math.random() * kinds.length)];
        pickups.push({ x: camX + 150 + Math.random() * (W - 250), y: GROUND - 30, kind: k, vy: 0, color: '#7df3ff' });
    }
}

function hurtPlayer() {
    lives--;
    invuln = 2;
    player.vy = -300;
    combo = 0;
    shake = 0.4;
    score = Math.max(0, score - 80);
    tone(130, 0.22, 0.1);
    if (lives <= 0) {
        gameState = 'lose';
        if (score > best) { best = score; localStorage.setItem('contra_best', String(best)); }
        banner = '任 务 失 败';
        bannerT = 99;
    }
    updateHUD();
}

/* ===================== 粒子 ===================== */
function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 50 + Math.random() * 210;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.35 + Math.random() * 0.4, color, size: 2 + Math.random() * 3 });
    }
}
function spawnDust(x, y) {
    for (let i = 0; i < 5; i++) {
        particles.push({ x: x + (Math.random() - 0.5) * 14, y, vx: (Math.random() - 0.5) * 110, vy: -Math.random() * 60, life: 0.3, color: '#c8b48a', size: 2 + Math.random() * 3 });
    }
}
function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 600 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

/* ===================== 渲染 ===================== */
function render() {
    const sx = shake > 0 ? (Math.random() - 0.5) * shake * 12 : 0;
    const sy = shake > 0 ? (Math.random() - 0.5) * shake * 12 : 0;
    ctx.save();
    ctx.translate(sx, sy);

    /* 背景 */
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#22303f');
    bg.addColorStop(0.55, '#3d4a3a');
    bg.addColorStop(1, '#4a5a3a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    /* 远山 */
    ctx.fillStyle = 'rgba(30,50,45,0.6)';
    for (let i = 0; i < 12; i++) {
        const bx = i * 200 - (camX * 0.3) % 200;
        ctx.beginPath();
        ctx.moveTo(bx - 120, GROUND);
        ctx.quadraticCurveTo(bx, GROUND - 140, bx + 120, GROUND);
        ctx.fill();
    }
    /* 棕榈树 */
    for (let i = 0; i < 10; i++) {
        const bx = i * 190 - (camX * 0.6) % 190;
        ctx.fillStyle = '#4a3a22';
        ctx.fillRect(bx + 40, GROUND - 110, 9, 110);
        ctx.fillStyle = '#2f6b35';
        for (let f = 0; f < 5; f++) {
            const a = -Math.PI / 2 + (f - 2) * 0.55;
            ctx.beginPath();
            ctx.ellipse(bx + 44 + Math.cos(a) * 26, GROUND - 112 + Math.sin(a) * 20, 26, 9, a, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    /* 地面 */
    ctx.fillStyle = '#5a4a2e';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#6b5836';
    ctx.fillRect(0, GROUND, W, 12);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    for (let i = 0; i < W; i += 46) {
        const ox = (i - (camX % 46));
        ctx.fillRect(ox, GROUND + 20, 14, 5);
        ctx.fillRect(ox + 22, GROUND + 40, 18, 5);
    }
    /* 终点线 */
    {
        const gx = STAGE_LEN - camX;
        if (gx > -60 && gx < W + 60) {
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            for (let i = 0; i < 8; i++) for (let j = 0; j < 2; j++) {
                if ((i + j) % 2 === 0) ctx.fillRect(gx + i * 12, GROUND + j * 12, 12, 12);
            }
        }
    }

    /* 掉落物 */
    for (const p of pickups) {
        const px = p.x - camX;
        if (px < -40 || px > W + 40) continue;
        const bob = Math.sin(performance.now() * 0.005 + p.x) * 2;
        ctx.save();
        ctx.translate(px, p.y + bob);
        if (p.kind === 'ammo') {
            ctx.fillStyle = '#46e08a';
            ctx.fillRect(-12, -12, 24, 24);
            ctx.fillStyle = '#2a8f52';
            ctx.fillRect(-12, -12, 24, 6);
            ctx.fillRect(-12, 6, 24, 6);
            ctx.fillStyle = '#0a2a18';
            ctx.font = 'bold 15px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('A', 0, 1);
        } else {
            const col = p.kind === 'spread' ? '#ffb04d' : (p.kind === 'laser' ? '#7df3ff' : '#b0ff9d');
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#0b1018';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(p.kind === 'spread' ? 'S' : (p.kind === 'laser' ? 'L' : 'R'), 0, 1);
        }
        ctx.restore();
    }

    /* BOSS */
    if (boss) drawBoss(boss);

    /* 敌人 */
    for (const e of enemies) {
        if (e.dead) continue;
        const ex = e.x - camX;
        if (ex < -60 || ex > W + 60) continue;
        drawSoldier(ex, e.y, e.w, e.h, e.face, e.type, e.flash > 0, e.maxHp, e.hp, e.t);
    }

    /* 玩家 */
    {
        const P = player;
        if (!(invuln > 0 && Math.floor(invuln * 16) % 2 === 0)) {
            drawSoldier(P.x - camX, P.y, P.w, P.h, P.facing, 'hero', false, 1, 1, P.walk, P.onGround);
            /* 枪口火焰 */
            if (muzzle > 0) {
                const mx = P.x - camX + P.w / 2 + P.aim.x * 26;
                const my = P.y + P.h / 2 - 4 + P.aim.y * 26;
                ctx.fillStyle = '#fff3b0';
                ctx.beginPath();
                ctx.arc(mx, my, 7 + muzzle * 40, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    /* 子弹 */
    for (const b of bullets) {
        ctx.strokeStyle = b.color || '#fff8b0';
        ctx.lineWidth = weapon.pierce ? 4 : 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(b.x - camX, b.y);
        ctx.lineTo(b.x - camX - b.vx * 0.016, b.y - b.vy * 0.016);
        ctx.stroke();
    }
    for (const b of eBullets) {
        ctx.fillStyle = b.bomb ? '#ff9a3c' : '#ff4d4d';
        if (b.bomb) {
            ctx.beginPath();
            ctx.arc(b.x - camX, b.y, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,220,150,0.8)';
            ctx.beginPath();
            ctx.arc(b.x - camX, b.y, 3, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(b.x - camX, b.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    /* 粒子 */
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    /* 弹药显示 */
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(W - 150, 12, 138, 30);
    ctx.fillStyle = ammo === 0 ? '#ff5c5c' : '#46e08a';
    ctx.font = 'bold 16px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('弹药 ' + ammo, W - 140, 28);

    /* 连击 */
    if (combo > 1) {
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 20px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'right'; ctx.textBaseline = 'top';
        ctx.fillText('连击 x' + combo, W - 16, 14);
    }

    /* BOSS 血条 */
    if (boss) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(60, 18, W - 120, 10);
        ctx.fillStyle = '#ff5c5c';
        ctx.fillRect(60, 18, (W - 120) * Math.max(0, boss.hp / boss.maxHp), 10);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('铁 血 巨 炮', W / 2, 12);
    }

    /* 横幅 */
    if (bannerT > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(0, H / 2 - 40, W, 62);
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 30px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(banner, W / 2, H / 2 - 8);
    }

    /* 结束 */
    if (gameState !== 'play') {
        ctx.fillStyle = 'rgba(8,12,20,0.78)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = gameState === 'win' ? '#46e08a' : '#ff5c5c';
        ctx.font = 'bold 46px "Noto Sans SC", sans-serif';
        ctx.fillText(gameState === 'win' ? '任 务 完 成' : '任 务 失 败', W / 2, H / 2 - 30);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px "Noto Sans SC", sans-serif';
        ctx.fillText('得分 ' + score + ' · 最高 ' + best, W / 2, H / 2 + 12);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '15px "Noto Sans SC", sans-serif';
        ctx.fillText('点击「重新开始」再战', W / 2, H / 2 + 48);
    }
}

function drawBoss(B) {
    const bx = B.x - camX;
    ctx.save();
    ctx.translate(bx, B.y);
    /* 主体（垂直居中，与碰撞盒一致） */
    ctx.fillStyle = B.flash > 0 ? '#fff' : '#7a2418';
    ctx.beginPath(); ctx.roundRect(-B.w / 2, -B.h / 2, B.w, B.h - 10, 10); ctx.fill();
    ctx.fillStyle = B.flash > 0 ? '#fff' : '#a03020';
    ctx.beginPath(); ctx.roundRect(-B.w / 2 + 6, -B.h / 2 - 18, B.w - 12, 26, 8); ctx.fill();
    /* 炮管 */
    ctx.fillStyle = '#2b3240';
    ctx.fillRect(-B.w / 2 + 6, -B.h / 2 + 12, B.w - 12, 14);
    /* 眼睛 */
    ctx.fillStyle = B.phase === 2 ? '#ffcc00' : '#ff5c5c';
    ctx.beginPath(); ctx.arc(-14, -B.h / 2 + 8, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(14, -B.h / 2 + 8, 7, 0, Math.PI * 2); ctx.fill();
    /* 履带 */
    ctx.fillStyle = '#1b222c';
    ctx.fillRect(-B.w / 2, B.h / 2 - 18, B.w, 14);
    ctx.fillStyle = '#3a4450';
    for (let i = 0; i < 5; i++) ctx.fillRect(-B.w / 2 + 4 + i * 15, B.h / 2 - 16, 8, 10);
    ctx.restore();
}

/* 画一个像素士兵 */
function drawSoldier(x, y, w, h, face, type, flash, maxHp, hp, walk, onGround) {
    ctx.save();
    ctx.translate(x + w / 2, y);
    ctx.scale(face, 1);

    const body = flash ? '#fff' : (type === 'hero' ? '#3d7ef5' : type === 'tank' ? '#7a3fb8' : type === 'turret' ? '#2f7a6a' : type === 'jumper' ? '#d67a1f' : '#c8402e');
    const skin = flash ? '#fff' : '#ffd9b3';

    /* 腿 */
    ctx.fillStyle = flash ? '#fff' : (type === 'hero' ? '#2a4b9e' : '#3a2a1e');
    const lg = (walk !== undefined && onGround) ? Math.sin(walk) * 5 : 0;
    ctx.fillRect(-9, h - 12 + lg, 7, 12);
    ctx.fillRect(2, h - 12 - lg, 7, 12);

    /* 身体 */
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.roundRect(-w / 2, h * 0.32, w, h * 0.5, 5);
    ctx.fill();

    /* 头 */
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(0, h * 0.22, 9, 0, Math.PI * 2);
    ctx.fill();
    /* 头带 / 头盔 */
    ctx.fillStyle = flash ? '#fff' : (type === 'hero' ? '#e84a27' : '#5a2a1e');
    ctx.fillRect(-9, h * 0.14, 18, 4);

    if (type !== 'turret') {
        /* 枪 */
        ctx.fillStyle = '#2b3240';
        ctx.fillRect(4, h * 0.42, 16, 5);
    } else {
        /* 炮台 */
        ctx.fillStyle = '#1e2a26';
        ctx.fillRect(-6, h * 0.3, 26, 9);
        ctx.fillStyle = '#4aa38c';
        ctx.beginPath(); ctx.arc(0, h * 0.42, 8, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();

    /* 敌人血条 */
    if (type !== 'hero' && hp < maxHp) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(x, y - 10, w, 4);
        ctx.fillStyle = '#ff5c5c';
        ctx.fillRect(x, y - 10, w * (hp / maxHp), 4);
    }
}

/* ===================== 音效 ===================== */
let actx = null;
function tone(freq, dur, vol) {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
}

/* ===================== 输入 ===================== */
const keys = { left: false, right: false, up: false, down: false, fire: false, jumpJust: false };
window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') { keys.left = true; e.preventDefault(); }
    if (k === 'arrowright' || k === 'd') { keys.right = true; e.preventDefault(); }
    if (k === 'arrowup' || k === 'w') { keys.up = true; e.preventDefault(); }
    if (k === 'arrowdown' || k === 's') { keys.down = true; e.preventDefault(); }
    if (k === 'z' || k === 'j') { keys.fire = true; e.preventDefault(); }
    if (k === 'x' || k === 'k' || k === ' ') { keys.jumpJust = true; e.preventDefault(); }
    if (k === 'p') togglePause();
});
window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.left = false;
    if (k === 'arrowright' || k === 'd') keys.right = false;
    if (k === 'arrowup' || k === 'w') keys.up = false;
    if (k === 'arrowdown' || k === 's') keys.down = false;
    if (k === 'z' || k === 'j') keys.fire = false;
});

/* 触屏按钮 */
document.querySelectorAll('.tb').forEach(el => {
    const key = el.dataset.key;
    const down = (e) => {
        e.preventDefault();
        if (key === 'left') keys.left = true;
        else if (key === 'right') keys.right = true;
        else if (key === 'up') keys.up = true;
        else if (key === 'down') keys.down = true;
        else if (key === 'fire') keys.fire = true;
        else if (key === 'jump') keys.jumpJust = true;
    };
    const up = (e) => {
        e.preventDefault();
        if (key === 'left') keys.left = false;
        else if (key === 'right') keys.right = false;
        else if (key === 'up') keys.up = false;
        else if (key === 'down') keys.down = false;
        else if (key === 'fire') keys.fire = false;
    };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
});

function togglePause() {
    if (gameState !== 'play') return;
    paused = !paused;
    document.getElementById('pause-btn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
}
let paused = false;

document.getElementById('new-btn').addEventListener('click', reset);
document.getElementById('pause-btn').addEventListener('click', togglePause);
cv.addEventListener('click', () => { if (gameState !== 'play') reset(); });

/* ===================== 主循环 ===================== */
let last = 0;
function loop(ts) {
    if (!last) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.033);
    last = ts;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
