<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>熔渣守卫 · 塔防</title>
<style>
    :root {
        --bg: #0d0a12;
        --panel: rgba(255,255,255,0.06);
        --stroke: rgba(255,255,255,0.13);
        --text: #fff;
        --dim: rgba(255,255,255,0.55);
        --fire: #ff7a3c;
        --gold: #ffcc55;
        --ice: #6cd8ff;
    }
    * { box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
        font-family:'Noto Sans SC', -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { background: radial-gradient(ellipse at 50% 0%, #1c1220, #0d0a12 60%); }
    #wrap { position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:10px; padding:12px; }

    .head { width:100%; max-width:960px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .title h1 { font-size:1.45rem; font-weight:900; letter-spacing:3px; color:var(--fire);
        text-shadow:0 0 20px rgba(255,122,60,0.45); }
    .title p { font-size:0.7rem; color:var(--dim); margin-top:2px; letter-spacing:1px; }
    .scores { display:flex; gap:8px; }
    .box { background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:6px 13px; text-align:center; min-width:68px; }
    .box .k { font-size:0.6rem; color:var(--dim); letter-spacing:1px; }
    .box .v { font-size:1.1rem; font-weight:900; font-variant-numeric:tabular-nums; color:var(--gold); }

    #stage { position:relative; width:100%; max-width:960px; aspect-ratio:16/10;
        border-radius:18px; overflow:hidden; border:1px solid var(--stroke);
        background:#161020; box-shadow:0 20px 60px rgba(0,0,0,0.6); }
    canvas { display:block; width:100%; height:100%; touch-action:none; }

    .bar { width:100%; max-width:960px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .shop { display:flex; gap:7px; flex:1; flex-wrap:wrap; }
    .tw { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:12px; cursor:pointer;
        background:var(--panel); border:1px solid var(--stroke); transition:transform .12s, border-color .12s; }
    .tw:hover { transform:translateY(-2px); border-color:rgba(255,122,60,0.6); }
    .tw.sel { border-color:var(--fire); background:rgba(255,122,60,0.15); }
    .tw.locked { opacity:0.4; cursor:not-allowed; }
    .tw .ic { font-size:1.25rem; }
    .tw .nm { font-size:0.78rem; font-weight:700; }
    .tw .pr { font-size:0.68rem; color:var(--gold); font-variant-numeric:tabular-nums; }
    .btn { padding:9px 18px; border-radius:12px; border:none; cursor:pointer; font-weight:900; letter-spacing:1px;
        color:#1a0d06; background:linear-gradient(90deg,var(--fire),var(--gold)); font-size:0.85rem; }
    .btn.ghost { background:rgba(255,255,255,0.08); color:var(--text); border:1px solid var(--stroke); }
    .btn:disabled { opacity:0.45; cursor:not-allowed; }

    .hint { width:100%; max-width:960px; font-size:0.75rem; color:var(--dim); line-height:1.7; }
    .hint b { color:var(--ice); }

    .overlay { position:absolute; inset:0; display:grid; place-items:center; background:rgba(8,5,12,0.9);
        backdrop-filter:blur(5px); z-index:20; text-align:center; padding:20px; }
    .overlay.hide { display:none; }
    .panel h2 { font-size:1.9rem; font-weight:900; letter-spacing:3px; color:var(--fire); margin-bottom:10px; }
    .panel p { color:var(--dim); font-size:0.88rem; margin-bottom:6px; line-height:1.8; }
    .panel .big { font-size:2.4rem; font-weight:900; color:var(--gold); margin:12px 0; font-variant-numeric:tabular-nums; }

    .tac { position:absolute; inset:0; z-index:10; display:none; }
    .tac.on { display:block; }
    .tbtn { position:absolute; bottom:16px; width:62px; height:62px; border-radius:50%; font-size:1.5rem;
        background:rgba(255,255,255,0.1); border:1.5px solid var(--stroke); display:grid; place-items:center; }
</style>
</head>
<body>
<div id="wrap">
    <div class="head">
        <div class="title">
            <h1>熔渣守卫</h1>
            <p>LAVA GUARDIAN · 塔防</p>
        </div>
        <div class="scores">
            <div class="box"><div class="k">波次</div><div class="v" id="wave">0</div></div>
            <div class="box"><div class="k">生命</div><div class="v" id="hp">20</div></div>
            <div class="box"><div class="k">金币</div><div class="v" id="gold">0</div></div>
            <div class="box"><div class="k">分数</div><div class="v" id="score">0</div></div>
        </div>
    </div>

    <div id="stage">
        <canvas id="cv"></canvas>
        <div class="overlay" id="ov">
            <div class="panel">
                <h2 id="ovTitle">熔渣守卫</h2>
                <p id="ovDesc">在熔岩裂口筑起防线，挡住一波波涌来的熔渣怪。<br>选择炮塔 → 点击地面建造 → 敌人靠近核心就完蛋了。</p>
                <div class="big" id="ovBig" style="display:none"></div>
                <button class="btn" id="ovBtn">开始防守</button>
            </div>
        </div>
    </div>

    <div class="bar">
        <div class="shop" id="shop"></div>
        <button class="btn ghost" id="sellBtn" style="display:none">🔧 拆除</button>
        <button class="btn ghost" id="pauseBtn">⏸ 暂停</button>
        <button class="btn ghost" id="speedBtn">⚡ ×1</button>
    </div>

    <div class="hint">
        <b>操作</b>：点击下方炮塔卡片选择 → 点击空地建造（花金币）· 再次点击已有炮塔可升级 · 拆��返还一半金币<br>
        <b>炮塔</b>：🔥 熔焰塔（单体高伤）· ❄️ 冰霜塔（减速）· ⚡ 雷弧塔（连锁闪电）· 💣 迫击炮（范围溅射）· ❄️🧊 冰墙（减速路障）<br>
        <b>目标</b>：守住核心！每清完一波敌人获得金币，撑过 20 波即胜利。
    </div>
</div>

<script>
(function () {
    'use strict';

    /* ================= 常量 ================= */
    const W = 960, H = 600;
    const TILE = 40;
    const COLS = Math.floor(W / TILE);   // 24
    const ROWS = Math.floor(H / TILE);   // 15
    const CORE = { c: 22, r: 7 };
    const MAX_WAVES = 20;

    const TOWERS = [
        { id: 'fire',  name: '熔焰塔', icon: '🔥', cost: 60,  dmg: 26, rate: 0.85, range: 135, color: '#ff7a3c', desc: '单体高伤' },
        { id: 'ice',   name: '冰霜塔', icon: '❄️', cost: 50,  dmg: 8,  rate: 0.6,  range: 120, color: '#6cd8ff', slow: 0.5, slowT: 1.6, desc: '减速' },
        { id: 'arc',   name: '雷弧塔', icon: '⚡', cost: 90,  dmg: 15, rate: 1.15, range: 150, color: '#c58cff', chain: 3, desc: '连锁闪电' },
        { id: 'mortar',name: '迫击炮', icon: '💣', cost: 110, dmg: 34, rate: 1.9,  range: 220, color: '#ffcc55', splash: 72, minRange: 90, desc: '范围溅射' },
        { id: 'wall',  name: '冰墙',   icon: '🧊', cost: 30,  dmg: 0,  rate: 0,    range: 0,   color: '#8fe8ff', block: true, hp: 12, desc: '减速路障' }
    ];

    const ENEMY_TYPES = [
        { name: '渣怪',   hp: 46,  speed: 52,  reward: 9,  r: 13, color: '#ff6b4a' },
        { name: '石甲',   hp: 130, speed: 32,  reward: 16, r: 17, color: '#9a7f6a', armor: 0.45 },
        { name: '熔岩鼠', hp: 30,  speed: 96,  reward: 11, r: 11, color: '#ffd166' },
        { name: '裂魂',   hp: 88,  speed: 62,  reward: 18, r: 14, color: '#c58cff', immune: true },
        { name: '重岩兽', hp: 420, speed: 26,  reward: 60, r: 26, color: '#b0413e', boss: true }
    ];

    /* ================= 状态 ================= */
    let cv, ctx, W2, H2, DPR = 1;
    let grid = [];              // 占用格
    let towers = [], bullets = [], enemies = [], effects = [], texts = [];
    let coreHp = 20, coreMax = 20, gold = 120, score = 0;
    let wave = 0, waveTimer = 0, spawning = false, spawnQueue = [], spawnTimer = 0, waveSpawnClock = 0;
    let selTower = 'fire', selExisting = null;
    let state = 'menu';         // menu / play / win / lose
    let paused = false, speed = 1;
    let best = parseInt(localStorage.getItem('lava_guardian_best') || '0', 10) || 0;
    let shake = 0, flashHp = 0;
    let hover = null;
    let audioOn = true, actx = null;

    /* ================= 工具 ================= */
    function tone(freq, dur, vol, type) {
        if (!audioOn) return;
        try {
            if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
            if (!actx) return;
            const o = actx.createOscillator(), g = actx.createGain();
            o.type = type || 'square';
            o.frequency.value = freq;
            g.gain.value = vol || 0.05;
            o.connect(g); g.connect(actx.destination);
            const t = actx.currentTime;
            g.gain.setValueAtTime(vol || 0.05, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.start(t); o.stop(t + dur);
        } catch (e) { /* 忽略音频异常 */ }
    }
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function cellCenter(c, r) { return { x: c * TILE + TILE / 2, y: r * TILE + TILE / 2 }; }

    /* ================= 地图 ================= */
    const PATH_CELLS = [
        [0, 7], [1, 7], [2, 7], [2, 6], [2, 5], [3, 5], [4, 5], [4, 4], [4, 3], [5, 3],
        [6, 3], [7, 3], [7, 4], [7, 5], [8, 5], [9, 5], [9, 6], [9, 7], [10, 7], [11, 7],
        [11, 8], [11, 9], [10, 9], [9, 9], [8, 9], [7, 9], [6, 9], [5, 9], [4, 9], [3, 9],
        [3, 10], [3, 11], [4, 11], [5, 11], [6, 11], [7, 11], [8, 11], [8, 12], [8, 13],
        [9, 13], [10, 13], [11, 13], [12, 13], [13, 13], [14, 13], [15, 13], [16, 13],
        [17, 13], [17, 12], [17, 11], [18, 11], [19, 11], [20, 11], [20, 10], [20, 9],
        [20, 8], [21, 8], [22, 8], [22, 7], [22, 7]
    ];

    let pathWorld = [];
    let blocked = new Set();

    function buildMap() {
        grid = [];
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) grid[r][c] = null;
        }
        pathWorld = PATH_CELLS.map(([c, r]) => cellCenter(c, r));
        blocked = new Set();
        PATH_CELLS.forEach(([c, r]) => blocked.add(c + ',' + r));
    }

    function isBuildable(c, r) {
        if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
        if (blocked.has(c + ',' + r)) return false;
        if (grid[r][c]) return false;
        /* 不能把敌人完全堵死：至少留一条通路（简化：核心周围不可建） */
        if (c === CORE.c && r === CORE.r) return false;
        return true;
    }

    /* ================= 波次 ================= */
    function waveComp(w) {
        const q = [];
        const n = 6 + Math.floor(w * 2.1);
        let t = 0;
        for (let i = 0; i < n; i++) {
            let type = '渣怪';
            const r = Math.random();
            if (w >= 3 && r < 0.22) type = '石甲';
            if (w >= 4 && r < 0.38) type = '熔岩鼠';
            if (w >= 6 && r < 0.46) type = '裂魂';
            t += rnd(0.45, 0.95);
            q.push({ type: type, at: t });
        }
        if (w % 5 === 0) q.push({ type: '重岩兽', at: t + 1.2 });
        else if (w % 3 === 0) q.push({ type: '石甲', at: t + 0.6 });
        q.sort((a, b) => a.at - b.at);
        return q;
    }

    function startWave() {
        wave++;
        waveTimer = 0;
        spawning = true;
        spawnQueue = waveComp(wave);
        spawnTimer = 0.4;
        showBanner('第 ' + wave + ' 波来袭！', '#ff7a3c');
        tone(180, 0.35, 0.07, 'sawtooth');
    }

    function spawnEnemy(typeKey) {
        const def = ENEMY_TYPES.find(e => e.name === typeKey);
        if (!def) return;
        const hpScale = 1 + (wave - 1) * 0.16;
        const e = {
            type: def.name, hp: def.hp * hpScale, maxHp: def.hp * hpScale,
            speed: def.speed * (1 + Math.min(0.35, wave * 0.02)),
            reward: def.reward, r: def.r, color: def.color, armor: def.armor || 0,
            immune: !!def.immune, boss: !!def.boss,
            seg: 0, x: pathWorld[0].x, y: pathWorld[0].y,
            slow: 0, slowT: 0, flash: 0, dead: false
        };
        enemies.push(e);
    }

    /* ================= 更新 ================= */
    function update(dt) {
        if (state !== 'play' || paused) return;

        /* 波次调度 */
        if (spawning) {
            spawnTimer -= dt;
            while (spawnQueue.length && spawnQueue[0].at <= waveSpawnClock) {
                const it = spawnQueue.shift();
                spawnEnemy(it.type);
            }
            waveSpawnClock += dt;
            if (!spawnQueue.length) {
                spawning = false;
                waveSpawnClock = 0;
            }
        } else {
            waveTimer -= dt;
            if (waveTimer <= 0) {
                if (wave >= MAX_WAVES) { endGame(true); return; }
                startWave();
                waveTimer = 22;
            }
        }

        /* 敌人移动 */
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (e.dead) { enemies.splice(i, 1); continue; }
            e.flash = Math.max(0, e.flash - dt * 4);
            if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slow = 0; }
            const spd = e.speed * (e.slow > 0 ? 0.45 : 1);
            let moved = 0;
            while (moved < spd * dt && e.seg < pathWorld.length - 1) {
                const tgt = pathWorld[e.seg + 1];
                const dx = tgt.x - e.x, dy = tgt.y - e.y;
                const d = Math.hypot(dx, dy);
                const step = Math.min(d, spd * dt - moved);
                if (d > 0.01) { e.x += dx / d * step; e.y += dy / d * step; }
                moved += step;
                if (step >= d - 0.01) e.seg++;
            }
            /* 撞墙（冰墙）减速 */
            for (const t of towers) {
                if (!t.block || t.hp <= 0) continue;
                if (Math.hypot(t.x - e.x, t.y - e.y) < 30) {
                    e.x -= (e.x - t.x) * 0.6 * dt * 8;
                    e.y -= (e.y - t.y) * 0.6 * dt * 8;
                    e.slow = 1; e.slowT = 0.25;
                }
            }
            /* 到达核心 */
            if (e.seg >= pathWorld.length - 1) {
                coreHp -= e.boss ? 8 : 1;
                flashHp = 0.4; shake = Math.max(shake, e.boss ? 0.5 : 0.2);
                tone(90, 0.2, 0.09, 'sawtooth');
                texts.push({ x: e.x, y: e.y, t: '-' + (e.boss ? 8 : 1), c: '#ff6b6b', life: 0.8 });
                e.dead = true;
                enemies.splice(i, 1);
                if (coreHp <= 0) { endGame(false); return; }
            }
        }

        /* 炮塔 */
        for (const t of towers) {
            t.cd -= dt;
            if (t.block) continue;
            if (t.cd > 0) continue;
            const target = findTarget(t);
            if (!target) continue;
            t.angle = Math.atan2(target.y - t.y, target.x - t.x);
            fireTower(t, target);
            t.cd = t.def.rate * (t.lv === 3 ? 0.72 : 1);
        }

        /* 子弹 */
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.life -= dt;
            b.x += b.vx * dt; b.y += b.vy * dt;
            if (b.kind === 'mortar') {
                /* 迫击炮：抛物线 */
                b.vy += 520 * dt;
                b.t += dt;
                let hit = false;
                for (const e of enemies) {
                    if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 8) {
                        splashDamage(b.x, b.y, b.splash, b.dmg);
                        hit = true; break;
                    }
                }
                if (hit) { effectRing(b.x, b.y, b.splash, '#ffcc55'); bullets.splice(i, 1); continue; }
                if (b.life <= 0 || b.y > H) { bullets.splice(i, 1); }
                continue;
            }
            /* 直线弹 */
            let hit = false;
            for (const e of enemies) {
                if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
                    damage(e, b.dmg, b.slow, b.slowT);
                    if (b.chain > 0) {
                        chainLightning(b, e);
                    }
                    hit = true; break;
                }
            }
            if (hit) { effectSpark(b.x, b.y, b.color); bullets.splice(i, 1); continue; }
            if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) bullets.splice(i, 1);
        }

        /* 特效 */
        for (let i = effects.length - 1; i >= 0; i--) {
            const fx = effects[i];
            fx.life -= dt;
            if (fx.kind === 'ring') fx.r = (1 - fx.life / fx.max) * fx.max;
            else if (fx.kind === 'spark') { fx.vy += 320 * dt; fx.x += fx.vx * dt; fx.y += fx.vy * dt; }
            else if (fx.kind === 'bolt') { }
            if (fx.life <= 0) effects.splice(i, 1);
        }
        for (let i = texts.length - 1; i >= 0; i--) {
            texts[i].life -= dt;
            texts[i].y -= 26 * dt;
            if (texts[i].life <= 0) texts.splice(i, 1);
        }
        shake = Math.max(0, shake - dt * 2);
        flashHp = Math.max(0, flashHp - dt);
    }

    function findTarget(t) {
        let best = null, bestD = Infinity;
        for (const e of enemies) {
            if (e.dead) continue;
            const d = Math.hypot(e.x - t.x, e.y - t.y);
            if (d > t.range) continue;
            if (t.def.minRange && d < t.def.minRange) continue;
            if (d < bestD) { bestD = d; best = e; }
        }
        return best;
    }

    function fireTower(t, target) {
        const ang = Math.atan2(target.y - t.y, target.x - t.x);
        const dmg = t.dmg * (1 + (t.lv - 1) * 0.55);
        if (t.def.id === 'mortar') {
            bullets.push({
                kind: 'mortar', x: t.x, y: t.y, vx: 0, vy: -170, life: 2.2,
                dmg: dmg, splash: t.def.splash, color: t.def.color, r: 6, t: 0, target
            });
            tone(140, 0.1, 0.05, 'triangle');
        } else if (t.def.id === 'arc') {
            /* 雷弧：瞬时连锁 */
            let cur = target, chain = t.def.chain, d = dmg;
            const hitSet = new Set();
            const p0 = { x: t.x, y: t.y };
            while (chain-- > 0 && cur) {
                hitSet.add(cur);
                damage(cur, d, 0, 0);
                effects.push({ kind: 'bolt', x1: p0.x, y1: p0.y, x2: cur.x, y2: cur.y, life: 0.22, max: 0.22, color: '#c58cff' });
                p0.x = cur.x; p0.y = cur.y;
                /* 找最近的下一个 */
                let nx = null, nd = 110;
                for (const e of enemies) {
                    if (hitSet.has(e) || e.dead) continue;
                    const d2 = Math.hypot(e.x - cur.x, e.y - cur.y);
                    if (d2 < nd) { nd = d2; nx = e; }
                }
                cur = nx; d *= 0.72;
            }
            tone(620, 0.08, 0.045, 'sawtooth');
        } else {
            const spd = t.def.id === 'ice' ? 420 : 520;
            bullets.push({
                kind: 'shot', x: t.x, y: t.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
                life: 1.4, dmg: dmg, color: t.def.color, r: t.def.id === 'ice' ? 4 : 5,
                slow: t.def.slow || 0, slowT: t.def.slowT || 0, chain: 0
            });
            tone(t.def.id === 'ice' ? 880 : 320, 0.05, 0.035, 'square');
        }
    }

    function chainLightning(b, first) {
        let cur = first, chain = 3, dmg = b.dmg * 0.7;
        const hitSet = new Set([first]);
        const p0 = { x: b.x, y: b.y };
        while (chain-- > 0) {
            let nx = null, nd = 100;
            for (const e of enemies) {
                if (hitSet.has(e) || e.dead) continue;
                const d = Math.hypot(e.x - cur.x, e.y - cur.y);
                if (d < nd) { nd = d; nx = e; }
            }
            if (!nx) break;
            hitSet.add(nx);
            damage(nx, dmg, 0, 0);
            effects.push({ kind: 'bolt', x1: p0.x, y1: p0.y, x2: nx.x, y2: nx.y, life: 0.2, max: 0.2, color: '#c58cff' });
            p0.x = nx.x; p0.y = cur.y = cur.y;
            p0.y = nx.y;
            cur = nx; dmg *= 0.72;
        }
    }

    function damage(e, dmg, slow, slowT) {
        if (e.dead) return;
        let d = dmg;
        if (e.armor) d *= (1 - e.armor);
        e.hp -= d;
        e.flash = 1;
        if (slow) { e.slow = 1; e.slowT = slowT; }
        if (e.hp <= 0) killEnemy(e);
    }

    function splashDamage(x, y, radius, dmg) {
        for (const e of enemies) {
            const d = Math.hypot(e.x - x, e.y - y);
            if (d <= radius) damage(e, dmg * (1 - d / radius * 0.4), 0, 0);
        }
    }

    function killEnemy(e) {
        if (e.dead) return;
        e.dead = true;
        gold += e.reward;
        score += e.reward * 10;
        texts.push({ x: e.x, y: e.y - e.r, t: '+' + e.reward, c: '#ffcc55', life: 0.9 });
        effectRing(e.x, e.y, e.r * 2.2, e.color);
        shake = Math.max(shake, e.boss ? 0.55 : 0.1);
        tone(e.boss ? 70 : 240, e.boss ? 0.5 : 0.08, e.boss ? 0.12 : 0.04, e.boss ? 'sawtooth' : 'square');
    }

    /* ================= 建造 ================= */
    function towerAt(x, y) {
        for (const t of towers) if (Math.hypot(t.x - x, t.y - y) < 24) return t;
        return null;
    }

    function buildTower(x, y) {
        const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
        const def = TOWERS.find(t => t.id === selTower);
        if (!def) return;
        if (!isBuildable(c, r)) { toast('这里不能建造'); tone(140, 0.1, 0.05, 'square'); return; }
        if (gold < def.cost) { toast('金币不足'); tone(140, 0.1, 0.05, 'square'); return; }
        gold -= def.cost;
        const p = cellCenter(c, r);
        const t = {
            def: def, x: p.x, y: p.y, c: c, r: r, lv: 1, cd: 0,
            range: def.range, dmg: def.dmg,
            angle: -Math.PI / 2, hp: def.block ? def.hp : Infinity, flash: 0
        };
        towers.push(t);
        grid[r][c] = t;
        effectRing(p.x, p.y, 30, def.color);
        tone(520, 0.09, 0.05, 'triangle');
        updateHUD();
    }

    function upgradeTower(t) {
        if (t.lv >= 3) { toast('已达最高等级'); return; }
        const cost = Math.round(t.def.cost * (t.lv === 1 ? 0.8 : 1.4));
        if (gold < cost) { toast('金币不足'); return; }
        gold -= cost;
        t.lv++;
        if (t.def.block) t.hp = Math.round(t.def.hp * (1 + t.lv * 0.6));
        /* 射程/伤害按塔自身成长，不污染共享定义 */
        t.range = Math.round(t.def.range * (t.lv === 2 ? 1.12 : 1.25));
        t.dmg = Math.round(t.def.dmg * (1 + (t.lv - 1) * 0.55));
        effectRing(t.x, t.y, 34, '#ffcc55');
        texts.push({ x: t.x, y: t.y - 18, t: 'LV' + t.lv, c: '#ffcc55', life: 1.1 });
        tone(700, 0.12, 0.06, 'triangle');
        updateHUD();
    }

    function sellTower(t) {
        gold += Math.round(t.def.cost * 0.5);
        grid[t.r][t.c] = null;
        const i = towers.indexOf(t);
        if (i >= 0) towers.splice(i, 1);
        effectRing(t.x, t.y, 26, '#ffffff');
        selExisting = null;
        updateHUD();
    }

    /* ================= 特效 ================= */
    function effectRing(x, y, max, color) { effects.push({ kind: 'ring', x, y, r: 0, max, color, life: 0.42, maxLife: 0.42 }); }
    function effectSpark(x, y, color) { effects.push({ kind: 'spark', x, y, vx: rnd(-60, 60), vy: rnd(-90, -20), color, life: 0.32, maxLife: 0.32 }); }
    function showBanner(t, c) { banner = { t: t, c: c, life: 2.2, maxLife: 2.2 }; }
    let banner = null;
    function toast(msg) { toastMsg = msg; toastLife = 1.8; }
    let toastMsg = '', toastLife = 0;

    /* ================= 渲染 ================= */
    function render() {
        ctx.save();
        if (shake > 0) ctx.translate(rnd(-shake * 7, shake * 7), rnd(-shake * 7, shake * 7));

        /* 背景网格 */
        ctx.fillStyle = '#161020';
        ctx.fillRect(0, 0, W, H);
        for (let c = 0; c <= COLS; c++) {
            ctx.strokeStyle = 'rgba(255,255,255,0.035)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(c * TILE, 0); ctx.lineTo(c * TILE, H); ctx.stroke();
        }
        for (let r = 0; r <= ROWS; r++) {
            ctx.strokeStyle = 'rgba(255,255,255,0.035)';
            ctx.beginPath(); ctx.moveTo(0, r * TILE); ctx.lineTo(W, r * TILE); ctx.stroke();
        }

        /* 熔岩路径 */
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(255,90,40,0.16)';
        ctx.lineWidth = 34;
        strokePath();
        ctx.strokeStyle = '#3a2430';
        ctx.lineWidth = 26;
        strokePath();
        ctx.strokeStyle = '#5c2f28';
        ctx.lineWidth = 18;
        strokePath();
        /* 流动的岩浆纹 */
        ctx.strokeStyle = 'rgba(255,140,60,0.5)';
        ctx.lineWidth = 4;
        ctx.setLineDash([10, 22]);
        ctx.lineDashOffset = -(performance.now() / 40) % 32;
        strokePath();
        ctx.setLineDash([]);

        /* 核心 */
        const cp = cellCenter(CORE.c, CORE.r);
        const pulse = 1 + Math.sin(performance.now() / 320) * 0.06;
        ctx.save();
        ctx.translate(cp.x, cp.y);
        ctx.scale(pulse, pulse);
        const cg = ctx.createRadialGradient(0, 0, 4, 0, 0, 30);
        cg.addColorStop(0, '#fff3c4');
        cg.addColorStop(0.5, '#ffcc55');
        cg.addColorStop(1, 'rgba(255,204,85,0)');
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff8e0';
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        if (flashHp > 0) {
            ctx.fillStyle = 'rgba(255,80,80,' + (flashHp * 0.5) + ')';
            ctx.beginPath(); ctx.arc(cp.x, cp.y, 36, 0, Math.PI * 2); ctx.fill();
        }

        /* 炮塔 */
        for (const t of towers) drawTower(t);

        /* 敌人 */
        for (const e of enemies) drawEnemy(e);

        /* 子弹 */
        for (const b of bullets) {
            if (b.kind === 'mortar') {
                ctx.fillStyle = '#2a2a33';
                ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffcc55';
                ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color; ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        /* 特效 */
        for (const fx of effects) {
            if (fx.kind === 'ring') {
                ctx.globalAlpha = Math.max(0, fx.life / fx.maxLife);
                ctx.strokeStyle = fx.color; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r, 0, Math.PI * 2); ctx.stroke();
                ctx.globalAlpha = 1;
            } else if (fx.kind === 'spark') {
                ctx.globalAlpha = Math.max(0, fx.life / fx.maxLife);
                ctx.fillStyle = fx.color;
                ctx.fillRect(fx.x - 2, fx.y - 2, 4, 4);
                ctx.globalAlpha = 1;
            } else if (fx.kind === 'bolt') {
                ctx.globalAlpha = Math.max(0, fx.life / fx.max);
                ctx.strokeStyle = fx.color; ctx.lineWidth = 2.5;
                ctx.shadowColor = fx.color; ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(fx.x1, fx.y1);
                const mx = (fx.x1 + fx.x2) / 2 + rnd(-16, 16);
                const my = (fx.y1 + fx.y2) / 2 + rnd(-16, 16);
                ctx.lineTo(mx, my);
                ctx.lineTo(fx.x2, fx.y2);
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        /* 飘字 */
        ctx.textAlign = 'center';
        for (const t of texts) {
            ctx.globalAlpha = Math.max(0, t.life);
            ctx.fillStyle = t.c;
            ctx.font = 'bold 15px system-ui, sans-serif';
            ctx.fillText(t.t, t.x, t.y);
            ctx.globalAlpha = 1;
        }

        /* 选中塔的范围圈 */
        const showT = selExisting || (hover ? towerAt(hover.x, hover.y) : null);
        if (showT) {
            ctx.strokeStyle = 'rgba(255,204,85,0.5)';
            ctx.setLineDash([6, 8]);
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(showT.x, showT.y, showT.range, 0, Math.PI * 2); ctx.stroke();
            ctx.setLineDash([]);
        }
        /* 待建预览 */
        if (selTower && hover && isBuildable(Math.floor(hover.x / TILE), Math.floor(hover.y / TILE))) {
            const def = TOWERS.find(t => t.id === selTower);
            ctx.globalAlpha = 0.35;
            ctx.fillStyle = def.color;
            ctx.beginPath(); ctx.arc(hover.x, hover.y, 16, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.setLineDash([5, 6]);
            ctx.beginPath(); ctx.arc(hover.x, hover.y, def.range, 0, Math.PI * 2); ctx.stroke();
            ctx.setLineDash([]);
        }

        /* 横幅 */
        if (banner && banner.life > 0) {
            ctx.globalAlpha = Math.min(1, banner.life / 0.5);
            ctx.textAlign = 'center';
            ctx.fillStyle = banner.c;
            ctx.font = '900 34px system-ui, sans-serif';
            ctx.shadowColor = banner.c; ctx.shadowBlur = 20;
            ctx.fillText(banner.t, W / 2, 90);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }
        /* toast */
        if (toastLife > 0) {
            toastLife -= 1 / 60;
            ctx.globalAlpha = Math.min(1, toastLife);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffcc55';
            ctx.font = 'bold 17px system-ui, sans-serif';
            ctx.fillText(toastMsg, W / 2, H - 26);
            ctx.globalAlpha = 1;
        }

        ctx.restore();
    }

    function strokePath() {
        ctx.beginPath();
        ctx.moveTo(pathWorld[0].x, pathWorld[0].y);
        for (let i = 1; i < pathWorld.length; i++) ctx.lineTo(pathWorld[i].x, pathWorld[i].y);
        ctx.stroke();
    }

    function drawTower(t) {
        const def = t.def;
        ctx.save();
        ctx.translate(t.x, t.y);
        /* 底座 */
        ctx.fillStyle = 'rgba(20,16,28,0.9)';
        ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = def.color; ctx.lineWidth = 2;
        ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;

        if (def.block) {
            /* 冰墙 */
            const h = 20 + t.lv * 3;
            ctx.fillStyle = '#8fe8ff';
            ctx.globalAlpha = 0.85;
            ctx.fillRect(-14, -h / 2, 28, h);
            ctx.globalAlpha = 1;
            ctx.strokeStyle = '#d8f6ff'; ctx.lineWidth = 1.5;
            ctx.strokeRect(-14, -h / 2, 28, h);
            /* 血量 */
            const hr = t.hp / (def.hp * (1 + (t.lv - 1) * 0.6));
            ctx.fillStyle = hr > 0.4 ? '#46e08a' : '#ff6b6b';
            ctx.fillRect(-14, h / 2 + 4, 28 * clamp(hr, 0, 1), 3);
        } else {
            /* 炮身 */
            ctx.rotate(t.angle);
            ctx.fillStyle = def.color;
            ctx.fillRect(0, -4, 20, 8);
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(0, -1, 20, 2);
            ctx.rotate(-t.angle);
            ctx.fillStyle = def.color;
            ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath(); ctx.arc(-3, -3, 4, 0, Math.PI * 2); ctx.fill();
        }
        /* 等级 */
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffcc55';
        ctx.font = 'bold 11px system-ui, sans-serif';
        ctx.fillText('★'.repeat(t.lv), 0, -22);
        ctx.restore();
    }

    function drawEnemy(e) {
        ctx.save();
        ctx.translate(e.x, e.y);
        if (e.slow > 0) { ctx.shadowColor = '#6cd8ff'; ctx.shadowBlur = 12; }
        ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
        if (e.boss) {
            /* 巨型岩兽 */
            ctx.beginPath();
            ctx.moveTo(-e.r, -e.r * 0.6);
            ctx.lineTo(-e.r * 0.4, -e.r);
            ctx.lineTo(e.r * 0.5, -e.r * 0.9);
            ctx.lineTo(e.r, -e.r * 0.3);
            ctx.lineTo(e.r * 0.8, e.r * 0.8);
            ctx.lineTo(-e.r * 0.6, e.r);
            ctx.closePath(); ctx.fill();
            ctx.shadowBlur = 0;
            /* 眼 */
            ctx.fillStyle = '#ffe08a';
            ctx.beginPath(); ctx.arc(-7, -6, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, -6, 4, 0, Math.PI * 2); ctx.fill();
        } else if (e.type === '裂魂') {
            ctx.globalAlpha = 0.82;
            ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-4, -3, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, -3, 2.5, 0, Math.PI * 2); ctx.fill();
        } else if (e.type === '熔岩鼠') {
            ctx.beginPath(); ctx.ellipse(0, 0, e.r * 1.2, e.r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff8c4a';
            ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(-2, -14); ctx.lineTo(1, -6); ctx.fill();
            ctx.beginPath(); ctx.moveTo(4, -6); ctx.lineTo(8, -14); ctx.lineTo(10, -6); ctx.fill();
        } else if (e.type === '石甲') {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = i / 6 * Math.PI * 2 - 0.4;
                const rr = e.r * (i % 2 ? 0.82 : 1);
                ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr);
            }
            ctx.closePath(); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.beginPath(); ctx.arc(-4, -5, 4, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath(); ctx.arc(-4, -3, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, -3, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;
        /* 血条 */
        if (e.hp < e.maxHp) {
            const w = e.r * 2;
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(-w / 2, -e.r - 9, w, 4);
            ctx.fillStyle = e.boss ? '#ff5c5c' : '#46e08a';
            ctx.fillRect(-w / 2, -e.r - 9, w * clamp(e.hp / e.maxHp, 0, 1), 4);
        }
        ctx.restore();
    }

    /* ================= HUD ================= */
    function updateHUD() {
        document.getElementById('wave').textContent = wave + '/' + MAX_WAVES;
        document.getElementById('hp').textContent = Math.max(0, coreHp);
        document.getElementById('gold').textContent = Math.floor(gold);
        document.getElementById('score').textContent = score;
    }

    /* ================= 商店 UI ================= */
    function buildShop() {
        const shop = document.getElementById('shop');
        shop.innerHTML = '';
        TOWERS.forEach((def, i) => {
            const d = document.createElement('div');
            d.className = 'tw' + (i === 0 ? ' sel' : '');
            d.dataset.id = def.id;
            d.innerHTML = '<span class="ic">' + def.icon + '</span>' +
                '<span><span class="nm">' + def.name + '</span><br><span class="pr">' + def.cost + ' 金 · ' + def.desc + '</span></span>';
            d.addEventListener('click', () => {
                selTower = def.id; selExisting = null;
                shop.querySelectorAll('.tw').forEach(x => x.classList.remove('sel'));
                d.classList.add('sel');
                document.getElementById('sellBtn').style.display = 'none';
                tone(660, 0.05, 0.03, 'square');
            });
            shop.appendChild(d);
        });
    }

    /* ================= 交互 ================= */
    function canvasPos(e) {
        const r = cv.getBoundingClientRect();
        const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
        const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
        return { x: cx / r.width * W, y: cy / r.height * H };
    }

    function onCanvasClick(e) {
        if (state !== 'play') return;
        const p = canvasPos(e);
        const t = towerAt(p.x, p.y);
        if (t) {
            selExisting = t;
            document.getElementById('sellBtn').style.display = '';
            toast(t.def.name + ' LV' + t.lv + '（再点升级）');
            return;
        }
        selExisting = null;
        document.getElementById('sellBtn').style.display = 'none';
        buildTower(p.x, p.y);
    }

    /* ================= 游戏流程 ================= */
    function reset() {
        buildMap();
        towers = []; bullets = []; enemies = []; effects = []; texts = [];
        coreHp = 20; coreMax = 20; gold = 200; score = 0;
        wave = 0; waveTimer = 4; spawning = false; spawnQueue = []; spawnTimer = 0; waveSpawnClock = 0;
        selTower = 'fire'; selExisting = null;
        shake = 0; flashHp = 0; banner = null;
        paused = false; speed = 1;
        document.getElementById('pauseBtn').textContent = '⏸ 暂停';
        document.getElementById('speedBtn').textContent = '⚡ ×1';
        buildShop();
        updateHUD();
    }

    function endGame(win) {
        state = win ? 'win' : 'lose';
        const ov = document.getElementById('ov');
        document.getElementById('ovTitle').textContent = win ? '防守成功！' : '核心沦陷…';
        document.getElementById('ovDesc').innerHTML = win
            ? '熔渣潮终于退去，核心保住了。<br>你撑过了全部 ' + MAX_WAVES + ' 波进攻。'
            : '熔渣涌进了核心，防线崩了。<br>第 ' + wave + ' 波 —— 再试一次？';
        const big = document.getElementById('ovBig');
        big.style.display = '';
        big.textContent = '得分 ' + score;
        document.getElementById('ovBtn').textContent = '再来一局';
        ov.classList.remove('hide');
        if (win) {
            if (score > best) { best = score; localStorage.setItem('lava_guardian_best', String(best)); }
            tone(660, 0.16, 0.07, 'triangle');
            setTimeout(() => tone(880, 0.16, 0.07, 'triangle'), 150);
            setTimeout(() => tone(1180, 0.3, 0.07, 'triangle'), 300);
        } else {
            tone(120, 0.4, 0.09, 'sawtooth');
        }
    }

    /* ================= 初始化 ================= */
    function resize() {
        const stage = document.getElementById('stage');
        const rect = stage.getBoundingClientRect();
        DPR = Math.min(2, window.devicePixelRatio || 1);
        W2 = Math.round(rect.width); H2 = Math.round(rect.height);
        cv.width = Math.round(W * DPR);
        cv.height = Math.round(H * DPR);
        cv.style.width = '100%'; cv.style.height = '100%';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    function init() {
        cv = document.getElementById('cv');
        ctx = cv.getContext('2d');
        resize();
        window.addEventListener('resize', resize);
        reset();
        state = 'menu';
        updateHUD();

        cv.addEventListener('click', onCanvasClick);
        cv.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
        cv.addEventListener('touchend', (e) => { e.preventDefault(); onCanvasClick(e); }, { passive: false });
        cv.addEventListener('mousemove', (e) => { hover = canvasPos(e); });
        cv.addEventListener('mouseleave', () => { hover = null; });

        document.getElementById('ovBtn').addEventListener('click', () => {
            reset();
            state = 'play';
            document.getElementById('ov').classList.add('hide');
            tone(440, 0.1, 0.05, 'triangle');
        });

        document.getElementById('sellBtn').addEventListener('click', () => {
            if (selExisting) { sellTower(selExisting); document.getElementById('sellBtn').style.display = 'none'; }
        });

        document.getElementById('pauseBtn').addEventListener('click', (e) => {
            paused = !paused;
            e.target.textContent = paused ? '▶ 继续' : '⏸ 暂停';
        });

        document.getElementById('speedBtn').addEventListener('click', (e) => {
            speed = speed === 1 ? 2 : (speed === 2 ? 3 : 1);
            e.target.textContent = '⚡ ×' + speed;
        });

        /* 键盘快捷 */
        window.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') {
                paused = !paused;
                document.getElementById('pauseBtn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
            }
            if (e.key === ' ') { e.preventDefault(); speed = speed === 1 ? 2 : 1; document.getElementById('speedBtn').textContent = '⚡ ×' + speed; }
            const n = parseInt(e.key, 10);
            if (n >= 1 && n <= TOWERS.length) {
                selTower = TOWERS[n - 1].id; selExisting = null;
                document.querySelectorAll('.tw').forEach((x, i) => x.classList.toggle('sel', i === n - 1));
            }
        });
    }

    /* ================= 主循环 ================= */
    let last = 0;
    function loop(ts) {
        if (!last) last = ts;
        let dt = Math.min((ts - last) / 1000, 0.05);
        last = ts;
        if (state === 'play' && !paused) {
            const steps = speed;
            for (let i = 0; i < steps; i++) update(dt);
        }
        render();
        requestAnimationFrame(loop);
    }

    init();
    requestAnimationFrame(loop);

    /* 调试接口（方便无头测试与排错） */
    window.__LAVA__ = {
        get state() { return state; }, set state(v) { state = v; },
        get towers() { return towers; }, get enemies() { return enemies; },
        get gold() { return gold; }, set gold(v) { gold = v; },
        get coreHp() { return coreHp; }, get score() { return score; },
        get wave() { return wave; }, get life() { return life; },
        get waveTimer() { return waveTimer; }, get spawning() { return spawning; },
        get bullets() { return bullets; }, get effects() { return effects; },
        get combo() { return combo; }, get maxCombo() { return maxCombo; },
        get stageLv() { return stageLv; }, get songTime() { return songTime; },
        get notes() { return notes; }, get chart() { return chart; },
        buildTower, upgradeTower, update, render, reset, fireTower, findTarget,
        set selTower(v) { selTower = v; }, get selTower() { return selTower; },
        start() { reset(); state = 'play'; }
    };
})();
</script>
