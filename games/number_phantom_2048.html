<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数字幻方 · 2048</title>
<style>
    :root {
        --bg: #16161a;
        --panel: rgba(255, 255, 255, 0.06);
        --stroke: rgba(255, 255, 255, 0.12);
        --text: #ffffff;
        --dim: rgba(255, 255, 255, 0.58);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
        font-family: 'Noto Sans SC', -apple-system, "Segoe UI", sans-serif; }
    #wrap { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 16px; gap: 12px; }

    .head { display: flex; align-items: flex-end; justify-content: space-between; width: 100%; max-width: 460px; gap: 12px; }
    .title h1 { font-size: 1.7rem; font-weight: 900; letter-spacing: 2px; }
    .title p { font-size: 0.74rem; color: var(--dim); margin-top: 3px; letter-spacing: 1px; }
    .scores { display: flex; gap: 8px; }
    .box { background: var(--panel); border: 1px solid var(--stroke); border-radius: 12px; padding: 7px 14px; text-align: center; min-width: 84px; }
    .box .k { font-size: 0.64rem; color: var(--dim); letter-spacing: 1px; }
    .box .v { font-size: 1.25rem; font-weight: 900; font-variant-numeric: tabular-nums; }

    .bar { display: flex; gap: 8px; width: 100%; max-width: 460px; }
    .btn { flex: 1; padding: 11px; border-radius: 12px; border: 1px solid var(--stroke); cursor: pointer;
        background: var(--panel); color: var(--text); font-family: inherit; font-size: 0.88rem; font-weight: 700; letter-spacing: 1px; }
    .btn:hover { background: rgba(255,255,255,0.12); }
    .btn.primary { background: linear-gradient(90deg, #ffcc00, #ff9e2c); color: #241a05; border: none; }

    #board {
        width: 100%; max-width: 460px; aspect-ratio: 1;
        background: #24242b; border-radius: 16px; padding: 10px;
        display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px;
        position: relative; box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    }
    .cell { background: #34343d; border-radius: 10px; display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: clamp(1.2rem, 5.5vw, 2.1rem); transition: background 0.12s ease; }
    .cell.filled { animation: pop 0.16s ease-out; }
    @keyframes pop { from { transform: scale(0.75); } to { transform: scale(1); } }
    .cell[data-v="2"]    { background: #eee4da; color: #776e65; }
    .cell[data-v="4"]    { background: #ede0c8; color: #776e65; }
    .cell[data-v="8"]    { background: #f2b179; color: #fff; }
    .cell[data-v="16"]   { background: #f59563; color: #fff; }
    .cell[data-v="32"]   { background: #f67c5f; color: #fff; }
    .cell[data-v="64"]   { background: #f65e3b; color: #fff; }
    .cell[data-v="128"]  { background: #edcf72; color: #fff; }
    .cell[data-v="256"]  { background: #edcc61; color: #fff; }
    .cell[data-v="512"]  { background: #edc850; color: #fff; }
    .cell[data-v="1024"] { background: #edc53f; color: #fff; }
    .cell[data-v="2048"] { background: #edc22e; color: #fff; }
    .cell.big { font-size: clamp(0.95rem, 4vw, 1.55rem); }
    .cell.huge { font-size: clamp(0.78rem, 3.2vw, 1.25rem); }

    #overlay {
        position: absolute; inset: 0; background: rgba(20, 20, 25, 0.88); border-radius: 16px;
        display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 5;
    }
    #overlay.show { display: flex; }
    #overlay h2 { font-size: 1.6rem; font-weight: 900; }
    #overlay p { color: var(--dim); font-size: 0.9rem; }
    #overlay .btn { width: 160px; flex: none; }

    .tip { font-size: 0.72rem; color: var(--dim); letter-spacing: 1px; text-align: center; }
    .tip b { color: #ffcc00; }
</style>
</head>
<body>
<div id="wrap">
    <div class="head">
        <div class="title">
            <h1>数字幻方</h1>
            <p>2048 · 合并成更大的数字</p>
        </div>
        <div class="scores">
            <div class="box"><div class="k">分数</div><div class="v" id="score">0</div></div>
            <div class="box"><div class="k">最高</div><div class="v" id="best">0</div></div>
        </div>
    </div>

    <div id="board"></div>

    <div class="bar">
        <button class="btn" id="undo-btn">↩ 悔一步</button>
        <button class="btn primary" id="new-btn">新的一局</button>
    </div>

    <p class="tip">方向键 / WASD / 滑动 移动 · 目标 <b>2048</b></p>

    <div id="overlay">
        <h2 id="ov-title">游戏结束</h2>
        <p id="ov-desc"></p>
        <button class="btn primary" id="ov-btn">再来一局</button>
    </div>
</div>

<script>
'use strict';

const SIZE = 4;
const board = document.getElementById('board');
const overlay = document.getElementById('overlay');

let grid = [];
let score = 0;
let best = parseInt(localStorage.getItem('g2048_best') || '0', 10) || 0;
let history = [];
let over = false;
let won = false;
let touchStart = null;

/* ---------------- 初始化 ---------------- */
function init() {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
        grid.push(new Array(SIZE).fill(0));
    }
    score = 0;
    over = false;
    won = false;
    history = [];
    addTile();
    addTile();
    render();
    overlay.classList.remove('show');
    document.getElementById('score').textContent = '0';
    document.getElementById('best').textContent = best;
}

function addTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
            if (grid[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return false;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return true;
}

/* ---------------- 渲染 ---------------- */
function render() {
    board.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const d = document.createElement('div');
            d.className = 'cell';
            const v = grid[r][c];
            if (v) {
                d.textContent = v;
                d.dataset.v = v;
                d.classList.add('filled');
                if (v >= 1024) d.classList.add('big');
                if (v >= 100000) d.classList.add('huge');
            }
            board.appendChild(d);
        }
    }
    document.getElementById('score').textContent = score;
    if (score > best) {
        best = score;
        localStorage.setItem('g2048_best', String(best));
        document.getElementById('best').textContent = best;
    }
}

/* ---------------- 移动逻辑 ---------------- */
function cloneGrid(g) { return g.map(row => row.slice()); }

/* 将一行/列压缩合并，返回 [结果行, 本次得分] */
function mergeLine(line) {
    const arr = line.filter(v => v !== 0);
    const out = [];
    let gain = 0;
    for (let i = 0; i < arr.length; i++) {
        if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
            const nv = arr[i] * 2;
            out.push(nv);
            gain += nv;
            i++;
        } else {
            out.push(arr[i]);
        }
    }
    while (out.length < SIZE) out.push(0);
    return [out, gain];
}

function move(dir) {
    if (over) return;
    history.push({ g: cloneGrid(grid), s: score });
    if (history.length > 30) history.shift();

    const before = JSON.stringify(grid);
    let gain = 0;

    if (dir === 'left' || dir === 'right') {
        for (let r = 0; r < SIZE; r++) {
            let line = grid[r].slice();
            if (dir === 'right') line.reverse();
            const [out, g] = mergeLine(line);
            if (dir === 'right') out.reverse();
            grid[r] = out;
            gain += g;
        }
    } else {
        for (let c = 0; c < SIZE; c++) {
            let line = [];
            for (let r = 0; r < SIZE; r++) line.push(grid[r][c]);
            if (dir === 'down') line.reverse();
            const [out, g] = mergeLine(line);
            if (dir === 'down') out.reverse();
            for (let r = 0; r < SIZE; r++) grid[r][c] = out[r];
            gain += g;
        }
    }

    if (JSON.stringify(grid) === before) {
        history.pop();
        return;
    }

    score += gain;
    addTile();
    render();

    if (!won && grid.some(row => row.some(v => v >= 2048))) {
        won = true;
        showOverlay('达 成 2048！', '你合出了 2048！继续挑战更高的数字吧。', '继续');
    }
    if (!canMove()) {
        over = true;
        showOverlay('游 戏 结 束', '最终得分 ' + score + '，最高 ' + best + '。', '再来一局');
    }
}

function canMove() {
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const v = grid[r][c];
            if (v === 0) return true;
            if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
            if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
        }
    }
    return false;
}

function undo() {
    if (!history.length || over) return;
    const h = history.pop();
    grid = h.g;
    score = h.s;
    render();
}

/* ---------------- 覆盖层 ---------------- */
function showOverlay(title, desc, btn) {
    document.getElementById('ov-title').textContent = title;
    document.getElementById('ov-desc').textContent = desc;
    document.getElementById('ov-btn').textContent = btn;
    overlay.classList.add('show');
}

document.getElementById('ov-btn').addEventListener('click', () => {
    if (document.getElementById('ov-title').textContent.indexOf('2048') >= 0) {
        overlay.classList.remove('show');
        won = true;
    } else {
        init();
    }
});
document.getElementById('new-btn').addEventListener('click', init);
document.getElementById('undo-btn').addEventListener('click', undo);

/* ---------------- 输入 ---------------- */
window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') { move('left'); e.preventDefault(); }
    else if (k === 'arrowright' || k === 'd') { move('right'); e.preventDefault(); }
    else if (k === 'arrowup' || k === 'w') { move('up'); e.preventDefault(); }
    else if (k === 'arrowdown' || k === 's') { move('down'); e.preventDefault(); }
    else if (k === 'z') undo();
    else if (k === 'n') init();
});

/* 触屏滑动 */
window.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
window.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
}, { passive: true });

init();
</script>
</body>
</html>
