<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>修仙人生模拟器</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" />
<style>
  :root{
    --ink:#05070d;
    --jade:#4fe3c1;
    --gold:#ffd479;
    --text:#e2ecf6;
    --muted:#7f8fa3;
    --line:rgba(120,180,200,0.16);
    --q0:#8b98a6;
    --q1:#63a9ff;
    --q2:#c07bff;
    --q3:#ffb84d;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; }
  body{
    margin:0;
    padding:20px 16px 28px;
    display:flex;
    background:
      radial-gradient(1100px 620px at 50% -14%, #13233c 0%, rgba(19,35,60,0) 62%),
      radial-gradient(880px 600px at 88% 114%, #1c1533 0%, rgba(28,21,51,0) 58%),
      var(--ink);
    color:var(--text);
    font-family:"Noto Sans SC",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;
    max-width:560px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ---------- 页头 ---------- */
  .head{ display:flex; align-items:center; gap:13px; }
  .seal{
    width:44px; height:44px; flex:0 0 44px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Serif SC",serif; font-size:19px;
    color:var(--gold);
    background:linear-gradient(145deg,#1c3b34,#0b1817);
    border:1px solid rgba(79,227,193,0.3);
    box-shadow:inset 0 0 20px rgba(79,227,193,0.16), 0 6px 16px rgba(0,0,0,0.5);
  }
  .head h1{
    margin:0;
    font-family:"Noto Serif SC",serif;
    font-size:25px; letter-spacing:6px; font-weight:700;
    color:#eaf6ff;
    text-shadow:0 0 22px rgba(79,227,193,0.2);
  }
  .head .sub{
    margin:3px 0 0;
    font-size:11px; letter-spacing:2.4px; color:var(--muted);
  }

  /* ---------- 通用面板 ---------- */
  .panel{
    border-radius:14px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(20,38,54,0.5), rgba(8,14,24,0.5));
    padding:14px;
  }
  .panel-title{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:10px;
  }
  .panel-title h2{
    margin:0;
    font-family:"Noto Serif SC",serif;
    font-size:17px; letter-spacing:3px; font-weight:600;
    color:#eaf6ff;
  }
  .panel-title .tip{ font-size:11.5px; color:var(--muted); letter-spacing:1px; }

  .btn{
    width:100%;
    padding:13px 20px;
    border:none; border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    font-size:14.5px; letter-spacing:2.5px;
    color:#04211b;
    background:linear-gradient(135deg,#96f4da,#4fe3c1 46%,#ffd479);
    box-shadow:0 10px 24px rgba(79,227,193,0.26);
    transition:transform .14s ease, box-shadow .14s ease, opacity .14s ease;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 14px 30px rgba(79,227,193,0.36); }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.ghost{
    color:#cfe4f2;
    background:rgba(28,48,64,0.55);
    border:1px solid var(--line);
    box-shadow:none;
  }
  .btn.ghost:hover{ background:rgba(38,66,86,0.6); box-shadow:none; }

  /* ---------- 天赋卡 ---------- */
  .tgrid{ display:flex; flex-direction:column; gap:8px; margin:12px 0 4px; }
  .tcard{
    position:relative;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid rgba(120,180,200,0.14);
    background:rgba(16,26,38,0.65);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .12s ease;
  }
  .tcard:hover{ transform:translateX(2px); background:rgba(22,36,52,0.75); }
  .tcard.sel{
    border-color:rgba(79,227,193,0.7);
    background:rgba(31,64,62,0.5);
    box-shadow:0 0 0 1px rgba(79,227,193,0.25) inset, 0 0 20px rgba(79,227,193,0.12);
  }
  .tcard .tn{
    font-family:"Noto Serif SC",serif;
    font-size:15px; font-weight:600; letter-spacing:1.6px;
  }
  .tcard .td{ font-size:11.5px; color:#9fb2c4; margin-top:3px; line-height:1.6; }
  .tcard .tq{
    position:absolute; right:10px; top:9px;
    font-size:10px; letter-spacing:1.4px; padding:2px 6px; border-radius:4px;
    border:1px solid currentColor; opacity:.8;
  }
  .q0 .tn, .q0 .tq{ color:var(--q0); }
  .q1 .tn, .q1 .tq{ color:var(--q1); }
  .q2 .tn, .q2 .tq{ color:var(--q2); }
  .q3 .tn, .q3 .tq{ color:var(--q3); }
  .q3.sel{ box-shadow:0 0 0 1px rgba(255,184,77,0.35) inset, 0 0 22px rgba(255,184,77,0.16); }

  /* ---------- 属性分配 ---------- */
  .attr-list{ display:flex; flex-direction:column; gap:2px; margin:4px 0 2px; }
  .attr-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 2px;
    border-bottom:1px dashed rgba(120,180,200,0.12);
  }
  .attr-row .an{ width:64px; font-size:13px; letter-spacing:1.4px; color:#c2d4e2; }
  .attr-row .ad{ flex:1; font-size:11px; color:var(--muted); line-height:1.5; }
  .step{
    width:30px; height:30px; flex:0 0 30px;
    border-radius:8px; cursor:pointer;
    border:1px solid rgba(120,180,200,0.2);
    background:rgba(24,40,56,0.7);
    color:#d6e8f5; font-size:16px; line-height:1;
    font-family:inherit;
  }
  .step:active{ background:rgba(79,227,193,0.25); }
  .attr-row .av{
    width:34px; text-align:center;
    font-family:"Noto Serif SC",serif; font-size:17px; color:var(--jade);
  }
  .points-bar{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:10px; font-size:12px; color:var(--muted); letter-spacing:1px;
  }
  .points-bar b{ color:var(--gold); font-family:"Noto Serif SC",serif; font-size:16px; }

  /* ---------- 人生状态栏 ---------- */
  .status{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  }
  .cell{
    padding:7px 9px;
    border-radius:10px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(26,48,66,0.5), rgba(10,17,28,0.5));
    min-width:0;
  }
  .cell .k{ font-size:10px; letter-spacing:1.5px; color:var(--muted); }
  .cell .v{
    font-family:"Noto Serif SC",serif; font-size:17px; font-weight:600;
    color:var(--jade); text-shadow:0 0 14px rgba(79,227,193,0.3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cell .v.gold{ color:var(--gold); text-shadow:0 0 14px rgba(255,212,121,0.3); }
  .cell .v.small{ font-size:13px; }

  .xpwrap{ margin-top:8px; }
  .xphead{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); letter-spacing:1px; }
  .xpbar{
    margin-top:5px; height:6px; border-radius:99px;
    background:rgba(120,180,200,0.12);
    overflow:hidden;
  }
  .xpfill{
    height:100%; width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,#2f9e8b,#4fe3c1 60%,#ffd479);
    box-shadow:0 0 10px rgba(79,227,193,0.5);
    transition:width .35s ease;
  }

  /* ---------- 事件流 ---------- */
  .log{
    margin-top:12px;
    max-height:38vh;
    overflow-y:auto;
    padding-right:4px;
    scroll-behavior:smooth;
  }
  .ev{
    display:flex; gap:8px;
    padding:7px 0;
    border-bottom:1px dashed rgba(120,180,200,0.1);
    animation:fadeUp .3s ease both;
  }
  .ev .age{
    flex:0 0 38px;
    font-family:"Noto Serif SC",serif;
    font-size:11px; color:var(--muted);
    padding-top:2px;
  }
  .ev .txt{ font-size:12.5px; line-height:1.75; color:#cfdfeb; }
  .ev.big .txt{ color:#fff3cf; }
  .ev.bad .txt{ color:#ff9aad; }
  .ev.good .txt{ color:#8ff0d6; }
  .ev.you .txt{ color:#ffd479; font-family:"Noto Serif SC",serif; letter-spacing:.5px; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .actions{ display:flex; gap:8px; }
  .actions .btn{ flex:1; }

  /* ---------- 抉择弹层 ---------- */
  .modal{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    padding:22px;
    background:rgba(3,6,11,0.86);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    opacity:0; pointer-events:none;
    transition:opacity .24s ease;
  }
  .modal.show{ opacity:1; pointer-events:auto; }
  .mbox{
    width:100%; max-width:430px;
    border-radius:16px;
    border:1px solid rgba(255,212,121,0.28);
    background:linear-gradient(180deg,#0d1826,#070c15);
    padding:18px 16px;
    max-height:88vh; overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,0.6), 0 0 40px rgba(255,212,121,0.08);
  }
  .mbox .mq{
    margin:0 0 12px;
    font-size:12.5px; line-height:1.8; color:#b7c9d8;
    text-align:center;
  }
  .mopts{ display:flex; flex-direction:column; gap:9px; }

  .choiceStory{
    max-height:38vh; overflow-y:auto;
    padding:10px 12px; margin-bottom:6px;
    text-align:left;
    border-radius:10px;
    border-left:2px solid rgba(79,227,193,0.35);
    background:rgba(10,20,32,0.55);
  }
  .choiceStory p{ margin:0 0 8px; font-size:12.5px; line-height:1.9; color:#c2d3e0; }
  .choiceStory p:last-child{ margin-bottom:0; }
  .choiceStory i{
    font-style:normal; font-size:11px; color:#5f7488;
    margin-right:6px; letter-spacing:1px;
  }
  .mopt{
    text-align:left;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid rgba(120,180,200,0.18);
    background:rgba(20,34,48,0.7);
    color:#dbe9f4;
    font-family:inherit; font-size:13px; letter-spacing:.6px;
    cursor:pointer;
    transition:border-color .14s ease, background .14s ease;
    line-height:1.6;
  }
  .mopt:hover{ border-color:rgba(79,227,193,0.5); background:rgba(28,50,60,0.8); }

  /* ---------- 结算 ---------- */
  .summary-title{
    font-family:"Noto Serif SC",serif;
    font-size:20px; letter-spacing:4px; text-align:center;
    color:#fff3cf; margin:2px 0 4px;
  }
  .summary-sub{ text-align:center; font-size:11.5px; color:var(--muted); letter-spacing:1.5px; margin-bottom:12px; }
  .srow{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:7px 0; font-size:12.5px; color:var(--muted);
    border-bottom:1px dashed rgba(120,180,200,0.12);
  }
  .srow b{ font-family:"Noto Serif SC",serif; font-size:15px; color:var(--jade); }
  .srow b.gold{ color:var(--gold); }
  .inherit{
    margin:14px 0 2px; padding:10px 12px;
    border-radius:10px; border:1px dashed rgba(255,212,121,0.28);
    background:rgba(38,32,18,0.25);
    font-size:11.5px; color:#cdbb92; line-height:1.7;
  }

  .hint{ margin:0; text-align:center; font-size:11px; line-height:1.8; color:var(--muted); letter-spacing:.8px; }

  /* ---------- 天劫 ---------- */
  .tribuBox{ text-align:center; }
  .tribuTitle{
    font-family:"Noto Serif SC",serif;
    font-size:23px; letter-spacing:11px; font-weight:700;
    color:#ffd479; margin:0 0 10px;
    text-shadow:0 0 26px rgba(255,120,100,0.45);
  }
  .tribuDots{
    font-size:15px; letter-spacing:7px; margin-bottom:10px;
  }
  .tribuDots span.on{ color:#ffd479; text-shadow:0 0 12px rgba(255,212,121,0.9); }
  .tribuDots span.off{ color:#ff5c7a; opacity:.2; }
  .tribuBox .mq{ min-height:44px; color:#c6a98c; }
  .tribuInfo{
    font-size:11.5px; color:#8fa3b6; letter-spacing:1px;
    margin-bottom:12px;
  }

  /* ---------- 机缘转盘 ---------- */
  .wheelBox{ text-align:center; }
  .wheelWrap{
    position:relative;
    width:100%; max-width:300px;
    aspect-ratio:1/1;
    margin:10px auto 16px;
  }
  #wheelCanvas{
    width:100%; height:100%; display:block;
    transform-origin:50% 50%;
    transition:transform 2.9s cubic-bezier(.15,.72,.22,1);
  }
  .wheelPin{
    position:absolute; left:50%; top:2%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:17px solid #ffd479;
    filter:drop-shadow(0 0 9px rgba(255,212,121,0.85));
    z-index:3;
  }
  .wheelResult{
    min-height:22px;
    font-size:13.5px; line-height:1.7;
    font-family:"Noto Serif SC",serif;
    color:#ffd479;
    letter-spacing:1px;
    margin-bottom:14px;
    opacity:0;
    transition:opacity .3s ease;
  }
  .wheelResult.show{ opacity:1; }

  .wheelBox .btn{
    background:linear-gradient(135deg,#4fe3c1,#ffd479);
    color:#06121a;
    font-weight:600;
    letter-spacing:6px;
  }

  .ending{
    margin:0 0 11px;
    padding:10px 12px;
    text-align:left;
    border-left:2px solid var(--gold);
    background:rgba(255,212,121,0.055);
    border-radius:0 10px 10px 0;
  }
  .ek{
    font-family:"Noto Serif SC",serif;
    font-size:14px; letter-spacing:3px; color:var(--gold);
    margin-bottom:6px;
  }
  .et{
    font-size:12.5px; line-height:1.95; color:#c2d3e0;
  }

  .hintline{
    margin:9px 2px 0;
    font-size:11px; line-height:1.7; color:#5d7086; letter-spacing:1px; text-align:center;
  }

  .raceLine{
    margin-top:7px;
    font-size:11px; color:#7f94a8; letter-spacing:1px;
  }

  /* 转生轮盘 */
  .originBox{ text-align:center; }
  .originBox .mq{ font-size:12px; color:#8fa5b8; letter-spacing:3px; margin-bottom:8px; }
  .originName{
    font-family:"Noto Serif SC",serif;
    font-size:22px; letter-spacing:5px; color:var(--gold);
    min-height:32px; margin-top:6px;
  }
  .originDesc{ font-size:12px; color:#9fb3c6; min-height:34px; line-height:1.7; padding:0 10px; }
  /* ============================================================
     界面美化层
  ============================================================ */
  body{
    background:
      radial-gradient(1200px 700px at 50% -18%, #17304d 0%, rgba(23,48,77,0) 64%),
      radial-gradient(900px 620px at 90% 112%, #241a44 0%, rgba(36,26,68,0) 58%),
      radial-gradient(700px 500px at 0% 40%, rgba(20,58,54,0.55) 0%, rgba(20,58,54,0) 70%),
      linear-gradient(180deg,#05070d,#04060b 60%,#06080f);
  }
  body::before{
    content:'';
    position:fixed; inset:0; z-index:-1;
    background-image:
      linear-gradient(rgba(120,180,200,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,180,200,0.035) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(circle at 50% 22%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 22%, #000 0%, transparent 78%);
  }

  .app{ gap:16px; }

  .head h1{
    background:linear-gradient(120deg,#fff8e2,#ffd479 42%,#8ff0d6 96%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    text-shadow:none;
    filter:drop-shadow(0 2px 18px rgba(255,212,121,0.18));
  }
  .seal{
    animation:sealGlow 5.2s ease-in-out infinite;
  }
  @keyframes sealGlow{
    0%,100%{ box-shadow:inset 0 0 20px rgba(79,227,193,0.14), 0 6px 16px rgba(0,0,0,0.5); }
    50%{ box-shadow:inset 0 0 26px rgba(79,227,193,0.3), 0 8px 22px rgba(0,0,0,0.55), 0 0 18px rgba(79,227,193,0.16); }
  }
  .head .sub{ color:#8b9db2; }
  .head::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(90deg, rgba(255,212,121,0.34), rgba(255,212,121,0));
    margin-left:4px;
    align-self:flex-end;
    margin-bottom:8px;
  }

  .panel{
    position:relative;
    border-radius:16px;
    border:1px solid rgba(120,180,200,0.18);
    background:
      radial-gradient(120% 100% at 50% 0%, rgba(38,66,86,0.42) 0%, rgba(12,20,32,0.55) 62%),
      linear-gradient(180deg, rgba(14,24,36,0.92), rgba(7,12,20,0.94));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.045),
      inset 0 0 40px rgba(79,227,193,0.035),
      0 14px 34px rgba(0,0,0,0.34);
  }
  .panel::before{
    content:'';
    position:absolute; left:18px; right:18px; top:0; height:1px;
    background:linear-gradient(90deg, rgba(255,212,121,0), rgba(255,212,121,0.55) 30%, rgba(79,227,193,0.45) 72%, rgba(79,227,193,0));
    pointer-events:none;
  }
  .panel::after{
    content:'';
    position:absolute; left:12px; right:12px; bottom:0; height:1px;
    background:linear-gradient(90deg, rgba(120,180,200,0), rgba(120,180,200,0.22), rgba(120,180,200,0));
    pointer-events:none;
  }

  .status .cell{
    position:relative;
    border-radius:12px;
    background:linear-gradient(180deg, rgba(32,58,78,0.5), rgba(9,16,26,0.55));
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);
    overflow:hidden;
  }
  .status .cell::before{
    content:'';
    position:absolute; left:0; top:8px; bottom:8px; width:2px;
    background:linear-gradient(180deg, rgba(79,227,193,0.7), rgba(79,227,193,0));
  }
  .cell .v{ letter-spacing:0.5px; }

  /* 法宝 / 道侣 两格 */
  .status2{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;
  }
  .minicard{
    display:flex; align-items:center; gap:7px;
    padding:7px 10px;
    border-radius:11px;
    border:1px solid rgba(120,180,200,0.14);
    background:linear-gradient(180deg, rgba(24,40,54,0.4), rgba(9,15,24,0.5));
    min-width:0;
    transition:border-color .25s ease, box-shadow .25s ease;
  }
  .minicard .mk{
    flex:0 0 auto;
    font-size:9.5px; letter-spacing:1.6px; color:#7f94a8;
    padding:2px 6px; border-radius:5px;
    border:1px solid rgba(120,180,200,0.2);
  }
  .minicard b{
    flex:1; min-width:0;
    font-family:"Noto Serif SC",serif;
    font-size:11.5px; font-weight:600; letter-spacing:.6px;
    color:#9fb3c6;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .minicard.on{
    border-color:rgba(255,212,121,0.38);
    background:linear-gradient(180deg, rgba(40,48,30,0.35), rgba(16,20,12,0.45));
    box-shadow:0 0 16px rgba(255,212,121,0.1) inset;
  }
  .minicard.on b{ color:#ffd479; }
  #mc-mate.on{
    border-color:rgba(79,227,193,0.4);
    background:linear-gradient(180deg, rgba(22,52,48,0.4), rgba(8,20,18,0.5));
    box-shadow:0 0 16px rgba(79,227,193,0.12) inset;
  }
  #mc-mate.on b{ color:#8ff0d6; }

  .xpbar{
    height:7px; border-radius:99px;
    background:rgba(120,180,200,0.1);
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.5);
  }
  .xpfill{ box-shadow:0 0 14px rgba(79,227,193,0.55); }

  .raceLine{ letter-spacing:.6px; }

  .log{ padding-left:2px; }
  .ev{
    border-bottom:1px dashed rgba(120,180,200,0.08);
    padding-left:9px;
    position:relative;
  }
  .ev::before{
    content:'';
    position:absolute; left:0; top:9px; bottom:9px; width:2px;
    border-radius:2px;
    background:rgba(120,180,200,0.22);
  }
  .ev.big::before{ background:linear-gradient(180deg,#ffd479,rgba(255,212,121,0.15)); }
  .ev.bad::before{ background:linear-gradient(180deg,#ff9aad,rgba(255,154,173,0.15)); }

  function wheelWeights(){
    var arr = [], total = 0;

      if (WHEEL[i].kind === 'legend') w += Math.min(S.pity || 0, 12) * 0.35;

    var ww = wheelWeights();

    '第四道雷落下时，你听见了钟声。',
    '第五道雷之后，你的耳朵开始流血。',
    '第六道雷把你的影子劈成了两半。',
    '第七道雷落下时，天黑了。',
    '第八道雷无声无息，却让你的骨头都在响。',
    '第九道雷……云层整个塌了下来。'
  ];

  var LEGACY_EVENTS = [
    /* ---------- 幼年 0 - 11 ---------- */
    { a:0, b:11, w:3, t:'你出生在青石镇一户采药人家，屋里常年飘着甘草与陈皮的苦香。' },
    { a:0, b:11, w:2, t:'三岁那年你在后山走失，一位白发老人把你送回村口，临走摸了摸你的头顶，说了句“根骨有趣”。', fx:{ luck:1 } },
    { a:0, b:11, w:2, t:'你自幼体弱，母亲煎了三年的药，才把你养得能跑能跳。', fx:{ body:1 } },
    { a:2, b:11, w:2, t:'庙会上，算命先生捏着你的手掌看了很久，最后摇了摇头，没收钱就走了。' },
    { a:3, b:11, w:2, t:'你把村里祠堂的旧书翻得起了毛边，虽然一个字也不认得。', fx:{ wits:1 } },
    { a:2, b:11, w:2, t:'那年山匪过境，你家的屋子烧塌了半边，父亲把你压在身下，后背留了道疤。', fx:{ body:1 } },
    { a:4, b:11, w:2, t:'陪你长大的老黄狗某天没有回家。你找了一整夜，只捡到它项圈上的一枚铜铃。' },
    { a:5, b:11, w:2, t:'你偷跟着父亲进山采药，抬头看见云雾之上的山巅有光一闪。', fx:{ luck:1 } },
    { a:4, b:11, w:1, once:true, t:'你在溪水里捞到一枚温润的白石，夜里它在掌心微微发烫。【法宝】', fx:{ dxp:40 } },
    { a:5, b:11, w:2, t:'学堂的老先生说，你问的问题书上没有答案，罚你抄了一百遍《千字文》。', fx:{ wits:1 } },
    { a:6, b:11, w:1, t:'你救了一只被夹子夹住的白狐。它没有跑，只是回头看了你很久。', fx:{ luck:1 } },

    /* ---------- 少年 12 - 20 ---------- */
    { a:12, b:20, w:3, t:'郡城来了仙门的人测灵根。轮到你时，掌心的光很淡，却久久不散。',
      ch:{ q:'测灵根的结果出来了，你要如何自处？', o:[
        { t:'叩谢仙师，随他入山门', r:'你成了青云宗最末等的外门弟子，挑水砍柴三年，才摸到第一本炼气口诀。', fx:{ dxp:90 }, set:{ sect:'青云宗' } },
        { t:'自认根骨太差，留在凡俗', r:'你留在镇上守着药铺，但每个夜里都会爬上山头，看那道云间的光。', fx:{ wits:1, luck:1 } }
      ]}},
    { a:13, b:20, w:2, t:'宗门考核，你在同辈里排在最末。师兄把剩下的丹药倒进泥里，说：“别浪费。”', cond:function(P){ return !!P.sect; } },
    { a:14, b:22, w:2, t:'你与同门师兄争一口灵泉，被打断两根肋骨。你记住了他笑起来的样子。', fx:{ body:-1, wits:1 } },
    { a:14, b:22, w:1, t:'夜里你偷看内门弟子练剑，剑光像一道白色的雨。你在墙根站到了天亮。', fx:{ wits:2 } },
    { a:15, b:24, w:1, once:true, t:'你在后山迷路，误入一处废弃洞府，石壁上有半篇残缺的功法。', fx:{ dxp:220 } },
    { a:15, b:24, w:2, t:'师姐把她的旧剑给了你，说是自己用不上了，让你别死在第一次历练里。', cond:function(P){ return !!P.sect; }, fx:{ luck:1, dxp:60 } },
    { a:16, b:24, w:2, t:'你被派去看守丹炉，三个月烧糊了十七炉，也被药气熏出一点门道。', fx:{ body:1 } },
    { a:16, b:24, w:2, t:'山下镇子闹瘟疫，你随师门去施药，看见尸首一具具摆满了城墙根。', fx:{ luck:1 } },
    { a:17, b:25, w:3, t:'有人问你想修什么。你说不出来。有人说为长生，你只是不想再被人踩在脚下。', fx:{ wits:1 } },
    { a:18, b:26, w:2, t:'你在雷雨夜里打坐，忽然有一线灵光落进眉心，雨水在身周三寸处悬停。', fx:{ dxp:180, wits:1 } },

    /* ---------- 青年 20 - 45 ---------- */
    { a:20, b:45, w:3, t:'你第一次独自下山。凡俗的市井吵闹得厉害，你恍惚了一瞬，像从很远的梦里醒来。' },
    { a:22, b:46, w:2, t:'坊市里有人兜售“上古丹药”，丹纹是用针尖刻上去的，你一眼就看出来了。',
      ch:{ q:'摊主笑得殷勤，你要怎么做？', o:[
        { t:'当众揭穿他', r:'摊主恼羞成怒，你被一群人围住。你打赢了，也结下了梁子。', fx:{ luck:-1, dxp:120 } },
        { t:'买一枚，试药', r:'丹药是假的，你在客栈吐了三天血。但也从毒性里悟出一点药性。', fx:{ body:-1, wits:2 } },
        { t:'摇头走开', r:'你走开后，听见身后有人用很轻的声音骂了一句。', fx:{ wits:1 } }
      ]}},
    { a:22, b:50, w:2, t:'荒山里，一个浑身是血的散修攥住你的袖口，气息一口比一口弱。',
      ch:{ q:'你如何应对？', o:[
        { t:'渡一缕真气救他', r:'他醒来后什么也没说，只把一枚旧玉牌塞进你手里，然后消失在雾里。', fx:{ luck:2, dxp:80 } },
        { t:'掰开他的手，转身离开', r:'你走出很远，仍听见身后的咳嗽声。那一夜你没有睡好。', fx:{ wits:1 } }
      ]}},
    { a:23, b:50, w:2, once:true, t:'秘境开启，人群像潮水一样涌进去。你抢到一株三百年份的灵草，也看见有人被踩死在洞口。', fx:{ dxp:260 } },
    { a:24, b:48, w:2, t:'山门大比，你一路杀进前十。你的名字第一次被人念出来，念得还有些迟疑。', fx:{ dxp:200, luck:1 } },
    { a:25, b:50, w:1, t:'同门师妹与你并肩守夜。火光把她的侧脸照得很软，你忽然不敢说话。',
      ch:{ q:'天亮之前，你想说点什么吗？', o:[
        { t:'告诉她你的心意', r:'她说：“修仙之人，最忌牵挂。”可她转身时，耳尖是红的。', fx:{ luck:2, dxp:100 } },
        { t:'装作什么都没发生', r:'你们各自回房。这一夜之后，你们再没有单独说过话。', fx:{ wits:1 } }
      ]}},
    { a:26, b:55, w:1, once:true, t:'你在古战场捡到一截断剑，剑身里锁着一点未散的杀意，握久了连指尖都在抖。', fx:{ dxp:320 } },
    { a:26, b:55, w:2, t:'你被诬陷偷了丹药，长老当众打了你三十戒鞭。你趴在雪地里，忽然明白修为才是道理。', cond:function(P){ return !!P.sect; }, fx:{ body:-1, wits:1 } },
    { a:27, b:60, w:1, t:'有人出高价要买你手里的功法。你拒绝了，当夜就被三个人堵在巷子里。',
      ch:{ q:'他们要你留下东西。', o:[
        { t:'把功法交出去', r:'他们拿了东西就走，还顺手打断了你一条腿。你在地上躺了很久。', fx:{ body:-1 } },
        { t:'拔剑', r:'你杀了两个，第三个跑了。从此你的通缉画像贴满了三座城。', fx:{ dxp:260, luck:-1 } }
      ]}},
    { a:28, b:70, w:1, once:true, t:'你在旧书摊上花三文钱买到一册残卷，回家发现夹层里藏着一张地图。', fx:{ luck:1, dxp:60 } },
    { a:30, b:80, w:1, once:true, t:'一只白鹤在你窗前停了整夜。天亮时它飞走了，留下一根洁白如雪的羽毛。', fx:{ luck:1 } },
    { a:30, b:80, w:2, t:'你在溪边打坐，忽然觉得天地静了一瞬，连风都停下了。', fx:{ dxp:120 } },
    { a:31, b:90, w:2, t:'一颗流星划过夜空，你许了个愿。许完才发觉，自己也不知道在许什么。' },
    { a:32, b:90, w:2, t:'你路过故乡。青石镇已经改了名字，没有人认得你，药铺也换成了一家酒楼。' },
    { a:33, b:95, w:1, t:'你梦见自己死了，醒来时枕头是湿的。你摸了摸自己的脉搏，跳得很稳。', fx:{ body:-1, wits:1 } },
    { a:35, b:120, w:1, once:true, t:'你救了一只受伤的狐狸。它化成人形朝你拜了三拜，转身走进雾里，再没出现过。', fx:{ luck:2 } },
    { a:36, b:120, w:2, t:'你与一名剑修在路上论道三日。你输了半招，却赢了一个朋友。', fx:{ wits:1, dxp:150 } },
    { a:40, b:150, w:3, t:'你在一座荒庙里避雨。神像脸上落满了灰，你伸手替它擦了擦。' },

    { a:18, b:400, w:3, rm:1, t:'你闭关三年，出关时洞口的青苔已长得齐膝，掌心的灵气凝成了一层薄膜。', fx:{ dxp:400 } },

    { a:35, b:600, w:2, once:true, rm:3, t:'一位白发老者与你论道三日，临别时说：“你走的这条路，一千年前有人走过。”', fx:{ dxp:900, wits:1 } },
    { a:40, b:600, w:2, rm:3, t:'你最疼爱的弟子跪在门外，求一颗续命丹。丹只有一颗，而你自己也快了。',

        { t:'收进袖中，紧闭洞府', r:'门外再没有声音。三日后你出关，只看见雪地里一个跪着的影子。', fx:{ dxp:800, luck:-2 } }
      ]}},
    { a:50, b:900, w:2, rm:4, t:'天边有魔气翻涌。你赶到时，一座城一夜之间空了，碗里的粥还是温的。', fx:{ luck:-1, dxp:300 } },
    { a:60, b:900, w:2, once:true, rm:4, t:'魔道中人拦住你，掌心托着一枚血丹：“吞了它，可省你百年苦修。”',
      ch:{ q:'血丹在掌心轻轻跳动，像一颗心。', o:[
        { t:'吞下', r:'修为暴涨，血却从此变得发烫。你听见识海里有个声音在笑。', fx:{ dxp:1800, body:-2, luck:-3 }, set:{ dao:'魔道' } },
        { t:'一掌拍碎', r:'血雾散开时，你看见对方的脸变成了一张很年轻的、在哭的脸。', fx:{ dxp:600, wits:1 } }
      ]}},
    { a:80, b:1200, w:3, once:true, rm:5, t:'旧友一个个坐化了。你替他们守了七日的灯，灯灭时，你谁也没送。' },
    { a:100, b:1500, w:2, once:true, rm:6, t:'你另立道统，山门第一年只来了三个弟子。他们叫你“师祖”，声音又尊敬又害怕。' },
    { a:150, b:2000, w:2, once:true, rm:7, t:'一场大雨里，你看见了自己的道。天地像一张摊开的纸，而你是纸上的一滴墨。', fx:{ dxp:3000 } },
    { a:200, b:3000, w:3, once:true, rm:8, t:'九天之上雷云聚起，云层厚得看不见顶。诸天都在等你踏出那一步。', fx:{ dxp:2000 } },

    { a:90, b:1500, w:2, rm:5, t:'你在一处秘境见到半局残棋，黑白子落了千年，还没有收官。你看了三日，忽然明白了一点什么。', fx:{ dxp:1200, wits:1 } },
    { a:110, b:1800, w:2, once:true, rm:5, t:'你收下一个资质平庸的弟子。他很笨，剑法学了十年还是歪的，但每天都会来扫你的石阶。', fx:{ luck:1 } },
    { a:140, b:2200, w:1, rm:6, t:'有妖族使者带着礼物登门，请你出手一次，代价是一滴心头血。',
      ch:{ q:'你答应吗？', o:[
        { t:'应下，取一滴心头血', r:'你闭关养了三十年才补回来，但那件事之后，你在妖族中有了名字。', fx:{ body:-2, dxp:5000, luck:2 } },
        { t:'送客', r:'使者走后，山门外的槐树落了一地叶子。你觉得这可能是对的。', fx:{ wits:1 } }
      ]}},
    { a:160, b:2500, w:2, rm:7, t:'你走过的地方开始有凡人建庙。庙里供着你的像，脸捏得很不像，香火却很旺。' },
    { a:180, b:2800, w:2, once:true, rm:8, t:'你回望这一生，才发现已经记不清父母的样子了。你坐在山巅，从天黑坐到天亮。', fx:{ wits:2 } },
    { a:200, b:3000, w:2, once:true, rm:8, t:'天劫将至。你把洞府里的东西一件件送人，最后只剩下一把旧剑和一坛酒。' },

    /* ---------- 通用随机 ---------- */
    { a:15, b:999, w:2, t:'你昨夜梦见自己站在云上，脚下是缩小的山川与灯火。醒来时，指尖还残留着风的触感。', fx:{ wits:1 } },
    { a:20, b:999, w:1, t:'坊市有人塞给你一本《修仙速成》，封面写着“三月金丹，七日飞升”，著者“无名散人”。你翻了五页，发现全是抄的。', fx:{ wits:1 } },
    { a:20, b:999, w:2, t:'你养的灵植又死了，第三次。你决定还是养石头。', fx:{ luck:-1 } },
    { a:25, b:999, w:1, t:'有人在你的洞府外放了一篮野果。你查了三天，也没查出是谁。', fx:{ luck:1 } },
    { a:30, b:999, w:2, t:'你花了一整年，只为了让一株枯死的松树重新发芽。它活了的时候，你在树下坐了一整天。', fx:{ wits:1 } },
    { a:40, b:999, w:1, t:'山下有孩童指着你说：“那个仙人，好像很孤单。”你听见了，没有回头。' },

    /* ---------- 幼年补 ---------- */
    { a:1, b:9, w:2, t:'你在祠堂前的石阶上学走路，摔了七次，第八次自己站起来走了三步。', fx:{ body:1 } },
    { a:3, b:10, w:2, t:'镇上来了个说书人，讲的全是仙人的事。你听完回家，把木棍当剑比划了半夜。', fx:{ wits:1 } },

    { a:5, b:11, w:1, t:'邻家女孩送了你一只草编的蚱蜢。你一直留到草都散了，才舍得扔。' },
    { a:3, b:10, w:2, t:'你生了一场大病，郎中摇头。母亲抱着你在祠堂跪了一夜，第二天你退了烧。', fx:{ body:1 } },
    { a:6, b:11, w:2, t:'你第一次看见死人。送葬的队伍很长，纸钱撒了一路，你跟在后面走了很远。' },
    { a:5, b:11, w:1, once:true, t:'你在田埂上捡到一枚生锈的铜钱，擦干净后，上面刻着一个看不懂的字。', fx:{ luck:1 } },

    /* ---------- 少年补 ---------- */
    { a:13, b:24, w:2, once:true, t:'你在后山捡到一把断刀，刀柄上刻着“不悔”两个字。你把它藏在了床下。' },
    { a:14, b:22, w:2, t:'师兄教你怎么偷溜下山，也教你怎么在长老面前哭。你学得很快。', fx:{ wits:1 } },
    { a:15, b:26, w:1, once:true, t:'你在药园遇见一个不说话的老仆。他看你的眼神，像在看一个很久以前的人。' },
    { a:14, b:24, w:2, t:'宗门分发灵米，你那份被换成了陈米。你去讨，被人推倒在泥里。', fx:{ body:-1 } },
    { a:17, b:30, w:1, once:true, t:'你第一次杀人。那是个魔修，临死前说你“眼睛很干净”。你在溪边洗了很久的手。', fx:{ wits:1, luck:-1 } },
    { a:17, b:28, w:2, t:'你在集市上花光了所有灵石，只为买一支给师姐的簪子。她收下了，却从没戴过。', fx:{ luck:1 } },
    { a:18, b:30, w:2, t:'你和同门比试，赢了一场，输了一场。赢的那场你记得，输的那场你也记得。', fx:{ dxp:60 } },

    /* ---------- 中年补 ---------- */
    { a:30, b:200, w:1, t:'你在山道上遇到一个背着棺材的老人。他说，棺材里装的是他自己。' },
    { a:30, b:200, w:2, once:true, t:'你救下一窝被修士斗法震塌的兔子，养了三个月，又放回了山里。', fx:{ luck:1 } },
    { a:35, b:400, w:2, t:'有人在你的酒里下毒。你没有喝，也没有揭穿，只是把酒倒在了对方靴子上。', fx:{ wits:1 } },
    { a:40, b:500, w:2, once:true, t:'你在洞府门口看见一封没有署名的信，纸上只有四个字：“山高水长”。' },

    { a:50, b:800, w:2, once:true, t:'你收到一封旧友的遗书，信纸上有干涸的血，字迹到最后已经不成形了。' },
    { a:55, b:900, w:1, once:true, t:'你在集市上见到一个与你长得一模一样的人。他朝你笑了笑，走进人群，再没出现。', fx:{ luck:-1 } },
    { a:60, b:900, w:2, once:true, t:'你被请去一个凡人家族做客。他们把你当神仙供着，杀了唯一的一头牛。' },

    /* ---------- 抉择补 ---------- */
    { a:20, b:120, w:2, once:true, t:'坊市里有个卖身的少年，跪在雪里，眼神很像当年的你。',
      ch:{ q:'你身上还有一袋灵石。', o:[
        { t:'把他买下来，还他自由', r:'他磕了三个头，然后跑进雪里，再没见过。你的灵石空了，心里却松了一块。', fx:{ luck:2 } },
        { t:'装作没看见，绕过去', r:'雪落在他肩上，一层又一层。你走了很远，还是回头看了一眼。', fx:{ wits:1 } }
      ]}},
    { a:30, b:300, w:2, once:true, t:'你参加了一场修士的婚礼。新娘是被抢来的，手腕上还有绳子勒出的血痕。',
      ch:{ q:'喜乐响起来了。', o:[
        { t:'掀了喜堂，带她走', r:'你得罪了一个不小的世家。新娘走了，你被追杀了三年。', fx:{ luck:2, dxp:300, body:-1 } },
        { t:'低头喝完这杯酒', r:'酒很甜。你听见喜堂后面有人在哭，哭声一直没有停。', fx:{ luck:-2, dxp:120 } }
      ]}},
    { a:40, b:500, w:2, once:true, t:'一个魔修跪在你脚边，说他修魔是为了给死去的妹妹续命。',
      ch:{ q:'你的剑还在滴血。', o:[
        { t:'收剑，放他走', r:'他走了。三十年后，你听说有人用一城人的命炼成了一枚丹。', fx:{ wits:1 } },
        { t:'一剑落下', r:'血溅在你袖口。你擦了很久，擦不干净。', fx:{ dxp:400, luck:-1 } }
      ]}},
    { a:60, b:600, w:2, once:true, t:'一座凡俗小城的城主跪在你面前，求你庇佑一城百姓。城门外，一个世家的旗子已经立起来了。',
      ch:{ q:'应下，就要得罪那个世家。', o:[
        { t:'答应他', r:'你护了这座城两百年。城里的人给你立了碑，碑上写着“仙人不食言”。', fx:{ luck:4, dxp:800 }, deed:'saveCity' },
        { t:'摇头离开', r:'你走的时候，城主还跪着。三年后，那座城成了一片白地。', fx:{ dxp:1200, luck:-3 } }
      ]}},

    /* ---------- 境界补 ---------- */
    { a:20, b:300, w:2, once:true, rm:1, t:'筑基那天，你把旧剑埋在了后山。你觉得它该歇歇了。', fx:{ wits:1 } },
    { a:30, b:400, w:2, once:true, rm:2, t:'你的金丹凝成时，颜色比旁人的淡。长老说，淡的丹往往走得更远。', fx:{ dxp:400 } },
    { a:40, b:500, w:2, once:true, rm:3, t:'元婴出窍的那一夜，你看见自己的身体坐在蒲团上，觉得很陌生。', fx:{ wits:1 } },
    { a:50, b:700, w:2, rm:3, t:'一个魔修头目死在你剑下。他临死前说：“你也会变成我。”', fx:{ luck:-1 } },
    { a:60, b:800, w:2, once:true, rm:4, t:'你开始记不清凡俗的事。母亲的样貌、镇子的路，都像隔了一层雾。', fx:{ wits:1 } },
    { a:70, b:900, w:2, once:true, rm:4, t:'你化神之后第一次回到青石镇。药铺不在了，只剩一块烂掉的招牌。' },
    { a:90, b:1200, w:2, once:true, rm:5, t:'有年轻修士跪在你洞府外的雪地里，求你收他为徒。你想起了自己跪过的那个雪夜。', fx:{ luck:1 } },
    { a:120, b:1500, w:2, once:true, rm:6, t:'你在一处遗迹里看见石刻：“飞升者，无一回头。”你看了很久。' },
    { a:150, b:2000, w:2, once:true, rm:7, t:'你的道统开始有人仿效。他们把你的话刻在石壁上，有几个字刻错了。' },
    { a:200, b:2500, w:2, once:true, rm:8, t:'你遣散了身边的最后一批人。山门空了，你反而睡得踏实。' },

    /* ---------- 通用补 ---------- */
    { a:16, b:999, w:2, t:'你在山巅看了一场极好的日出，看完了才发现自己忘了打坐。' },
    { a:20, b:999, w:1, t:'你把一枚灵石丢给了一个乞丐。他抬头说你“眉间有死气”，然后低头继续吃。', fx:{ luck:-1 } },
    { a:25, b:999, w:1, t:'你养了一株会说话的草。它每天只重复一句：“要下雨了。”', fx:{ luck:1 } },
    { a:30, b:999, w:1, once:true, t:'你在藏书阁翻到一本无字书。翻到最后一页，上面只有一个墨点。', fx:{ wits:1 } },
    { a:40, b:999, w:2, t:'你在雨里走了一整夜。第二天醒来，发现自己的鞋是干的。', fx:{ wits:1 } },
    { a:50, b:999, w:2, once:true, t:'你在一处荒废的山门里看见半块牌匾，上面的字被人刮掉了，只剩下一个“仙”。' },

    /* ---------- 系统流 · 彩蛋 ---------- */
    { a:4, b:30, w:2, once:true, t:[
      '你梦见自己站在一个巨大的、发光的房间里，四面都是字。有个声音念你的名字，念错了一个字。',
      '你在梦里见过一块没有边的光屏，上面写着“加载中”。你等了很久，它一直是“加载中”。' ] },
    { a:8, b:80, w:2, once:true, t:[
      '脑海中响起一个没有起伏的声音：“叮。宿主完成日常修行，奖励【灵石】×3。”你四下张望，什么也没有。',
      '你试着在心里问：“系统？”没有人回答。可你总觉得某处有个东西，轻轻“嗯”了一声。' ], fx:{ luck:1 } },
    { a:12, b:60, w:1, once:true, t:'你的眼前忽然浮起一块半透明的板子：【姓名：你】【境界：……】【评价：还行】。你伸手去碰，它散了。', fx:{ wits:1 } },
    { a:15, b:120, w:1, once:true, t:[
      '有天夜里，你听见极远处有人在说话，像在念一段旁白：“……而他并不知道，这一夜之后，一切都将不同。”',
      '你偶尔会觉得，自己的一生正被某个人看着。那人不怀好意，也不算恶意，只是好奇。' ] },
    { a:20, b:200, w:1, once:true, t:'你在识海里看见一行极小的字：“本世界线已存档。”第二天，那行字变成了“读取失败”。', fx:{ luck:-1 } },
    { a:30, b:300, w:1, once:true, t:'你梦见一个叫“地球”的地方。那里的人用一种发光的板子看别人的一生，看得津津有味。醒来你觉得荒谬。', fx:{ wits:1 } },
    { a:40, b:400, w:1, once:true, t:'你在一处遗迹里读到一个故事：有个人被丢进陌生的世界，靠一块面板活了一辈子。故事结尾只有两个字：“弃坑”。', fx:{ dxp:200 } },

    /* ---------- 抽象 · 荒诞 ---------- */
    { a:6, b:18, w:2, once:true, t:'你在河边捡到一枚铜钱，正反面都是“字”。你把它戴在脖子上，那年开始，你的运气有点怪。', fx:{ luck:2 } },
    { a:10, b:40, w:2, t:[
      '你养的一只鸡每天早上打鸣。有一天它忽然叫了你的名字。你把它炖了，汤很香。',
      '你在院里种了棵树。第二年它长出一朵花，花开时朝你转了个脸。你没敢再看第二眼。' ] },
    { a:12, b:60, w:2, once:true, t:[
      '你在集市上买了一个泥人。第二天它少了一条腿，第三天少了一条胳膊。你没敢再买第二个。',
      '有个瞎子拉住你的袖子，说你身上“有股不属于这里的味道”。你想了一路。' ] },
    { a:16, b:80, w:2, t:[
      '你在一场雨里听见有人叫卖“后悔药”。你回头，雨里什么都没有。',
      '你在山道上遇见一个与自己一模一样的人。两人对视三秒，他先让开了路。' ] },
    { a:18, b:90, w:2, once:true, t:'你捡到一本没有封面的书。前九十九页都是空白，第一百页写着：“你已经看完了。”', fx:{ wits:1 } },
    { a:20, b:120, w:1, once:true, t:'你在夜里听见自己打呼噜。你醒着。' },
    { a:25, b:200, w:2, t:[
      '你开始做梦，梦里你是另一个人，有另一段人生。醒来时你分不清哪一段是真的。',
      '你连续七夜做同一个梦，梦见自己在打坐。第八夜你决定不睡，结果打坐时睡着了。' ] },
    { a:30, b:300, w:2, once:true, t:[
      '你随手救了一只蚂蚁。三天后，洞府门口出现一队搬着米粒的蚂蚁，整齐得像朝贡。',
      '你在洞府门口发现一小堆野果，摆得很整齐。你不知道是谁送的，也没敢吃。' ] },
    { a:35, b:400, w:1, once:true, t:'你在石壁上刻字消遣，刻到一半发现那行字本就是前人刻好的，你只是把它描深了。', fx:{ wits:1 } },

    /* ---------- 晚年 ---------- */
    { a:120, b:999, w:2, t:[
      '你已经很久没有数过自己多少岁了。山下的村子换了几代人，没有人再认得你。',
      '你的名字在凡间渐渐成了一个传闻。传闻里你有一百只手，还有三只眼。' ] },
    { a:150, b:999, w:2, t:[
      '你开始把每年的事刻在石壁上。刻到几百行时，你忘了自己为什么开始刻。',
      '你把从前的剑挖出来擦了一遍，又埋回去。埋的时候，你埋得很深。' ] },
    { a:200, b:999, w:2, t:[
      '有个小姑娘跑上山，问：“仙人也会死吗？”你想了很久，说：“会。”她哭了，你没有安慰她。',
      '山下的镇子改名叫“望仙镇”。你知道他们望的不是你，是他们自己想活成的样子。' ] },
    { a:250, b:999, w:1, once:true, t:'你把这一生认识的人念了一遍。念到最后，有三个名字你想不起来了，但你记得他们的脸。', fx:{ wits:1 } },
    { a:300, b:999, w:2, t:[
      '你在山巅坐了很久，忽然发现自己在等一件事。至于等什么，你忘了。',
      '你开始怕死。这很可笑——你活了这么久，见过那么多人死。' ] },
    { a:400, b:999, w:2, t:[
      '有天你在镜子里看见自己，愣了一下：这张脸，你已经不太认得了。',
      '你终于明白，所谓长生，就是一件一件地送走所有认识的人，最后剩自己一个。' ] },

    /* ---------- 回响 · 多年之后 ---------- */
    { a:8, b:40, w:2, once:true, t:'你在雪地里给一个冻僵的货郎指了路。他记住了你的样子。',
      echo:{ after:60, t:'六十年后，有个白发老人带着孙子来山下烧纸，说当年有个少年替他指了路，救了他一条命。', fx:{ luck:2 } } },
    { a:12, b:60, w:2, once:true, t:'你把半块干粮给了路边一条快饿死的狗。它舔了舔你的手，跑了。',
      echo:{ after:40, t:'四十年后，你在山中遇见一头极老的白狼。它看了你很久，转身走了，没有攻击你。', fx:{ body:1 } } },
    { a:20, b:120, w:2, once:true, t:'你在崖边拉住一个失足的孩子。他吓得说不出话，只是抓着你的衣角不放。',
      echo:{ after:90, t:'九十年后，一个白发老人跪在你洞外，说他小时候被你救过一次，想把孙子送上山。', fx:{ luck:2, dxp:200 } } },
    { a:25, b:200, w:2, once:true, t:'你在一个快要饿死的人碗里放了一块灵石。你不知道他会不会用。',
      echo:{ after:50, t:'五十年后，有个富商捧着那块灵石找上门，说他靠它起家，想还你一份人情。', fx:{ luck:2, dxp:300 } } },
    { a:30, b:300, w:1, once:true, t:'你在一场大雨里埋了一个无名的死者，还替他立了一块没有字的碑。',
      echo:{ after:70, t:'七十年后，那块无字碑前开始有人上香。有人说很灵。你听了，笑了一下。', fx:{ luck:1 } } },
    { a:40, b:400, w:1, once:true, t:'你顺手救下一株被雷劈焦的老树，替它接上了一根枝。',
      echo:{ after:80, t:'八十年后，那棵树长得比山还高，树下聚了一群修士，都说这是福地。你在树上坐着，没人认得你。', fx:{ dxp:600 } } },
    { a:50, b:400, w:1, once:true, t:'你在酒馆里听一个醉汉胡说八道了一整夜。临走时他拉住你，说了句：“你以后要记得我。”',
      echo:{ after:120, t:'一百二十年后，你在旧书里看见了那个醉汉的名字。他成了某本话本的主角，书里说他曾遇见过一位仙人。', fx:{ luck:1 } } },
    { a:45, b:200, w:2, once:true, t:'你在一座无名坟前放了一壶酒。坟主生前说过，死后想有人陪他喝一杯。',
      echo:{ after:35, t:'三十五年后，你在同一座坟前又放了一壶。坟头的草已经很高，酒还是热的。', fx:{ luck:1 } } },
    { a:70, b:300, w:1, once:true, t:'你把一枚旧玉送给山下的一个孩子，随口说：“长大了来山上找我。”',
      echo:{ after:40, t:'四十年后，一个中年修士跪在你洞外，手里攥着那枚旧玉。他说，他来晚了。', fx:{ luck:2, dxp:200 } } },
    { a:100, b:600, w:1, once:true, t:'你把一段剑法刻在石壁上，没有留名字。',
      echo:{ after:60, t:'六十年后，石壁前跪满了人。他们在拜一个不知道是谁的人。你路过，没有停。', fx:{ dxp:500 } } },

    /* ---------- 抉择 ---------- */
    { a:25, b:150, w:2, once:true, t:'有人在你面前跪了一整夜，求你收他为徒。他的资质很差，差到旁人都不愿意看他第二眼。',
      ch:{ q:'天快亮了。', o:[
        { t:'收下他', r:'他学得很慢，慢到你想放弃。但他每天都是第一个到，最后一个走。', fx:{ luck:2 }, deed:'teach' },
        { t:'让他回去', r:'他磕了三个头，走了。多年后你听说他死在一场斗法里，用的是你随手教的一招。', fx:{ dxp:300 } }
      ] } },
    { a:60, b:400, w:2, once:true, t:'一个曾经的仇人跪在你面前。他已经老得握不住剑，只求一个痛快。',
      ch:{ q:'他抬起头看你。', o:[
        { t:'给他一个痛快', r:'剑很快。你替他合上眼，忽然发现自己一点也不快意。', fx:{ wits:1 }, deed:'killOld' },
        { t:'放他走', r:'他走了几步，回头说：“你比我强。”这句话你记了很久。', fx:{ luck:2 }, deed:'spareOld' }
      ] } },
    { a:80, b:600, w:1, once:true, t:'你在一处山谷里发现一个与你年岁相仿的修士，他已经坐化了三百年，脸上还带着笑。',
      ch:{ q:'他的膝上放着一卷手记。', o:[
        { t:'取来看', r:'手记上只有一句：“我这一生，没做过一件后悔的事。”你想了很久自己有没有。', fx:{ wits:2 }, deed:'readNote' },
        { t:'替他埋了', r:'你挖了个坑，把他连同那卷手记一起埋了。埋完你在坟前坐了一夜，什么也没想。', fx:{ luck:2 }, deed:'buryMonk' }
      ] } },
    { a:100, b:700, w:1, once:true, t:'有个年轻人找到你，说他来自很远的后世，专程回来告诉你一句话。',
      ch:{ q:'他说完就走了，留下一句没说完的话。', o:[
        { t:'追上去问清楚', r:'你追了十里，那人像从没存在过。你只记得他说：“别去……”后面的话你没有听清。', fx:{ wits:1 }, deed:'chaseFuture' },
        { t:'站在原地，不再追', r:'你站了很久。有些话，听不清也是一种答案。', fx:{ dxp:500 }, deed:'letGo' }
      ] } },

    /* ---------- 荒诞 · 打脸 · 震惊体 ---------- */
    { a:8, b:300, w:2, t:'你在山上捡到一本《绝世功法》。第一页写着“孤本，阅后请焚毁”，第二页写着“算了，别焚了”。' },
    { a:10, b:999, w:2, t:'一个过路修士看了你一眼，说：“你身上有股味。”你问什么味，他说：“主角味。”' },
    { a:12, b:120, w:2, t:'你在集市上卖符，一天卖出三张。三个人后来都来退货，说符不灵。你才发现自己画的是“再见”两个古字。', fx:{ luck:-1 } },
    { a:12, b:200, w:2, t:'你打死了一只野狗。三天后，它的位置被另一只野狗占了。你忽然明白了点什么，又说不出来。' },
    { a:15, b:200, w:2, t:'你在酒馆听人说，如今修仙界最火的是“苟道流”。你决定也苟一苟。第二天你就出山了。' },
    { a:6, b:40, w:2, t:'有个小孩指着你喊：“就是他，昨天偷吃我家鸡！”你没有辩解，因为确实是你。', fx:{ luck:-1 } },
    { a:16, b:80, w:1, t:'有个女修追了你三座山，说要嫁给你。你跑得更快。后来才知道她认错了人。' },
    { a:20, b:400, w:2, t:'你被人写进了话本，书名叫《那狗日的仙尊》。你翻了三页，觉得文笔不错。', fx:{ luck:1 } },
    { a:25, b:500, w:2, t:'你在一处山洞里看见自己的名字刻在墙上，字迹很旧。你摸了摸，笔迹是你的。', fx:{ wits:1 } },
    { a:10, b:999, w:2, t:'你在雪地里坐了一整夜，第二天居然没死。有人问你怎么做到的，你也想知道。', fx:{ body:2 } },
    { a:14, b:200, w:1, t:'有个小宗门请你当护山大阵的阵眼。你问待遇，他说管饭。你答应了。', fx:{ dxp:150 } },
    { a:30, b:999, w:2, t:'你写了本《修道心得》，卖了三百本。有读者来信说：“全是废话。”你回信说：“谢谢。”', fx:{ wits:1 } },
    { a:60, b:999, w:2, t:'你被雷劈了三次没死。第四次劈下来，你举起了剑。剑碎了，人没事。围观的人只说了一个字：“？”', fx:{ body:2, dxp:300 } },
    { a:18, b:200, w:2, t:'拍卖会上你举了一次牌，全场忽然安静。你以为自己拍到了什么了不得的东西，其实那件东西流拍了。' },
    { a:20, b:999, w:2, t:'你走路时总有人回头看。你以为是自己气度不凡，后来发现是背上挂了一片菜叶。' },
    { a:22, b:200, w:1, t:'你决定从此闭门读书。第三天你读完了所有书——书架上只有三本，而且都是菜谱。', fx:{ wits:1 } },
    { a:25, b:300, w:1, t:'你在江边钓上来一条会说话的鱼。它求你放了它，你放了。第二天它带了群鱼来谢你，全是死鱼。' },
    { a:28, b:300, w:2, t:'你师父说，修仙最重要的是一颗心。你问什么心，他说：“随便什么心，你有就行。”', fx:{ dxp:120 } },
    { a:30, b:400, w:1, t:'你去参加宗门大比，抽签抽到轮空，直接进前三。后来才知道，一共只有三个人参赛。', fx:{ luck:2 } },
    { a:32, b:600, w:1, t:'你在山上种了一片灵田。种下去的是灵石，长出来的是野草。你想了想，决定改种野草。' },
    { a:18, b:999, w:2, rolls:[
      { t:'有个算命的拉住你，说三日内有血光之灾。你三天没出门。第四天出门，摔了一跤。', fx:{ body:-1, luck:1 } },
      { t:'有个算命的拉住你，说三日内有血光之灾。你一脚踢翻他的摊子。当晚你就见了血——他流的。', fx:{ luck:-2, body:-1 } }
    ] },
    { a:20, b:999, w:1, t:'你捡到一枚蛋，孵出一只鸡。这只鸡后来自己学会了引气入体，比你早三年突破。它在你面前踱步的时候，你抬不起头。', fx:{ dxp:200 } },
    { a:35, b:999, w:2, t:'你在拍卖会上花光积蓄买下“上古神器”，回家一看是把菜刀。很好用。你用它削了三十年的灵果。', fx:{ dxp:260 } },
    { a:40, b:999, w:2, t:'有修士上门挑战，说与你分个高下。你问分什么，他说：“你跪下。”你跪了。他反而哭了。' },
    { a:60, b:999, w:2, t:'你在集市上撞见当年嘲笑你修行慢的人。他落魄了，还认得你，低头走了。你没打算说什么，可你在原地站了很久。', fx:{ wits:1 } },

    /* ---------- 荒诞 · 秘境 ---------- */
    { a:20, b:999, w:2, t:'你走进一座洞府，里面空空荡荡，只有一张字条：“来晚了。”' },
    { a:22, b:999, w:1, t:'你在秘境里迷路七天，出来只过了一炷香。你在里面吃掉了所有干粮。', fx:{ luck:-1 } },
    { a:25, b:999, w:2, t:'你在秘境深处看见一座山，山上刻着三个字：“别进来。”你已经进来了。' },
    { a:28, b:999, w:1, t:'你在秘境里捡到一把钥匙，找了三十年也没找到锁。后来你才明白，它就是锁。', fx:{ wits:2 } },
    { a:30, b:999, w:2, t:'你在秘境里和一头守灵兽聊了半年。临走它送你一根骨头，说：“拿着，能唬人。”', fx:{ talismans:1 } },
    { a:35, b:999, w:1, t:'你在秘境里捡到一面镜子，照出来的不是你。你把它翻过去，背面贴着字条：“别照太久。”', fx:{ wits:1 } },
    { a:40, b:999, w:2, rolls:[
      { t:'你推开秘境最深处的门，里面摆着一桌还热的席面，没有人。你坐下吃了一半，忽然不敢再吃。', fx:{ body:2 } },
      { t:'你推开秘境最深处的门，里面摆着一桌席面，已经凉了三百年。桌边坐着一个人，也凉了三百年。', fx:{ wits:1, body:-1 } }
    ] },
    { a:45, b:999, w:1, t:'秘境中央有一口井。你往下看，井里也有个人在往上看你。你们同时挥手，同时僵住。', fx:{ wits:1 } },
    { a:50, b:999, w:2, t:'你在一座空城里转了三天，所有屋子都住过人，所有桌子都摆着两副碗筷。' },
    { a:55, b:999, w:1, t:'你得到一张残缺的地图，标记指向“此处”。你到了那里，地上确实写着“此处”。', fx:{ luck:1 } },

    /* ---------- 荒诞 · 人间 ---------- */
    { a:10, b:300, w:2, t:'你救了个落水的孩子，他家人非要谢你，塞给你一只活鸡。鸡在你怀里一路啄你。', fx:{ luck:1, body:-1 } },
    { a:12, b:400, w:1, t:'你在饭馆吃饭，隔壁桌说你像个高人。你把袖子拢了拢，其实你只是冷。' },
    { a:15, b:999, w:2, t:'有个孩子天天在门口等你，说长大要跟你走。他长大了，早忘了这件事。你还记得。', fx:{ luck:1 } },
    { a:20, b:999, w:2, t:'你被人当成骗子赶出镇子。三个月后那镇子闹妖，他们又请人来找你，你已经走了。' },
    { a:25, b:999, w:1, t:'一个老农请你给他的地看风水。你看不懂，就指了个方向。第二年他家真发了。他给你送了十年米。', fx:{ luck:2 } },
    { a:30, b:999, w:2, t:'你在一场葬礼上被认成了死者的远亲，跟着哭了半场。出了门，你不知道自己为什么哭。' },
    { a:35, b:999, w:1, t:'有个书生一定要拜你为师。你收了他，教他写字。他后来中了状元，回来给你磕头，第一句是：“字帖呢？”', fx:{ luck:2 } },
    { a:40, b:999, w:2, t:'你和一条狗对坐了一下午。它先走的。你觉得自己输了一点什么。' },
    { a:45, b:999, w:1, t:'有人给你送来一坛酒，说是陈了六十年。你喝了，很淡。送来的人自己喝了半坛，脸已经红了。' },
    { a:50, b:999, w:2, t:'你在庙里听见有人给“仙尊”上香。你顺着看过去，那塑像有点眼熟，可脸刻得很不像你。' },

    /* ---------- 异身：狗 ---------- */
    { a:2, b:999, w:3, cond:function(P){ return P.origin === 'dog'; },
      t:'你被镇上的孩子追了半条街。你跑赢了，但没觉得自己赢。', fx:{ body:1 } },
    { a:8, b:999, w:3, cond:function(P){ return P.origin === 'dog'; },
      t:'一个老道士蹲下来摸了摸你的头，说：“这条狗有慧根。”你想点头，只能摇尾巴。', fx:{ luck:2 } },
    { a:15, b:999, w:3, cond:function(P){ return P.origin === 'dog'; },
      t:'你叼回了一只修士掉的储物袋。他感动得哭了，收你当“灵犬”。你是门里第一个四条腿的弟子。', fx:{ dxp:300 } },
    { a:30, b:999, w:3, cond:function(P){ return P.origin === 'dog'; },
      t:'你在山门前蹲了三十年。新来的弟子叫你“门口那条”。你不反驳，只是每次都比前一天蹲得更直。' },
    { a:50, b:999, w:3, cond:function(P){ return P.origin === 'dog'; },
      t:'有天你忽然会说话了。第一句话是：“别叫我狗。”门里安静了很久，然后有人小声说：“那叫什么？”', fx:{ wits:1 } },
    { a:70, b:999, w:3, cond:function(P){ return P.origin === 'dog'; },
      t:'你以狗身渡劫的那天，围观的人挤了三座山。第一道雷落下来，有人喊：“它真接住了？！”', fx:{ body:2 } },
    { a:100, b:999, w:2, cond:function(P){ return P.origin === 'dog'; },
      t:'有画师专程来画你。画完他盯着画看了半天，说：“不像。”你说：“那是我以前的样子。”', fx:{ luck:1 } },

    /* ---------- 异身：树 ---------- */
    { a:2, b:999, w:3, cond:function(P){ return P.origin === 'tree'; },
      t:'有人在你身上刻字。刻到一半他停了，说：“这树怎么在抖。”你没抖，是风。', fx:{ body:-1 } },
    { a:30, b:999, w:3, cond:function(P){ return P.origin === 'tree'; },
      t:'三百年里你长高了两丈。路过的人都说这树有灵。你确实有。', fx:{ dxp:300 } },
    { a:60, b:999, w:2, cond:function(P){ return P.origin === 'tree'; },
      t:'一对男女在你树下发誓，说生生世世。两百年后，只有一个人回来，一个人在你树根边坐了很久。', fx:{ wits:1 } },

    /* ---------- 异身：石 ---------- */
    { a:2, b:999, w:3, cond:function(P){ return P.origin === 'stone'; },
      t:'有人在你身上磨剑，磨了三十年。你被磨掉一层，竟然觉得轻松。', fx:{ dxp:200 } },
    { a:40, b:999, w:2, cond:function(P){ return P.origin === 'stone'; },
      t:'一只狐狸总趴在你身上晒太阳。你没法赶它走。你后来习惯了它的重量。', fx:{ luck:1 } },

    /* ---------- 异身：残魂 ---------- */
    { a:2, b:999, w:3, cond:function(P){ return P.origin === 'ghost'; },
      t:'你附身的这具身体有一个娘，天天抱着你哭。你不知道该不该应一声。', fx:{ luck:-1 } },
    { a:20, b:999, w:2, cond:function(P){ return P.origin === 'ghost'; },
      t:'你在镜子里看见原主的脸，那张脸也在看你。你们谁都没有先移开。', fx:{ wits:1 } },

    /* ---------- 修仙界见闻 ---------- */
    { a:10, b:999, w:2, t:'你听说北边有个宗门把入门费涨了三倍，理由是“灵气通胀，成本上涨”。' },
    { a:12, b:999, w:2, t:'近来修仙界流行一种说法：境界不重要，心态最重要。说这话的人，大多没什么境界。' },
    { a:20, b:999, w:2, t:'有个元婴老祖在集市上摆摊卖凉茶，一天卖八文。你问他为什么，他说：“图个热闹。”', fx:{ luck:1 } },
    { a:25, b:999, w:2, t:'你听说有人为了突破，把自己钉在崖上吹了三年风。他后来确实突破了，也落下了一身的病。', fx:{ body:-1, dxp:200 } },
    { a:30, b:999, w:2, rolls:[
      { t:'西边那座山塌了。塌的时候没人去，塌完之后去了很多人，说是找机缘。你去了，捡到一块石头。', fx:{ luck:1 } },
      { t:'西边那座山塌了。你去晚了，只看见一群人在为一截断木打架。你退了回来。' }
    ] },
    { a:35, b:999, w:2, t:'有人在卖“速成金丹”，吃一颗境界涨一级。买的人后来都死了。卖家换了张脸，还在卖。', fx:{ luck:-1 } },
    { a:40, b:999, w:1, t:'今年修仙界最大的事，是有人把“天劫”写进了律法，规定不准私渡。第一个违反这条的人，当场就渡了。' },
    { a:45, b:999, w:2, t:'有个正道宗门贴出告示：“本门不收心术不正者。”落款下面有人用小字写：“也不收没钱的。”' },
    { a:60, b:999, w:2, t:'你听说南方出了个奇才，九岁筑基。你打听了一下，那孩子已经死了六十年了，消息才传到这里。' },
    { a:80, b:999, w:1, t:'你在一张旧报纸上看见自己的名字，被写在“近百年十大未解之谜”的第七位。' },

    /* ---------- 打脸 · 围观 ---------- */
    { a:12, b:999, w:2, t:'你在街上被人指着说：“这不就是那个废物吗。”你回头看他，他忽然跪下了。' },
    { a:18, b:999, w:2, t:'有个少年拦住你，说要与你比试。你让了三招，第四招他自己摔了。他哭着要拜师。' },
    { a:25, b:999, w:2, t:'你和人论道三天三夜，谁也没说服谁。倒是围观的几个人后来都突破了。', fx:{ luck:2 } },
    { a:30, b:999, w:2, rolls:[
      { t:'你随手一剑，劈开了对面修士的护体灵光。他愣在原地，说：“你这是什么境界？”你说：“不知道。”', fx:{ dxp:400 } },
      { t:'你随手一剑，剑没出鞘。对面修士愣了很久，忽然行礼，说：“受教了。”他走后，你发现剑柄断了。', fx:{ wits:1, dxp:300 } }
    ] },
    { a:40, b:999, w:1, t:'有宗门请你去做客卿，说了三条好处。你听完只问了第四条，他们就没再提了。' },
    { a:50, b:999, w:2, t:'你在一场宴会上被安排在最末席。开席时主人来敬酒，第一杯就给了你，全场安静。', fx:{ luck:2 } },

    /* ---------- 岁月 ---------- */
    { a:100, b:999, w:2, t:'你在一座山顶上看见一块碑，碑上刻满了人名。你往下看，最后一个是你。你在那儿站了很久。', fx:{ wits:1 } },
    { a:120, b:999, w:2, t:'你在旧货摊上买到一本笔记，第一页写：“此书赠有缘人。”后面全是空白。你把它收好，一直没写。' },
    { a:160, b:999, w:2, t:'山下修了条路，通到了你洞府门口。从此每年都有人上来，有的是拜你，有的是来扔东西。' },
    { a:220, b:999, w:2, t:'你忽然想去看看自己出生的那个镇子。到了才发现，镇子早没了，只剩一片庄稼地。', fx:{ wits:1 } },
    { a:300, b:999, w:2, rolls:[
      { t:'有个年轻人上来问你：修到这个地步，值得吗？你想了很久，说：“不知道。”他点点头，走了。', fx:{ wits:1 } },
      { t:'有个年轻人上来问你：修到这个地步，值得吗？你说：“你说呢。”他愣了一下，然后笑了，说：“我懂了。”', fx:{ luck:2 } }
    ] },
    { a:400, b:999, w:2, t:'你开始记不清事情。你把重要的写在石壁上，第二天发现字被人擦掉了一半——是夜里你自己擦的。' },
    { a:500, b:999, w:1, once:true, t:'你在一个晴天里忽然坐了下来。你坐了七天，什么也没想，也什么都没做。第八天你站起来，觉得轻了。', fx:{ dxp:800 } },

    /* ---------- 回响 · 再补 ---------- */
    { a:20, b:200, w:2, t:'你帮一个跛脚的老木匠推了半日车。他非要送你一把刻刀，说：“你以后用得着。”',
      echo:{ after:45, t:'四十五年后，你在一个陌生人的墓前看见一把同式的刻刀。守墓的人说，他师父念叨过一位少年。', fx:{ luck:1 } } },
    { a:40, b:300, w:1, t:'你在雪夜里让一个赶考的书生进了你的洞府避寒，还给他煮了碗汤。',
      echo:{ after:55, t:'五十五年后，一队人马抬着匾额上山，说当年的书生做了官，要谢一位仙人。匾额上写错了你的姓。', fx:{ luck:2 } } },
    { a:80, b:600, w:1, t:'你把门下最不成器的那个弟子赶下了山，还塞给他一袋干粮。',
      echo:{ after:70, t:'七十年后，山下来了个中年人，带着一群孩子。他说他是当年那个被赶走的，如今开了个小学堂。', fx:{ luck:2 }, deed:'teach' } },

    /* ---------- 抉择 · 再补 ---------- */
    { a:30, b:600, w:2, t:'你在山道上遇见一个浑身是血的人，他说后面有人追他，求你救他一命。',
      ch:{ q:'远处已经传来马蹄声。', o:[
        { t:'把他藏起来', r:'你把他埋在柴堆下，追兵来了又走。他后来成了你一生最麻烦的债。', fx:{ luck:1, dxp:400 }, deed:'saveStranger' },
        { t:'让开，不掺和', r:'你侧身让路。马蹄声过去很久，你还站在原地。', fx:{ wits:1 } }
      ] } },
    { a:50, b:900, w:1, t:'有一个声音在你识海里问：“你要不要换一个更快的活法？”代价是，你以后再也想不起自己是谁。',
      ch:{ q:'它等着你回答。', o:[
        { t:'换', r:'你的修为涨得飞快。只是有几次照镜子，你都想不起来镜子里的人叫什么。', fx:{ dxp:2500, wits:-3 } },
        { t:'不换', r:'你说：“我想记得。”那声音笑了一下，就散了。', fx:{ wits:2, luck:1 } }
      ] } },
  ];

  /* ============================================================
     一·B、命轮事件池：离奇、玄幻、超脱
  ============================================================ */

  var EVENTS = [
    /* ---------- 降生 · 异象 ---------- */
    { a:0, b:3, w:3, t:'你出生的那一夜，屋外的雨是从下往上落的。稳婆说这孩子不该生在人间。', fx:{ luck:1 } },
    { a:0, b:4, w:3, t:'你落地时不哭，睁着眼看屋顶。屋顶上有一只眼，也在看你。' },
    { a:1, b:5, w:3, t:'你三岁前从不说话。某天忽然开口，说了一句谁也听不懂的话，说完就再也不提。', fx:{ wits:2 } },
    { a:1, b:6, w:2, t:'有一只通体雪白的狐狸每天蹲在你家门口。你走近，它就退一尺；你退，它就进一尺。' },
    { a:2, b:8, w:2, t:'你在院子里挖出一个陶罐，罐里没有东西，只有一张纸条：“别埋了，我出来了。”', fx:{ luck:-1 } },
    { a:3, b:9, w:3, t:'你梦见自己站在一片没有边的地方，脚下是星。有个声音说：“你来得早了。”', fx:{ dxp:60 } },
    { a:4, b:10, w:2, t:'你家里的老井在夜里会说人话。它说的都是你明天要做的事，一件不差。', fx:{ wits:1 } },
    { a:5, b:11, w:2, t:'你跟着一只青鸟走进山林，走了三天三夜，出来时只过了半日。你身上多了一枚不知来历的印。', fx:{ luck:2 } },
    { a:6, b:11, w:2, t:'村里来了个算命瞎子，摸遍所有孩子的手，唯独跳过了你。有人问为什么，他说：“她命不在册上。”' },
    { a:6, b:12, w:1, once:true, t:'你救了一只被雷劈焦的蟾蜍。它跳走前回头，用人的声音说：“记住了。”', fx:{ luck:2 } },

    /* ---------- 入道 · 仙缘 ---------- */
    { a:12, b:20, w:3, t:'仙门测灵根那日，你掌心的光很淡，却在众人散去后仍亮着。山门里的人围过来，谁也没说话。',
      ch:{ q:'执事问你：这光，你自己知道是怎么回事吗？', o:[
        { t:'说不知道', r:'执事沉默良久，收你入门，只给了一本最旧的口诀。', fx:{ dxp:120 }, set:{ sect:'青云宗' } },
        { t:'说要自己找答案', r:'他放你走了。你在山下坐了三年，才明白那句问话是个门槛。', fx:{ wits:2, luck:1 } }
      ] } },
    { a:13, b:22, w:2, t:'你误入一座没有门派的道观。观里只有一张蒲团，蒲团上有个人形的凹痕，还温着。', fx:{ dxp:180 } },
    { a:14, b:24, w:2, t:'你在河里捞起一柄剑。剑身上刻着你的名字，刻痕比你出生还早六十年。', fx:{ dxp:200, luck:1 } },
    { a:15, b:26, w:2, t:'一位白衣人对你说：“三日后有雨，别出门。”三日后你出了门，雨没下。你回来时，那人还站在原地。', fx:{ luck:-1 } },
    { a:16, b:28, w:2, t:'你在一处断崖上看见自己的坟。碑是新的，土是新的，坟里没有人。', fx:{ wits:2 } },
    { a:17, b:30, w:2, t:'有天你忽然听懂了风说的话。它一直在讲同一件事，讲了很多年，讲到今天才讲完。', fx:{ wits:2 } },
    { a:18, b:32, w:2, t:'你杀了第一只妖。它倒下时变成一片叶子，叶子上有半行字，是半篇功法的开头。', fx:{ dxp:260 } },
    { a:19, b:34, w:1, once:true, t:'你在夜里被抬上了山。抬你的人没有脸。把你放下，他们就散了。天亮时你身边多了一只匣。', fx:{ talismans:1 } },
    { a:20, b:36, w:2, t:'有个人自称是你前世的师父，说等了你九十年。你问他前世叫什么，他说：“你不必知道，知道了就走不动了。”', fx:{ dxp:300 } },
    { a:21, b:40, w:2, t:'你掌心那点光，在某天开始往皮肉里渗。你不疼，只是从此看人，能看见他们身上还剩多少年。', fx:{ wits:2, body:-1 } },

    /* ---------- 修行 · 法则 ---------- */
    { a:25, b:120, w:3, t:'你在一处山谷里发现，那里的时间是横着流的。你把左手伸进去，抽出来时，那只手老了三十年。', fx:{ wits:1, body:-1 } },
    { a:26, b:150, w:2, t:'你在打坐时数自己的呼吸，数到第九千次，忽然发现：呼吸的不是你，是别的东西在用你。', fx:{ wits:2 } },
    { a:28, b:180, w:3, t:'天上有两颗星换了位置。第二天，你发现自己的左手变成了右手，你不觉得别扭。' },
    { a:30, b:200, w:2, t:'你在一座空城里走了一夜。第二天城没了，你的鞋底沾着的土，是几百年前的土。', fx:{ dxp:400 } },
    { a:32, b:220, w:2, t:'有个东西一直在你身后三步处。你走它也走，你停它也停。你回头，那里只有你自己的影子。' },
    { a:34, b:240, w:2, t:'你炼出一炉丹，丹开炉时是一句话：“服我者，不为仙。”你没吃，把它埋了。', fx:{ dxp:300 } },
    { a:36, b:260, w:2, t:'你在一面石壁上看见自己的一生，从生到死。看到最后一行时，石壁改了，改成“此处可改”。', fx:{ wits:2 } },
    { a:38, b:280, w:2, t:'你遇见一个倒着走路的人。他说：“前面是后面。”你跟他走了一段，回到了自己出生那天，只看见一片雨。' },
    { a:40, b:300, w:2, t:'你在深山里听见有人在念一份名册，念到你的名字时顿了一下，跳过去了。第二天你的名字出现在石上。', fx:{ luck:-2, wits:2 } },
    { a:45, b:320, w:2, t:'你救了一个快死的人。他死后站起来，向你鞠了一躬，说：“谢了。”然后往东走了。' },
    { a:50, b:340, w:2, t:'你收了个徒弟。他第一天就把你教的东西全学会了，第二天说：“师父，你还没我懂。”你没生气。', fx:{ dxp:500 } },
    { a:55, b:360, w:2, t:'有神在你梦里判了你一桩罪。判完他翻了翻，说：“判错了，撤不回来，你将就着受。”你受了。', fx:{ luck:-2, body:-1 } },
    { a:60, b:380, w:2, t:'你在一场雨里站了一夜。雨停时，你已经不记得自己是谁，但记得路怎么走。', fx:{ wits:1, luck:1 } },
    { a:65, b:400, w:2, t:'你把自己的影子借给了一个人三天。他还回来时，影子比你多了一段。' },
    { a:70, b:420, w:2, t:'你在一口井里看见另一片天。那片天的太阳是黑的，还有一个和你一样的人，正低头看你。' },
    { a:75, b:440, w:1, once:true, t:'你走进一片雾。雾里站着很多人，都背对着你。你拍了拍其中一个，他转过身——是你自己。', fx:{ wits:3, body:-1 } },
    { a:80, b:460, w:2, t:'山上塌了一块天。塌下来的地方露出灰白色的底，像没画完的画。有人爬上去，就没再下来。' },
    { a:85, b:480, w:2, t:'你杀了一个不该杀的人。他没有倒，只是慢慢变淡，最后一句话说：“我等这一刻很久了。”' },
    { a:90, b:500, w:2, t:'你在一处荒庙里睡了一夜。醒来时庙里多了一尊像，是你。像上落满了灰，像是有几百年了。', fx:{ luck:1 } },
    { a:100, b:520, w:2, t:'你的剑在某天自己出鞘，往南飞了。三天后它回来，插在你面前，剑身上多了一道别人的血。' },
    { a:110, b:540, w:2, t:'你在一段路上走了七天，每一天的风景都退回去一点。第七天，你看见自己昨天走过的脚印，是往后的。' },
    { a:120, b:560, w:2, t:'天上的云变成了一张脸。它看了你一会儿，什么也没说，被风扯散了。' },
    { a:130, b:600, w:2, t:'你收下一块会说话的石头。它只重复一句话：“你还有多久。”你问了它很多次，它都这么说。', fx:{ wits:1 } },

    /* ---------- 晚年 · 超脱 ---------- */
    { a:150, b:999, w:2, t:'你开始觉得，山不是山，是你自己长出来的一块骨头。' },
    { a:180, b:999, w:2, t:'有个人上山拜你，拜了三天。你问他求什么，他说：“求你不要再活了。”你笑了。' },
    { a:200, b:999, w:2, t:'某天你抬手，山上的雪停了。你放下手，雪也没再下。那一年山下的人说，天漏了个洞。', fx:{ dxp:600 } },
    { a:220, b:999, w:2, t:'你在一片荒野里看见一具骨骸，坐得很正。你坐下陪它，坐了七天。第八天它倒了，你没倒。' },
    { a:250, b:999, w:2, t:'你的影子现在比你走得更快。有时候它先到地方，回过头等你。' },
    { a:300, b:999, w:2, t:'你把这一生讲过的话，一句句在心里过了一遍。有一句你记不起是谁说的，可你确定是自己。' },
    { a:350, b:999, w:2, t:'你觉得天有点薄。伸手一划，指头出去了半寸，外面是黑的，什么也没有。', fx:{ wits:2 } },
    { a:400, b:999, w:2, t:'山下的人开始给你烧纸。你还活着，可他们烧得很认真。你去看了，纸灰是热的。' },
    { a:500, b:999, w:2, t:'你在一面镜子里看见自己的骨头。骨头很亮，像被人擦过很多年。' },
    { a:600, b:999, w:2, t:'你已经分不清自己在打坐，还是自己就是那口钟。有人来敲你，你就响一声。' },

    /* ---------- 秘境（窄格专属） ---------- */
    { a:20, b:999, w:2, kind:'secret', t:'你踏进一座洞府。门在你身后消失，里面的光是从墙上长出来的，像苔。地上摆着一副碗筷，还热着。', fx:{ dxp:800, wits:1 } },
    { a:25, b:999, w:2, kind:'secret', t:'秘境里有一口钟，无人自鸣。你听了七天，第八天你听懂了：它在数数，数到你的年纪停了一次。', fx:{ dxp:900 } },
    { a:30, b:999, w:2, kind:'secret', t:'你走到秘境最深处，看见一扇门，门上写着“出口”。推开，里面是另一座秘境，门上也写着“出口”。你推了九次。', fx:{ wits:2, dxp:600 } },
    { a:35, b:999, w:2, kind:'secret', t:'秘境里下着雪，雪落在地上是字。你读了三天，读出一篇功法；第四天雪变了，变成一篇讣告，写着你的名字。', fx:{ dxp:1200, luck:-1 } },
    { a:40, b:999, w:2, kind:'secret', t:'你在秘境中遇见一个少年，与你长得一模一样，只是年轻。他说：“我等到了。”然后把手里的东西给了你。', fx:{ dxp:1000, talismans:1 } },
    { a:45, b:999, w:2, kind:'secret', t:'秘境里有一口井，井底是星。你伸手去够，够到一颗，握在手里，它就变成了你的眼珠。' },
    { a:50, b:999, w:2, kind:'secret', t:'你在一座空殿里坐下，殿中四面都是你的像。像在动，你没有动。走的时候，少了一尊。', fx:{ wits:2 } },
    { a:55, b:999, w:2, kind:'secret', t:'秘境中央悬着一根线。你顺着线往上爬，爬到尽头，摸到一只手掌。手掌合上，把你放回原处。', fx:{ body:2, dxp:500 } },
    { a:60, b:999, w:2, kind:'secret', t:'你在秘境里遇到一个正在写字的老人。他写的是你正在做的事。你停了，他的笔也停了。', fx:{ wits:3 } },
    { a:70, b:999, w:2, kind:'secret', t:'秘境的守门人问你要一样东西。你给了影子，他摇头；你给了名字，他点头。出来时，你叫不出自己的名字。', fx:{ dxp:1500, wits:-1 } },

    /* ---------- 传说（极窄格专属） ---------- */
    { a:30, b:999, w:1, kind:'legend', t:'天上裂开一道缝，缝里垂下一只手，在你头顶停了很久，最后摸了摸你的头，收回去了。你此后每次抬头，那道缝都在。', fx:{ luck:4, dxp:2000 } },
    { a:40, b:999, w:1, kind:'legend', t:'一位自称司命的神在你灶前坐了一夜。天亮时他留下半枚印，说：“你的寿数我给错了，这个补你。”', fx:{ life:600 } },
    { a:50, b:999, w:1, kind:'legend', t:'你在山巅遇见了自己的死。它坐在那里，说：“还早。”你与它并肩坐了一整年，那一年的修为，抵得上百年。', fx:{ dxp:3000 } },
    { a:60, b:999, w:1, kind:'legend', t:'整座山忽然跪伏下去，像被谁按住。你听见天地之间有一条线绷紧的声音。线断在你身上的时候，你成了这条线。', fx:{ dxp:4000, wits:3 } },
    { a:80, b:999, w:1, kind:'legend', t:'你被写进了一本很旧的册子。写你的那一页只有一行：“此人不必记。”你的名字从所有地方消失了，除了你自己的记忆。', fx:{ luck:3, dxp:2500 } },
    { a:100, b:999, w:1, kind:'legend', t:'万年前的某位存在，隔着时间看了你一眼。那一瞬间你老了三百年，也懂了三百年。', fx:{ dxp:5000, body:-3 } },
    { a:150, b:999, w:1, kind:'legend', t:'你在这世上留下的痕迹，开始自己长起来：你走过的路成了河，你坐过的石头成了山，你叹过的气成了风。', fx:{ luck:4, dxp:3000 } },
    { a:200, b:999, w:1, kind:'legend', t:'天门在你头顶开了一线，又合上了。它没有等你，只是先看了一眼。', fx:{ dxp:6000, luck:2 } },

    /* ---------- 抉择 ---------- */
    { a:16, b:400, w:2, t:'你在路边救起一个重伤的人。他睁眼第一句是：“你不该救我。”第二句是：“现在你也得死了。”',
      ch:{ q:'他说，追他的人半个时辰就到。', o:[
        { t:'留下，替他挡', r:'来的是三个人，你没打赢，但把他送走了。你身上的伤从此没好全。', fx:{ body:-2, luck:2 }, deed:'saveStranger' },
        { t:'放下他，自己走', r:'你走了。半个时辰后你听见身后有声音，没回头。', fx:{ wits:1 } }
      ] } },
    { a:20, b:500, w:2, t:'一个孩子跪在雨里，求你杀了他。他说他已经活了四百年，只是长不大。',
      ch:{ q:'他的眼睛确实很老。', o:[
        { t:'动手', r:'剑落下时他笑了。尸体在雨里缩成很小的一团，像个真的孩子。', fx:{ wits:2, luck:-1 }, deed:'killChild' },
        { t:'问他要不要活着', r:'他哭了很久，最后说：“那就再活四百年。”你替他找了户人家。', fx:{ luck:3 }, deed:'spareChild' }
      ] } },
    { a:30, b:600, w:2, t:'你在一座空殿里见到一位坐化的老者。他的眉心还有一点光，看见你，光动了动。',
      ch:{ q:'他似乎还有话没说完。', o:[
        { t:'把自己的气渡给他', r:'他活了半刻，只说了两个字：“别去。”然后又坐化了。你把这两个字记了一辈子。', fx:{ wits:2, body:-1 }, deed:'readNote' },
        { t:'替他合上眼', r:'你合上他的眼。殿里最后一盏灯灭了。', fx:{ luck:2 }, deed:'buryMonk' }
      ] } },
    { a:40, b:900, w:1, t:'有个声音在你识海里问：“换一个更快的活法吗？代价是，你以后想不起自己是谁。”',
      ch:{ q:'它在等。', o:[
        { t:'换', r:'你的修为涨得飞快。只是照镜子时，你叫不出镜中人的名字。', fx:{ dxp:2500, wits:-3 } },
        { t:'不换', r:'你说：“我想记得。”那声音笑了一下，散了。', fx:{ wits:2, luck:1 } }
      ] } },
    { a:60, b:999, w:1, t:'有天你遇见一个人，他与你同名同姓，同一天生，同一个师父。他说：“这世上只能有一个。”',
      ch:{ q:'他拔了剑。', o:[
        { t:'拔剑', r:'剑光过后，你还站着。他倒下时说：“原来说的是我。”', fx:{ dxp:1200, luck:-1 } },
        { t:'收剑，转身走', r:'你走了。他在身后站了很久，没有再追。', fx:{ wits:2 } }
      ] } },

    /* ---------- 回响 ---------- */
    { a:20, b:200, w:2, t:'你在一场雪里给一个快要冻死的人让了半间庙。他说会记你一辈子。',
      echo:{ after:60, t:'六十年后，你在一座陌生的城里看见一间庙，庙里供着一尊像，像你，也像他。', fx:{ luck:2 } } },
    { a:30, b:300, w:2, t:'你埋了一具无名的尸骨，替它把眼睛合上。',
      echo:{ after:70, t:'七十年后，你在崖上遇见一个人，他说：“我找了很久，才找到替我合眼的人。”说完就不见了。', fx:{ luck:2, dxp:400 } } },
    { a:40, b:400, w:2, t:'你把一段剑法刻在石上，没留名字。',
      echo:{ after:60, t:'六十年后，石壁下跪满了人。他们在拜一个不知道是谁的人。你路过，没停。', fx:{ dxp:800 } } },
    { a:50, b:500, w:2, t:'你救了一株被雷劈焦的老树，替它接上一根枝。',
      echo:{ after:80, t:'八十年后，那棵树长得比山还高。树下聚了一群修士，说这是福地。你在树上坐着，没人认得你。', fx:{ dxp:900 } } },
    { a:60, b:600, w:1, t:'你把自己的旧剑送给了一个少年，说：“用不上就还我。”',
      echo:{ after:50, t:'五十年后，一把旧剑被人插在你的洞府门口。剑上有血，剑柄上刻着一行新字：“用上了。”', fx:{ wits:1, luck:1 } } },
    { a:80, b:800, w:1, t:'你在山下留了半句诗，没有写完。',
      echo:{ after:100, t:'一百年后，那半句诗被人补全了。补得很好，比你想的好。你在石上看了很久。', fx:{ luck:1 } } },

    /* ---------- 天马行空 · 不讲道理 ---------- */
    { a:3, b:999, w:2, t:'天上有人在锯木头，锯末落下来，成了这一场雪。' },
    { a:10, b:999, w:2, t:'你数自己的手指，十根。第二天变成十一根。你没有告诉任何人。' },
    { a:12, b:999, w:2, t:'你在山路上遇见一个背着自己走路的人。他说：“他累了，我替他一程。”' },
    { a:14, b:999, w:2, t:'有人在你识海里下了一盘棋。下到一半你才发现，你不是下棋的人，你是那颗子。', fx:{ wits:1 } },
    { a:16, b:999, w:2, t:'一个小孩问你：“你是不是要走？”你说不走。他说：“那你已经在走了。”' },
    { a:18, b:999, w:2, t:'天上掉下一只碗，碗里是热的。你没敢吃。第二天碗不见了，桌上留了一点汤。', fx:{ luck:1 } },
    { a:20, b:999, w:2, t:'你在雨里听见有人念经，念的是你的生辰。' },
    { a:22, b:999, w:2, t:'山门后有一间屋子，里面坐着几十个你。他们都在等一个不存在的师父，看见你进来，一起抬头。', fx:{ wits:1 } },
    { a:24, b:999, w:2, t:'你回首来路，路不见了。后面是很干净的白，白得像还没画。' },
    { a:26, b:999, w:2, t:'你梦见自己是别人梦里的一个人。醒来时，你不知道该替谁难过。' },
    { a:28, b:999, w:2, t:'有个老头在你门口摆摊，卖“来世”，一文钱一个。你买了一个，他找给你半文。' },
    { a:30, b:999, w:2, t:'你养的鸡会说话了，第一句是“别修了”。第二句它不肯说。', fx:{ luck:-1, wits:1 } },
    { a:32, b:999, w:2, t:'你走进一片没有影子的人群。他们停下来，都在找你。你不知道该说什么。' },
    { a:35, b:999, w:2, t:'你的剑在你睡觉时自己练功，练得比你好。你醒来时它装睡。', fx:{ dxp:200 } },
    { a:38, b:999, w:2, t:'夜里有数数的声音，从一数到你的年纪，然后停了。第二天它没再响。' },
    { a:40, b:999, w:2, t:'有人把一样东西塞进你怀里，说“别打开”，然后走远了。你没打开。它一直在你怀里，有点热。' },
    { a:45, b:999, w:2, t:'天上有两只手在掰一块饼。掰完，饼掉下来，是你的那一半。', fx:{ luck:2 } },
    { a:50, b:999, w:2, t:'你在一面墙上写下自己的名字。第二天，墙上多了一个名字，笔迹和你一模一样。' },
    { a:60, b:999, w:2, t:'你走过一条街，街上的所有人都同时看了你一眼，然后继续做自己的事。' },
    { a:70, b:999, w:2, t:'有个人在你门口坐了三十年，等的不是人，是一句话。你走的时候说了那句话。他走了。' },
    { a:80, b:999, w:2, t:'你发现自己在别人的故事里，是那个“从前有个老道”的老道。', fx:{ luck:1 } },
