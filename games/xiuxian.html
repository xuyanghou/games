  /* ============================================================
     二、工具与存档
  ============================================================ */

  function loadMeta(){
    try{
      var raw = localStorage.getItem(KEY);
      if (!raw) return { runs:0, bestRealm:0, inherit:null, seen:[], mateSeen:[] };
      var m = JSON.parse(raw);
      return {
        runs: m.runs || 0,
        bestRealm: m.bestRealm || 0,
        inherit: m.inherit || null,
        seen: m.seen || [],
        mateSeen: m.mateSeen || []
      };
    }catch(e){
      return { runs:0, bestRealm:0, inherit:null, seen:[], mateSeen:[] };
    }
  }
  function saveMeta(){
    try{ localStorage.setItem(KEY, JSON.stringify(meta)); }catch(e){}
  }
  var meta = loadMeta();

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c];
    });
  }

  function rnd(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rnd(arr.length)]; }

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rnd(i + 1);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     三、状态
  ============================================================ */

  var S = {
    view: 'talent',
    pool: [],
    selected: [],
    attrs: { root:0, wits:0, body:0, luck:0 },
    points: 20,
    P: null,
    recent: [],
    used: [],
    pending: null,     // 当前抉择事件
    wheel: null,       // 转盘是否在进行
    wheelBase: 0,      // 转盘累计角度
    tribu: null,       // 天劫进度
    lastWheel: 0,      // 上次转盘触发的年龄
    echoes: [],        // 延迟回响
    ended: false
  };

  var view = document.getElementById('view');
  var modal = document.getElementById('modal');
  var mq = document.getElementById('mq');
  var mopts = document.getElementById('mopts');

  /* ============================================================
     四、天赋视图
  ============================================================ */

  function rollTalents(){
    var list = shuffle(TALENTS).slice(0, 10);

    // 前世继承的天赋必出
    if (meta.inherit){
      var inh = null;
      for (var i = 0; i < TALENTS.length; i++){
        if (TALENTS[i].n === meta.inherit) inh = TALENTS[i];
      }
      if (inh){
        var exists = list.some(function(t){ return t.n === inh.n; });
        if (!exists){
          list.pop();
          list.unshift(inh);
        } else {
          list = [inh].concat(list.filter(function(t){ return t.n !== inh.n; }));
        }
      }
    }

    S.pool = list;
    S.selected = [];
  }

  function renderTalent(){
    S.view = 'talent';

    var cards = S.pool.map(function(t, i){
      var sel = S.selected.indexOf(i) >= 0 ? ' sel' : '';
      return '' +
        '<div class="tcard q' + t.q + sel + '" data-i="' + i + '">' +
          '<span class="tq">' + QUALITY[t.q] + '</span>' +
          '<div class="tn">' + esc(t.n) + '</div>' +
          '<div class="td">' + esc(t.d) + '</div>' +
        '</div>';
    }).join('');

    view.innerHTML = '' +
      '<section class="panel">' +
        '<div class="panel-title">' +
          '<h2>抽 天 赋</h2>' +
          '<span class="tip">十选三 · 已选 <b id="selCount" style="color:#4fe3c1">' + S.selected.length + '</b>/3</span>' +
        '</div>' +
        '<div class="tgrid" id="tgrid">' + cards + '</div>' +
        '<button class="btn" id="toAttr" style="margin-top:12px">踏入仙途</button>' +
      '</section>';

    document.getElementById('tgrid').addEventListener('click', function(e){
      var card = e.target.closest('.tcard');
      if (!card) return;
      var i = Number(card.getAttribute('data-i'));
      var at = S.selected.indexOf(i);

      if (at >= 0){
        S.selected.splice(at, 1);
      } else {
        if (S.selected.length >= 3){
          card.animate(
            [{ transform:'translateX(0)' }, { transform:'translateX(-4px)' },
             { transform:'translateX(4px)' }, { transform:'translateX(0)' }],
            { duration:260 }
          );
          return;
        }
        S.selected.push(i);
      }

      var list = document.querySelectorAll('.tcard');
      for (var k = 0; k < list.length; k++){
        var n = Number(list[k].getAttribute('data-i'));
        list[k].classList.toggle('sel', S.selected.indexOf(n) >= 0);
      }
      document.getElementById('selCount').textContent = S.selected.length;
    });

    document.getElementById('toAttr').addEventListener('click', function(){
      if (S.selected.length !== 3) return;
      var tf = talentFx();
      S.points = 20 + tf.points;
      S.attrs = { root:0, wits:0, body:0, luck:0 };
      renderAttr();
    });
  }

  /* ============================================================
     五、天赋效果汇总
  ============================================================ */

  function chosenTalents(){
    return S.selected.map(function(i){ return S.pool[i]; });
  }

  function talentFx(){
    var sum = {
      root:0, wits:0, body:0, luck:0,
      life:0, points:0, speed:1, brk:0, flat:0,
      flags:{}
    };
    chosenTalents().forEach(function(t){
      var f = t.fx || {};
      if (f.root)  sum.root  += f.root;
      if (f.wits)  sum.wits  += f.wits;
      if (f.body)  sum.body  += f.body;
      if (f.luck)  sum.luck  += f.luck;
      if (f.life)  sum.life  += f.life;
      if (f.points) sum.points += f.points;
      if (f.speed) sum.speed *= f.speed;
      if (f.brk)   sum.brk   += f.brk;
      if (f.flat)  sum.flat  += f.flat;
      if (f.flag)  sum.flags[f.flag] = true;
    });
    return sum;
  }

  /* ============================================================
     六、属性分配视图
  ============================================================ */

  var ATTR_META = [
    { k:'root', n:'禀赋', d:'决定修炼速度，每年积累的修为' },
    { k:'wits', n:'悟性', d:'决定突破成功率与顿悟机缘' },
    { k:'body', n:'体魄', d:'决定寿元上限，体魄归零则身死' },
    { k:'luck', n:'气运', d:'影响奇遇与化险为夷的概率' }
  ];

  function usedPoints(){
    return S.attrs.root + S.attrs.wits + S.attrs.body + S.attrs.luck;
  }

  function renderAttr(){
    S.view = 'attr';

    var rows = ATTR_META.map(function(a){
      return '' +
        '<div class="attr-row">' +
          '<span class="an">' + a.n + '</span>' +
          '<button class="step" data-k="' + a.k + '" data-op="-1">−</button>' +
          '<span class="av" id="av-' + a.k + '">' + S.attrs[a.k] + '</span>' +
          '<button class="step" data-k="' + a.k + '" data-op="1">+</button>' +
          '<span class="ad">' + a.d + '</span>' +
        '</div>';
    }).join('');

    view.innerHTML = '' +
      '<section class="panel">' +
        '<div class="panel-title">' +
          '<h2>分 属 性</h2>' +
          '<span class="tip">单项上限 10</span>' +
        '</div>' +
        '<div class="attr-list">' + rows + '</div>' +
        '<div class="points-bar">' +
          '<span>可用点数</span>' +
          '<b id="ptLeft">' + (S.points - usedPoints()) + '</b>' +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-top:12px">' +
          '<button class="btn ghost" id="rndAttr" style="flex:0 0 108px">随机分配</button>' +
          '<button class="btn" id="startLife" style="flex:1">' +
            ((S.points - usedPoints()) > 0 ? ('还需分配 ' + (S.points - usedPoints()) + ' 点') : '入 世') +
          '</button>' +
        '</div>' +
      '</section>';

    view.querySelector('.attr-list').addEventListener('click', function(e){
      var btn = e.target.closest('.step');
      if (!btn) return;
      var k = btn.getAttribute('data-k');
      var op = Number(btn.getAttribute('data-op'));
      var left = S.points - usedPoints();

      if (op > 0){
        if (left <= 0) return;
        if (S.attrs[k] >= 10) return;
        S.attrs[k]++;
      } else {
        if (S.attrs[k] <= 0) return;
        S.attrs[k]--;
      }
      document.getElementById('av-' + k).textContent = S.attrs[k];
      var left = S.points - usedPoints();
      document.getElementById('ptLeft').textContent = left;
      var sb = document.getElementById('startLife');
      if (sb) sb.textContent = left > 0 ? ('还需分配 ' + left + ' 点') : '入 世';
    });

    document.getElementById('rndAttr').addEventListener('click', function(){
      S.attrs = { root:0, wits:0, body:0, luck:0 };
      var left = S.points;
      var keys = ['root', 'wits', 'body', 'luck'];
      while (left > 0){
        var k = pick(keys);
        if (S.attrs[k] >= 10) continue;
        var add = Math.min(left, Math.min(10 - S.attrs[k], 1 + rnd(4)));
        S.attrs[k] += add;
        left -= add;
      }
      renderAttr();
    });

    document.getElementById('startLife').addEventListener('click', function(){
      if (S.points - usedPoints() > 0){
        var b = this;
        b.animate(
          [{ transform:'translateX(0)' }, { transform:'translateX(-4px)' },
           { transform:'translateX(4px)' }, { transform:'translateX(0)' }],
          { duration:260 }
        );
        var pb = document.querySelector('.points-bar b');
        if (pb){
          pb.style.color = '#ff9aad';
          setTimeout(function(){ pb.style.color = ''; }, 700);
        }
        return;
      }
      openOrigin();
    });
  }

  /* ============================================================
     七、开局
  ============================================================ */

  function randomRace(){
    var pool = [];
    for (var i = 0; i < RACES.length; i++){
      for (var k = 0; k < RACES[i].w; k++) pool.push(RACES[i]);
    }
    return pick(pool);
  }

  function beginLife(raceId){
    var tf = talentFx();
    var flags = {};
    for (var k in tf.flags){ if (tf.flags[k]) flags[k] = true; }

    var race = raceOf(raceId || S.raceId || randomRace().id);
    var rf = race.fx || {};
    for (var k2 in rf){ if (k2 === 'flag') flags[rf[k2]] = true; }

    S.P = {
      age: 0,
      realm: 0,
      xp: 0,
      root: S.attrs.root + tf.root + (rf.root || 0),
      wits: S.attrs.wits + tf.wits + (rf.wits || 0),
      body: S.attrs.body + tf.body + (rf.body || 0),
      luck: S.attrs.luck + tf.luck + (rf.luck || 0),
      lifeBonus: tf.life + (rf.life || 0),
      speed: tf.speed * (rf.speed || 1),
      brk: tf.brk + (rf.brk || 0),
      flat: tf.flat,
      flags: flags,
      fateUsed: false,
      deeds: [],
      origin: race.id,
      race: race.id,
      raceLine: race.line,
      relics: [],
      arts: [],
      quirks: [],
      mate: null,
      mates: [],
      exMates: [],
      mateMul: 1,
      mateTribu: 0,
      talismans: flags.artifact ? 2 : 0,
      secMul: 1,
      sect: '',
      dao: '',
      alive: true,
      endReason: '',
      talents: chosenTalents().slice()
    };

    if (flags.artifact) S.P.xp += 120;
    if (flags.late) S.P.flags.late = true;
    if (S.P.body < 3) S.P.body = 3;

    S.recent = [];
    S.used = [];
    S.genUsed = [];
    S.ageDone = [];
    S.ageSpin = 0;
    MATE_LIFE_LAST = -99;
    S.lastGen = -99;
    S.pity = 0;
    S.chainKind = '';
    S.chainN = 0;
    for (var wi = 0; wi < WHEEL.length; wi++) WHEEL[wi].lv = 0;
    S.echoes = [];
    S.pending = null;
    S.wheel = null;
    S.wheelBase = 0;
    S.tribu = null;
    S.lastWheel = 0;
    S.ended = false;

    meta.runs = (meta.runs || 0) + 1;
    saveMeta();

    renderLife();

    log(0, race.line, race.id === 'human' ? 'you' : 'bad');
    if (race.id !== 'human') log(0, '（这一世你是「' + race.n + '」：' + race.d + '）', '');
    if (S.P.flags.artifact){
      var a0 = rollArtifact();
      applyArtifact(a0);
      log(0, '襁褓里，你攥着' + a0.n + '。它认得你。', 'good');
    }
    if (S.P.flags.demon) log(0, '接生婆说你出生时没有哭，只是睁着眼看屋顶。', 'bad');
  }

  /* ---------- 法宝与功法 ---------- */

  function artifactMul(){
    var P = S.P;
    return (P && P.flags && P.flags.spiritborn) ? 2 : 1;
  }

  function applyArtifact(a){
    var P = S.P;
    if (!P || !a) return;
    var m = artifactMul();
    if (P.relics.length >= 9){
      log(P.age, '你手里的' + a.n + '已经没有位置了。你把它埋在山里，说留给下一个路过的人。', '');
      return;
    }
    P.relics.push(a);
    if (a.fx.speed) P.speed *= 1 + a.fx.speed * 0.4;
    if (a.fx.life)  P.lifeBonus += Math.round(a.fx.life * 0.5 * m);
    if (a.fx.luck)  P.luck = Math.min(ATTR_CAP + 8, P.luck + a.fx.luck * m);
    if (a.fx.body)  P.body += a.fx.body;
    if (a.fx.wits)  P.wits = Math.min(ATTR_CAP + 4, P.wits + a.fx.wits);
    if (a.fx.flat)  P.flat += a.fx.flat * m;
  }

  function relicSum(key){
    var P = S.P, s = 0;
    if (!P || !P.relics) return 0;
    for (var i = 0; i < P.relics.length; i++) s += (P.relics[i].fx[key] || 0);
    return s * artifactMul();
  }

  // 禀赋（天赋底子）决定这一世能装几篇功法
  function artCap(){
    var P = S.P;
    return 1 + Math.floor(Math.max(0, P.root) / 8) + ((P.flags && P.flags.spiritborn) ? 1 : 0);
  }

  function tryLearnArt(){
    var P = S.P;
    if (!P || !P.alive) return;
    if (P.arts.length >= artCap()){
      log(P.age, '识海里已经塞满了。再多一篇，你就会变成别人的样子。', '');
      return;
    }

    // 悟性定成功率
    var rate = Math.min(0.95, 0.28 + P.wits * 0.045 + P.luck * 0.012);

    var cand = null, tries = 0;
    do { cand = pick(ARTS); tries++; } while (P.arts.indexOf(cand) >= 0 && tries < 12);
    if (P.arts.indexOf(cand) >= 0) return;

    if (Math.random() > rate){
      log(P.age, '你捧起' + cand.n + '，读了三遍，一个字也没进脑子。它和你没有缘分。（悟性判定 ' + Math.round(rate * 100) + '%）', 'bad');
      return;
    }

    P.arts.push(cand);
    if (cand.speed) P.speed *= 1 + cand.speed * 0.5;
    if (cand.brk) P.brk += cand.brk;
    if (cand.life) P.lifeBonus += cand.life;
    if (cand.body) P.body += cand.body;
    if (cand.wits) P.wits = Math.min(ATTR_CAP + 4, P.wits + cand.wits);

    log(P.age, '你学会了' + cand.n + '——' + cand.d + '。（悟性判定 ' + Math.round(rate * 100) + '%）', 'big');

    if (cand.q && QUIRKS[cand.q]){
      var dup = false;
      for (var qi = 0; qi < P.quirks.length; qi++) if (P.quirks[qi].k === cand.q) dup = true;
      if (!dup){
        P.quirks.push({ k: cand.q, n: QUIRKS[cand.q].n, d: QUIRKS[cand.q].d });
        log(P.age, '从此你多了一条规矩：' + QUIRKS[cand.q].d, 'you');
      }
    }
  }

  // 规矩不是白守的，也不是白守得住的
  function checkQuirks(){
    var P = S.P;
    if (!P || !P.quirks || !P.quirks.length) return;
    // 规矩找上门的间隔要够长，免得同一句话一年一回
    if (P.age - (P.lastQuirk || -999) < 24) return;
    if (Math.random() > 0.34) return;
    P.lastQuirk = P.age;

    var q = pick(P.quirks);

    if (q.k === 'noLie'){
      if (Math.random() < 0.55){
        P.xp = Math.floor(P.xp * 0.94);
        log(P.age, '你隐去了半句话。夜里那半句回来了，咬掉你一点修为。', 'bad');
      } else {
        P.wits = Math.min(ATTR_CAP + 4, P.wits + 1);
        log(P.age, '你这辈子没说过谎，于是你看人看得格外准。', 'good');
      }
    } else if (q.k === 'noSleep'){
      P.lifeBonus -= 18;
      P.xp += Math.round(yearXP() * 2);
      log(P.age, pick(['你又一整年没合眼。别人在睡，你在数呼吸。',
                       '这一世你没有真正睡过。夜里你只是把眼睛闭上，然后听。',
                       '你又熬过一整年。天亮的时候，你不太确定自己有没有睡着过。']), '');
    } else if (q.k === 'knock'){
      if (Math.random() < 0.4){
        P.luck = Math.max(0, P.luck - 1);
        log(P.age, '那年你忘了敲钟。第二天起来，觉得自己轻了一点。', 'bad');
      } else {
        P.luck = Math.min(ATTR_CAP + 8, P.luck + 1);
        log(P.age, '你敲了钟。钟声传出去很远，有人应了一声。', 'good');
      }
    } else if (q.k === 'ask'){
      if (Math.random() < 0.6){
        P.luck = Math.min(ATTR_CAP + 8, P.luck + 1);
        log(P.age, '你先问了一句。对面那个东西愣了一下，也回了你一句。', 'good');
      } else {
        log(P.age, '你问了，对面没有回答。你等了一会儿，自己走了。', '');
      }
    } else if (q.k === 'noBack'){
      P.xp = Math.floor(P.xp * 0.93);
      P.body = Math.max(3, P.body - 1);
      log(P.age, '你回头看了一眼。身后的路塌了一段，人也矮了一寸。', 'bad');
    } else if (q.k === 'barefoot'){
      P.xp += Math.round(yearXP() * 1.4);
      P.body = Math.max(3, P.body - 1);
      log(P.age, '你光脚走了一年。脚底磨破了，可你知道这地是真的。', '');
    }
  }

  /* ============================================================
     八、数值
  ============================================================ */

  function maxAge(){
    var P = S.P;
    return Math.max(40, Math.floor(90 + P.body * 10 + P.lifeBonus));
  }

  function needXP(){
    var P = S.P;
    if (P.realm >= NEED.length) return Infinity;
    return NEED[P.realm];
  }

  function yearXP(){
    var P = S.P;
    var base = 3 + P.root * 1.1 + P.wits * 0.3;
    base *= P.speed;
    if (P.flags.late && P.age >= 60) base *= 2;
    base += P.flat;
    base *= 1 + P.realm * 2.2;
    base *= (P.secMul || 1);
    base *= (P.mateMul || 1);
    base *= 0.9 + Math.random() * 0.25;
    return Math.max(1, Math.round(base));
  }

  function realmName(){
    var P = S.P;
    if (P.realm >= 9) return '飞升';
    return REALMS[Math.min(P.realm, REALMS.length - 1)];
  }

  /* ============================================================
     九、推进一年
  ============================================================ */

  function advanceYear(quiet){
    var P = S.P;
    if (!P.alive) return false;

    P.age++;

    // 寿元
    if (P.age > maxAge()){
      return endLife('寿元已尽。你坐在蒲团上，慢慢听不见自己的呼吸。');
    }

    // 一梦千年
    if (P.flags.dream && P.age % 50 === 0){
      var dreamXP = 200 + P.realm * 400;
      P.xp += dreamXP;
      if (!quiet) log(P.age, '你梦见自己活了很久很久，醒来时像是多懂了一些东西。', 'good');
    }

    // 修炼
    P.xp += yearXP();

    // 旧事的回响
    checkEchoes();

    // 学来的规矩，会自己找上门
    checkQuirks();

    // 这一生躲不掉的那几道坎
    checkAgeEvent();

    // 有道侣的日子，也不全是好事
    mateLife();

    // 突破（大乘满境交由天劫判定）
    while (P.realm < 8 && P.xp >= NEED[P.realm]){
      var ok = tryBreak(quiet);
      if (!ok) break;
    }

    // 大乘修为圆满，天劫将至
    if (P.realm === 8 && P.xp >= NEED[8]){
      P.xp = NEED[8];
      if (P.alive && !S.tribu) openTribulation();
      return false;
    }

    // 事件
    if (!quiet){
      maybeEvent();
    }

    if (!P.alive) return false;

    return true;
  }

  function tryBreak(quiet){
    var P = S.P;
    var rate = 0.42 + P.wits * 0.018 + P.luck * 0.018 + P.brk - P.realm * 0.075;
    rate = Math.max(0.1, Math.min(0.9, rate));

    var from = realmName();

    if (Math.random() < rate){
      P.realm++;
      P.xp = 0;
      P.body = Math.min(ATTR_CAP, P.body + 1);
      P.lifeBonus += [0, 8, 16, 30, 55, 95, 150, 240, 420][P.realm] || 0;

      if (P.realm < 9){
        log(P.age, '突破成功。' + from + '的壁障碎了，你踏入了' + REALMS[P.realm] + '。', 'big');
      } else {
        log(P.age, '雷劫加身，九道天雷落尽。你渡劫成功了。', 'big');
      }
      if (P.realm <= 7 && Math.random() < 0.55) tryLearnArt();
      return true;
    }

    // 失败
    P.xp = Math.floor(P.xp * 0.65);
    P.age += 3;

    var madness = 0.15 + (P.flags.demon ? 0.12 : 0);

    if (Math.random() < madness){
      P.body -= 1;
      log(P.age, '冲击' + from + '失败，真气逆冲，你走火入魔，吐出的血落在地上还在冒烟。', 'bad');
    } else {
      log(P.age, '冲击' + from + '失败。你睁开眼，修为散了三成，胸口像压着一块石头。', 'bad');
    }
    return false;
  }

  function maybeEvent(){
    var P = S.P;
    // 事件触发概率
    var chance = 0.62 + Math.min(0.1, P.luck * 0.02);
    if (Math.random() > chance) return;

    var ev = pickEvent();
    // 池子耗尽：改为生涯自述式小事件，永不重复
    if (!ev){ genEvent(); return; }

    S.used.push(EVENTS.indexOf(ev));

    // 记住"这辈子已经见过"，下一世就不再撞同一件事
    var idx2 = EVENTS.indexOf(ev);
    if (meta.seen.indexOf(idx2) < 0){
      meta.seen.push(idx2);
      if (meta.seen.length > 500) meta.seen.shift();
      saveMeta();
    }

    hitEvent(ev);
  }

  /* 池子见底时的小事件：随机组合，天然不重复 */
  var G_A = ['天上那片云', '你身后三步的地方', '山下的那条路', '夜里的井', '你的影子', '远处的钟声',
             '石头里的字', '窗外的雪', '你左边的空处', '那棵不落叶的树', '供桌上的一线灰', '你走过后留下的脚印'];
  var G_B = ['今天动了一下', '少了一块', '开始往回走', '忽然有了回声', '自己合上了', '长了半寸',
             '变成了别的形状', '停了很久', '多了个字', '朝你这边偏了一点', '不该在这儿的', '不再响了'];
  var G_C = ['你看了很久，没有去追。', '你伸手，又收回来。', '你决定不弄明白。', '你记住了，也可能忘了。',
             '你没有告诉任何人。', '你觉得它在等你。', '你绕开了。', '你把它当作没看见。'];
  var G_OLD = ['你已经见过太多这样的事，早不惊讶了。', '你只是记下了年月，没有记内容。',
               '你算了算，这已经是第七次。', '你想，也许它只是想让你看见。',
               '你没有动，它也没有再动。', '你忽然觉得，这些都不重要了。'];

  function genEvent(){
    var P = S.P;

    // 后期年份长，兜底不每年都说话
    if (P.age - (S.lastGen || -99) < 8){ updateStatus(); return; }
    S.lastGen = P.age;

    var isOld = P.age > 200 && Math.random() < 0.45;
    var tailArr = isOld ? G_OLD : G_C;
    var ti = Math.floor(Math.random() * tailArr.length);

    var ai, bi, key, tries = 0;
    do {
      ai = Math.floor(Math.random() * G_A.length);
      bi = Math.floor(Math.random() * G_B.length);
      key = ai + '|' + bi + '|' + (isOld ? 'o' : 'y') + ti;
      tries++;
    } while (S.genUsed.indexOf(key) >= 0 && tries < 12);
    S.genUsed.push(key);

    log(P.age, G_A[ai] + G_B[bi] + '。' + tailArr[ti], '');

    var roll = Math.random();
    if (roll < 0.22) applyFx({ dxp: 20 + P.realm * 40 });
    else if (roll < 0.40) applyFx({ body: 1 });
    else if (roll < 0.52) applyFx({ luck: 1 });
    else if (roll < 0.60) applyFx({ wits: 1 });

    if (Math.random() < 0.10){
      log(P.age, pick(['你莫名地想笑。', '你听见极远处有人叹了一口气。', '你觉得有谁在看你，回头只有风。',
                       '你想起了自己小时候的样子。', '你有点想知道山外面现在是什么年头。']), '');
    }
    updateStatus();
  }

  function pickEvent(){
    var P = S.P;
    var pool = [];

    for (var i = 0; i < EVENTS.length; i++){
      var e = EVENTS[i];
      if (P.age < e.a || P.age > e.b) continue;
      if (e.rm !== undefined && P.realm < e.rm) continue;
      if (e.cond && !e.cond(P)) continue;
      // 同一件事，一生只遇见一次
      if (S.used.indexOf(i) >= 0) continue;

      // 无宗门的角色不出宗门事件
      if (e.set && e.set.sect && !P.sect) continue;

      var w = e.w || 1;
      // 前几世见过的事，这一世压低出现概率（全集见完则恢复正常）
      if (meta.seen.length < EVENTS.length * 0.85 && meta.seen.indexOf(i) >= 0) w = w * 0.3;
      // 气运影响好事
      if (e.fx && (e.fx.luck > 0 || e.fx.dxp > 150)) w += P.luck * 0.15;

      for (var k = 0; k < Math.round(w); k++) pool.push(e);
    }

    if (!pool.length) return null;

    // 心魔/选择类事件优先级略高
    var withChoice = pool.filter(function(e){ return !!e.ch; });
    if (withChoice.length && Math.random() < 0.35){
      return pick(withChoice);
    }
    return pick(pool);
  }

  function hitEvent(ev){
    var P = S.P;

    // 同一件事，也可能有截然不同的下场
    if (ev.rolls){
      var r = pick(ev.rolls);
      log(P.age, r.t, r.cls || ev.cls || '');
      if (r.fx) applyFx(r.fx);
      if (r.deed) P.deeds.push(r.deed);
      if (r.echo) queueEcho(r.echo);
      updateStatus();
      return;
    }

    var txt = Array.isArray(ev.t) ? pick(ev.t) : ev.t;

    if (ev.ch){
      log(P.age, txt, '');
      openChoice(ev);
      return;
    }

    log(P.age, txt, ev.cls || '');
    if (ev.fx) applyFx(ev.fx);
    if (ev.set){
      if (ev.set.sect) P.sect = ev.set.sect;
      if (ev.set.dao)  P.dao  = ev.set.dao;
    }
    if (ev.deed) P.deeds.push(ev.deed);
    if (ev.echo) queueEcho(ev.echo);
    updateStatus();
  }

  // 旧事的回响：多年之后才结算的结果
  function queueEcho(e){
    var P = S.P;
    S.echoes.push({
      at: P.age + (e.after || 30),
      t: e.t,
      fx: e.fx,
      cls: e.cls || ''
    });
  }

  function checkEchoes(){
    var P = S.P;
    if (!S.echoes.length) return;

    var left = [];
    for (var i = 0; i < S.echoes.length; i++){
      var e = S.echoes[i];
      if (P.age >= e.at){
        log(P.age, e.t, e.cls || '');
        if (e.fx) applyFx(e.fx);
      } else {
        left.push(e);
      }
    }
    S.echoes = left;
  }

  function applyFx(fx){
    var P = S.P;

    function bump(key, v){
      var next = P[key] + v;
      var over = 0;
      if (next > ATTR_CAP){ over = next - ATTR_CAP; next = ATTR_CAP; }
      P[key] = next;
      if (over > 0){ P.xp += over * 60; }
    }

    if (fx.root) bump('root', fx.root);
    if (fx.wits) bump('wits', fx.wits);
    if (fx.body){ bump('body', fx.body); if (P.body < 3) P.body = 3; }
    if (fx.luck) bump('luck', fx.luck);
    if (fx.life) P.lifeBonus += fx.life;
    if (fx.dxp){
      P.xp += fx.dxp;
      log(P.age, '修为 +' + fx.dxp + '。', 'good');
    }
    if (typeof fx.xpMul === 'number'){
      P.xp = Math.floor(P.xp * (1 + fx.xpMul));
    }
  }

  /* ============================================================
     九、道侣与年龄坎
  ============================================================ */

  function mateFxApply(fx){
    var P = S.P;
    if (!fx) return;
    if (fx.brk) P.brk += fx.brk;
    if (fx.tribu) P.mateTribu = (P.mateTribu || 0) + fx.tribu;
    if (fx.speed) P.speed *= 1 + fx.speed * 0.6;
    if (fx.life) P.lifeBonus += Math.max(-60, fx.life);
    if (fx.body) P.body += fx.body;
    if (fx.wits) P.wits = Math.min(ATTR_CAP + 4, P.wits + fx.wits);
    if (fx.luck) P.luck = Math.max(0, Math.min(ATTR_CAP + 8, P.luck + fx.luck));
    if (fx.dxpMul) P.mateMul = (P.mateMul || 1) + fx.dxpMul;
  }

  // 结识：quiet 时不刷提示语
  function meetMate(quiet){
    var P = S.P;
    if (!P || !P.alive || P.mate) return null;

    var pool = [];
    for (var i = 0; i < MATES.length; i++){
      if ((meta.mateSeen || []).indexOf(i) >= 0) continue;
      pool.push({ i: i, m: MATES[i] });
    }
    if (!pool.length){
      meta.mateSeen = [];
      for (var j = 0; j < MATES.length; j++) pool.push({ i: j, m: MATES[j] });
    }

    var one = pick(pool);
    meta.mateSeen.push(one.i);
    if (meta.mateSeen.length > 30) meta.mateSeen.shift();
    saveMeta();

    var m = one.m;
    P.mate = { n: m.n, t: m.t, d: m.d, tag: m.tag, since: P.age, fx: m.fx };
    if (!P.mates) P.mates = [];
    P.mates.push(P.mate);
    mateFxApply(m.fx);

    if (!quiet){
      log(P.age, '你遇上了' + m.n + '。' + m.d + '。你们在一张桌上坐了一顿饭的工夫，就从今往后算作一对了。', 'you');
    } else {
      log(P.age, '你与' + m.n + '结为道侣。' + m.d + '。', 'you');
    }
    updateStatus();
    return P.mate;
  }

  var MATE_LIFE_LAST = -99;

  function mateLife(){
    var P = S.P;
    if (!P || !P.alive || !P.mate) return;
    if (P.age - MATE_LIFE_LAST < 12) return;
    if (Math.random() > 0.22) return;
    MATE_LIFE_LAST = P.age;

    var e = pick(MATE_LIFE);
    var fx = e.fx || {};
    log(P.age, '【' + P.mate.n + '】' + e.t, e.cls || '');

    if (fx.dxpMul) P.xp += Math.round(yearXP() * 5 * fx.dxpMul);
    if (fx.speed) P.speed *= 1 + fx.speed;
    if (fx.wits) P.wits = Math.min(ATTR_CAP + 4, P.wits + fx.wits);
    if (fx.luck) P.luck = Math.max(0, P.luck + fx.luck);
    if (fx.body) P.body = Math.max(3, P.body + fx.body);
    if (fx.life) P.lifeBonus += fx.life;
    if (fx.brk) P.brk += fx.brk;

    if (fx.mateless){
      log(P.age, '你把她留下的半枚玉收进怀里。另一半，你这一世再没见着。', 'bad');
      if (!P.exMates) P.exMates = [];
      P.exMates.push(P.mate);
      P.mate = null;
      updateStatus();
    }
  }

  // 年龄段必发事件：一生九道坎，躲不掉
  function checkAgeEvent(){
    var P = S.P;
    if (!P || !P.alive) return false;
    if (!S.ageDone) S.ageDone = [];
    if ((S.ageSpin || 0) >= 3) return false;

    for (var i = 0; i < AGE_EVENTS.length; i++){
      if (S.ageDone[i]) continue;
      var e = AGE_EVENTS[i];
      if (P.age < e.from || P.age > e.to) continue;

      S.ageDone[i] = true;
      S.ageSpin = (S.ageSpin || 0) + 1;
      log(P.age, e.t, e.cls || 'big');

      if (e.fx) applyFx(e.fx);
      if (e.artifact){
        var a = rollArtifact();
        applyArtifact(a);
        log(P.age, '那道雷赔给你的东西是：' + a.n + '。', 'good');
      }
      if (e.mate && Math.random() < 0.62) meetMate(true);
      updateStatus();
      return true;
    }
    return false;
  }

  /* ============================================================
     十、抉择
  ============================================================ */

  function openChoice(ev){
    S.pending = ev;
    mq.textContent = ev.ch.q;
    mopts.innerHTML = '';

    // 把弹窗挡住的前情捞回来，摆在选项上面
    var box = document.getElementById('log');
    var story = '';
    if (box){
      var items = box.querySelectorAll('.ev');
      var start = Math.max(0, items.length - 4);
      var frag = [];
      for (var k = start; k < items.length; k++){
        var ag = items[k].querySelector('.age');
        var tx = items[k].querySelector('.txt');
        if (!tx) continue;
        var t = tx.textContent;
        if (t.length > 120) t = t.slice(0, 120) + '…';
        frag.push('<p><i>' + esc(ag ? ag.textContent : '') + '</i>' + esc(t) + '</p>');
      }
      if (frag.length) story = '<div class="choiceStory">' + frag.join('') + '</div>';
    }
    mopts.innerHTML = story;

    ev.ch.o.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'mopt';
      b.textContent = o.t;
      b.addEventListener('click', function(){
        resolveChoice(i);
      });
      mopts.appendChild(b);
    });

    modal.classList.add('show');
  }

  function resolveChoice(i){
    var ev = S.pending;
    if (!ev) return;

    var o = ev.ch.o[i];
    modal.classList.remove('show');
    S.pending = null;

    log(S.P.age, o.r, 'you');
    if (o.fx) applyFx(o.fx);
    if (o.deed) S.P.deeds.push(o.deed);
    if (o.echo) queueEcho(o.echo);
    if (o.set){
      if (o.set.sect) S.P.sect = o.set.sect;
      if (o.set.dao)  S.P.dao  = o.set.dao;
    }
    updateStatus();
  }

  function updateStatus(){
    if (!S.P) return;

    var P = S.P;
    var el;

    el = document.getElementById('st-age');
    if (el) el.textContent = P.age;
    el = document.getElementById('st-realm');
    if (el) el.textContent = realmName();
    el = document.getElementById('st-life');
    if (el) el.textContent = P.age + ' / ' + maxAge();
    el = document.getElementById('st-dao');
    if (el){
      var dao = P.dao || (P.sect ? P.sect : '散修');
      el.textContent = dao;
    }

    el = document.getElementById('xp-label');
    if (el){
      var need = needXP();
      el.textContent = '修为 ' + Math.floor(P.xp) + ' / ' + (need === Infinity ? '—' : need);
    }
    el = document.getElementById('xpfill');
    if (el){
      var pct = need === Infinity ? 100 : Math.min(100, (P.xp / need) * 100);
      el.style.width = pct + '%';
    }
    el = document.getElementById('stat-line');
    if (el){
      el.textContent = '禀赋 ' + P.root + ' · 悟性 ' + P.wits + ' · 体魄 ' + P.body + ' · 气运 ' + P.luck;
    }

    // 种族 / 法宝 / 功法
    var line2 = document.getElementById('st-race');
    if (line2){
      var rc = raceOf(P.race);
      line2.textContent = rc.n + ' · 功法 ' + (P.arts ? P.arts.length : 0) + '/' + artCap() +
        (P.arts && P.arts.length ? '（' + P.arts[P.arts.length - 1].n + '）' : '');
    }

    // 法宝卡
    el = document.getElementById('st-relic');
    if (el){
      var rn = P.relics ? P.relics.length : 0;
      el.textContent = rn ? rn + ' 件 · ' + P.relics[rn - 1].n : '空手';
      var card1 = document.getElementById('mc-relic');
      if (card1) card1.className = 'minicard' + (rn ? ' on' : '');
    }

    // 道侣卡
    el = document.getElementById('st-mate');
    if (el){
      if (P.mate){
        el.textContent = P.mate.n + '·' + P.mate.tag;
      } else if (P.exMates && P.exMates.length){
        el.textContent = '前任 ' + P.exMates[P.exMates.length - 1].n;
      } else {
        el.textContent = '尚无';
      }
      var card2 = document.getElementById('mc-mate');
      if (card2) card2.className = 'minicard' + (P.mate ? ' on' : '');
    }

    // 已结束
    if (!P.alive && !S.ended){
      S.ended = true;
      var btns = document.querySelectorAll('#btn-year');
      for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
    }
  }

  function log(age, text, cls){
    var box = document.getElementById('log');
    if (!box) return;

    var div = document.createElement('div');
    div.className = 'ev' + (cls ? ' ' + cls : '');
    div.innerHTML = '<span class="age">' + age + '岁</span><span class="txt">' + esc(text) + '</span>';
    box.appendChild(div);

    // 只保留最近 120 条
    while (box.children.length > 120) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }

  function doSeclusion(){
    var P = S.P;
    if (!P.alive) return;

    var startAge = P.age;
    var startRealm = P.realm;
    var sec = SECLUSIONS[Math.floor(Math.random() * SECLUSIONS.length)];

    log(startAge, '你封了洞府，在石壁上刻下自己的名字，然后入定。', 'you');
    log(startAge, sec.t, sec.cls || '');

    if (sec.fx){
      applyFx({
        root:sec.fx.root, wits:sec.fx.wits, body:sec.fx.body,
        luck:sec.fx.luck, life:sec.fx.life, dxp:sec.fx.dxp
      });
    }

    P.secMul = (sec.fx && sec.fx.mul) ? sec.fx.mul : 1;

    for (var i = 0; i < 10; i++){
      if (!P.alive) break;
      var ok = advanceYear(true);
      if (!ok) break;
    }

    P.secMul = 1;

    if (!P.alive) return;
    if (S.tribu) return;      // 闭关中天劫已至，交由玩家应对

    var grew = P.realm > startRealm;
    var tail = grew
      ? '出关时，你的境界已至' + realmName() + '。'
      : '出关时，修为厚了一层，境界却仍在原处。';

    var lines = [
      '洞口的松针积了一地，扫开时下面还压着去年的。',
      '你走出洞府，日光刺得眼睛发酸，站了很久才看清路。',
      '山下的溪改了道，你花了半天才认出这是自己来时的路。',
      '有一只鸟落在你肩上，啄了啄你的衣角，又飞走了。',
      '你先想起的是饭菜的味道，然后才想起自己已经十年没吃东西。'
    ];

    log(P.age, tail + lines[Math.floor(Math.random() * lines.length)], 'big');
  }

  /* ---------- 命轮（主循环） ---------- */

  /* ---------- 命轮 ---------- */
  function openWheel(){
    S.wheel = { spinning:false, idx:-1 };
    S.lastWheel = S.P.age;

    var c = document.getElementById('wheelCanvas');
    if (c) c.style.transform = 'rotate(' + S.wheelBase + 'deg)';

    var res = document.getElementById('wheelResult');
    if (res){ res.textContent = ''; res.classList.remove('show'); }

    var sb = document.getElementById('spinBtn');
    if (sb){ sb.style.display = 'block'; sb.disabled = false; sb.textContent = '转 动 命 轮'; }

    var wc = document.getElementById('wheelClose');
    if (wc) wc.style.display = 'none';

    var mqEl = document.getElementById('wheelMq');
    if (mqEl) mqEl.textContent = '命轮一转，光阴 ' + yearsPerSpin() + ' 年';

    drawWheel();
    document.getElementById('wheel').classList.add('show');
  }

  function drawWheel(){
    var c = document.getElementById('wheelCanvas');
    if (!c) return;

    var g = c.getContext('2d');
    var R = 160, r = 148;

    g.clearRect(0, 0, 320, 320);

    var total = wheelTotal(), a0 = 0;
    for (var i = 0; i < WHEEL.length; i++){
      var span = WHEEL[i].w / total * Math.PI * 2;
      var a1 = a0 + span;

      g.beginPath();
      g.moveTo(R, R);
      g.arc(R, R, r, a0, a1);
      g.closePath();
      g.fillStyle = WHEEL[i].col;
      g.fill();
      g.strokeStyle = 'rgba(120,200,220,0.18)';
      g.lineWidth = 1;
      g.stroke();

      g.save();
      g.translate(R, R);
      g.rotate(a0 + span / 2);
      g.fillStyle = WHEEL[i].kind === 'legend' ? '#ffe6a8' : '#dfeefa';
      g.font = '600 ' + (span < 0.34 ? 11 : 14) + 'px "Noto Serif SC", serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(WHEEL[i].n + (WHEEL[i].lv ? '+' + WHEEL[i].lv : ''), 100, 0);
      g.restore();

      a0 = a1;
    }

    g.beginPath();
    g.arc(R, R, 24, 0, Math.PI * 2);
    g.fillStyle = '#0a1420';
    g.fill();
    g.strokeStyle = 'rgba(79,227,193,0.45)';
    g.stroke();

    g.fillStyle = '#ffd479';
    g.font = '600 15px "Noto Serif SC", serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('命', R, R + 1);
  }

  function spinWheel(){
    if (!S.wheel || S.wheel.spinning || !S.P || !S.P.alive) return;

    var idx = wheelRoll();

    S.wheel.spinning = true;
    S.wheel.idx = idx;

    var total = wheelTotal(), start = 0;
    for (var j = 0; j < idx; j++) start += WHEEL[j].w;
    var centerDeg = (start + WHEEL[idx].w / 2) / total * 360;
    var delta = ((270 - centerDeg) % 360 + 360) % 360;
    var rot = 360 * 5 + delta;

    S.wheelBase += rot;

    var c = document.getElementById('wheelCanvas');
    if (c) c.style.transform = 'rotate(' + S.wheelBase + 'deg)';

    var sb = document.getElementById('spinBtn');
    if (sb) sb.disabled = true;

    setTimeout(function(){
      if (!S.wheel || !S.P) return;
      S.wheel.spinning = false;

      var say = applySector(idx, false);

      var el = document.getElementById('wheelResult');
      if (el){
        el.textContent = '「' + WHEEL[idx].n + '」 —— ' + say;
        el.classList.add('show');
      }

      if (sb){ sb.style.display = 'none'; sb.disabled = false; }

      if (!S.P || !S.P.alive){
        document.getElementById('wheel').classList.remove('show');
        S.wheel = null;
        updateStatus();
        return;
      }

      var wc = document.getElementById('wheelClose');
      if (wc) wc.style.display = 'block';

      updateStatus();
    }, 2100);
  }

  function closeWheel(){
    document.getElementById('wheel').classList.remove('show');
    S.wheel = null;
    updateStatus();
  }

  /* ---------- 转生轮盘：开局随机决定身份 ---------- */
  var ORIGIN = { spinning: false, base: 0, chosen: null };

  function originTotal(){
    var t = 0;
    for (var i = 0; i < RACES.length; i++) t += RACES[i].w;
    return t;
  }

  function drawOriginWheel(){
    var c = document.getElementById('originCanvas');
    if (!c) return;
    var g = c.getContext('2d');
    var size = c.width, R = size / 2, rr = R - 16;
    g.clearRect(0, 0, size, size);

    var total = originTotal(), a0 = 0;
    for (var i = 0; i < RACES.length; i++){
      var span = RACES[i].w / total * Math.PI * 2;
      var a1 = a0 + span;
      g.beginPath(); g.moveTo(R, R); g.arc(R, R, rr, a0, a1); g.closePath();
      g.fillStyle = RACES[i].col; g.fill();
      g.strokeStyle = 'rgba(120,200,220,0.16)'; g.lineWidth = 1; g.stroke();

      g.save(); g.translate(R, R); g.rotate(a0 + span / 2);
      g.fillStyle = '#e3f0fb';
      g.font = '600 ' + (span < 0.3 ? 10 : 13) + 'px "Noto Serif SC", serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(RACES[i].n, 96, 0);
      g.restore();

      a0 = a1;
    }

    g.beginPath(); g.arc(R, R, 22, 0, Math.PI * 2);
    g.fillStyle = '#0a1420'; g.fill();
    g.strokeStyle = 'rgba(255,212,121,0.35)'; g.stroke();
    g.fillStyle = '#ffd479'; g.font = '600 14px "Noto Serif SC", serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('生', R, R + 1);
  }

  function openOrigin(){
    ORIGIN.chosen = null; ORIGIN.base = 0; ORIGIN.spinning = false;
    var c = document.getElementById('originCanvas');
    if (c) c.style.transform = 'rotate(0deg)';
    document.getElementById('originName').textContent = '';
    document.getElementById('originDesc').textContent = '落进哪一格，就是哪一世。';
    document.getElementById('originOk').style.display = 'none';
    var sb = document.getElementById('originSpin');
    sb.style.display = 'block'; sb.disabled = false;
    drawOriginWheel();
    document.getElementById('originModal').classList.add('show');
  }

  function spinOrigin(){
    if (ORIGIN.spinning) return;

    var total = originTotal(), roll = Math.random() * total, acc = 0, idx = 0;
    for (var i = 0; i < RACES.length; i++){
      acc += RACES[i].w;
      if (roll <= acc){ idx = i; break; }
    }

    var start = 0;
    for (var j = 0; j < idx; j++) start += RACES[j].w;
    var centerDeg = (start + RACES[idx].w / 2) / total * 360;
    var delta = ((270 - centerDeg) % 360 + 360) % 360;
    ORIGIN.base += 360 * 5 + delta;

    var c = document.getElementById('originCanvas');
    if (c) c.style.transform = 'rotate(' + ORIGIN.base + 'deg)';

    var sb = document.getElementById('originSpin');
    sb.disabled = true;
    ORIGIN.spinning = true;

    setTimeout(function(){
      ORIGIN.spinning = false;
      ORIGIN.chosen = RACES[idx];
      document.getElementById('originName').textContent = RACES[idx].n;
      document.getElementById('originDesc').textContent = RACES[idx].d;
      sb.style.display = 'none';
      sb.disabled = false;
      document.getElementById('originOk').style.display = 'block';
    }, 2200);
  }

  function confirmOrigin(){
    if (!ORIGIN.chosen) return;
    S.raceId = ORIGIN.chosen.id;
    document.getElementById('originModal').classList.remove('show');
    beginLife(ORIGIN.chosen.id);
  }

  /* 抽取指定类别事件 */
  function pickByKind(kind){
    var P = S.P, pool = [];
    for (var i = 0; i < EVENTS.length; i++){
      var e = EVENTS[i];
      if (e.kind !== kind) continue;
      if (P.age < e.a || P.age > e.b) continue;
      if (S.used.indexOf(i) >= 0) continue;
      pool.push(e);
    }
    return pool.length ? pick(pool) : null;
  }

  function fireEvent(ev){
    if (!ev) return;
    S.used.push(EVENTS.indexOf(ev));
    hitEvent(ev);
  }

  /* 一格：先过一年，再按格子结算 */
  function applySector(idx, silent){
    var P = S.P, sec = WHEEL[idx];
    if (!P || !P.alive) return '……';

    S.ageSpin = 0;
    var realm0 = P.realm;
    var yps = yearsPerSpin();

    var died = false;
    for (var y = 0; y < yps; y++){
      if (!advanceYear(true)){ died = true; break; }
    }
    if (died){
      if (!S.P || !S.P.alive) return '……';
      if (S.tribu) return '你走到了大乘圆满，天劫将至。';
      return '……';
    }

    if (P.realm > realm0){
      log(P.age, '这几年里，你冲破了' + realmName() + '那道门槛。', 'big');
      upgradeWheel();
    }
    if (!P.alive) return '……';

    var mul = 1 + (sec.lv || 0) * 0.4;
    var gain = Math.round(yearXP() * yps * mul);

    if (S.chainKind === sec.kind){ S.chainN = (S.chainN || 1) + 1; }
    else { S.chainKind = sec.kind; S.chainN = 1; }

    if (S.chainN >= 3){
      S.chainN = 0;
      var bonus = Math.round(yearXP() * 2);
      P.xp += bonus;
      log(P.age, '命轮连转三次都落在「' + sec.n + '」，天地像被你踩出一条槽。修为 +' + bonus + '。', 'good');
    }

    if (sec.kind === 'legend') S.pity = 0;
    else S.pity = (S.pity || 0) + 1;

    var txt = '';

    switch (sec.kind){
      case 'event':
        maybeEvent();
        txt = '这一年，你遇上了一桩事。';
        break;

      case 'train':
        P.xp += gain;
        log(P.age, pick([
          '你在洞府里坐满一年，气息沉下去，像石头沉进水底。修为 +' + gain + '。',
          '这一年你只做了一件事：把气在骨头里转了三圈。修为 +' + gain + '。',
          '你把蒲团坐出了一个坑。修为 +' + gain + '。',
          '你在崖边练了一整年的桩，风把你的衣角吹薄了。修为 +' + gain + '。',
          '你把上一篇经文又读了一遍，这次读出了别的意思。修为 +' + gain + '。',
          '你把洞府的灯点了一整年，灯没灭，你也没走。修为 +' + gain + '。'
        ]), 'good');
        txt = '修为 +' + gain;
        break;

      case 'epiphany':
        P.xp += gain * 2;
        if (Math.random() < 0.35) P.wits = Math.min(ATTR_CAP, P.wits + 1);
        log(P.age, pick([
          '某个瞬间，你把从前看不懂的东西看懂了。修为 +' + (gain * 2) + '。',
          '你听见自己骨头里响了一声，像一把锁开了。修为 +' + (gain * 2) + '。',
          '你在打水的时候忽然站住，水洒了一地，你没有发觉。修为 +' + (gain * 2) + '。',
          '你想起很多年前有人说过一句话，当时没听懂，这一刻懂了。修为 +' + (gain * 2) + '。'
        ]), 'good');
        txt = '修为 +' + (gain * 2);
        break;

      case 'peril': {
        // 险境：气运说了算。运气好，摔下去反而捡到东西
        var pr = Math.min(0.92, 0.34 + P.luck * 0.032 + relicSum('fortune'));
        if (Math.random() < pr){
          var pw = Math.random();
          if (pw < 0.42){
            var pg = Math.round(NEED[Math.min(P.realm, 8)] * 0.06);
            P.xp += pg;
            log(P.age, '仇家把你打下山崖。你没死，崖底有一处没人的洞府，你在里面坐了很多年。修为 +' + pg + '。', 'good');
            txt = '坠崖未死，修为 +' + pg;
          } else if (pw < 0.75){
            var pa = rollArtifact();
            applyArtifact(pa);
            log(P.age, '你从崖上掉下去，砸在一具白骨旁边。白骨手里握着' + pa.n + '，见你来了，松开了手。', 'good');
            txt = '得' + pa.n;
          } else {
            tryLearnArt();
            txt = '崖底的石壁上刻着字。';
          }
        } else {
          P.body = Math.max(3, P.body - 1);
          P.lifeBonus -= 30;
          log(P.age, '你在山中遇险，出来时少了一块肉，多了一道永远好不了的伤。', 'bad');
          txt = '体魄 -1，寿元 -30';
        }
        break;
      }

      case 'fortune': {
        // 奇遇：气运 + 罗盘之类的东西，决定你会不会遇上「不该遇上的」
        var fr = Math.min(0.9, 0.28 + P.luck * 0.035 + relicSum('fortune'));
        if (Math.random() < fr){
          var fw = Math.random();
          if (fw < 0.34){
            var fa = rollArtifact();
            applyArtifact(fa);
            log(P.age, '你走进一片本不该有的雾。雾散了，脚边躺着' + fa.n + '。', 'good');
            txt = '奇遇：' + fa.n;
          } else if (fw < 0.6){
            P.lifeBonus += 200;
            log(P.age, '你在山里遇见一个自称「守园人」的老者。他递给你一枚果子，说：「吃了它，你就有更多时间了。」', 'good');
            txt = '寿元 +200';
          } else if (fw < 0.82){
            P.wits = Math.min(ATTR_CAP + 4, P.wits + 2);
            P.luck = Math.min(ATTR_CAP + 8, P.luck + 1);
            log(P.age, '你在一处洞府里看见天花板上的星图。你看了很久，忽然明白自己一直在看一张地图。', 'good');
            txt = '悟性 +2，气运 +1';
          } else if (fw < 0.92 && !P.mate){
            meetMate(true);
            txt = '奇遇：遇上一个人';
          } else {
            tryLearnArt();
            txt = '洞府的石桌上摊着一卷东西。';
          }
        } else {
          log(P.age, '你走到一个本该有奇遇的地方。那里什么都没有，只有风。', '');
          txt = '空跑一趟';
        }
        break;
      }

      case 'artifact': {
        var aa = rollArtifact();
        applyArtifact(aa);
        log(P.age, '一件东西认了你：' + aa.n + '（' + aa.t + '·' + ['残','凡','灵','宝','仙'][aa.q] + '品）——' + aa.d, 'good');
        txt = '得法宝：' + aa.n;
        break;
      }

      case 'decade': {
        // 奔流：原来「连转十轮」的那口气，现在压在轮盘上
        var years = yearsPerSpin() * 5;
        var extraYears = 0, stopped = false;
        for (var d = 0; d < years; d++){
          if (!advanceYear(true)){ stopped = true; break; }
          extraYears++;
        }
        if (!S.P || !S.P.alive) return '……';
        if (S.tribu) return '你走到了大乘圆满，天劫将至。';
        var dg = Math.round(yearXP() * Math.max(1, extraYears) * 0.9);
        P.xp += dg;
        log(P.age, '轮盘卡住了。天地从你身上碾过去 ' + extraYears + ' 年，你抬头时，山换了颜色。修为 +' + dg + '。', 'big');
        txt = '光阴奔流 ' + extraYears + ' 年，修为 +' + dg;
        break;
      }

      case 'choice': {
        var cev = null;
        for (var i = 0; i < EVENTS.length; i++){
          var e = EVENTS[i];
          if (!e.ch) continue;
          if (P.age < e.a || P.age > e.b) continue;
          if (S.used.indexOf(i) >= 0) continue;
          if (!cev) cev = e;
        }
        if (cev && !silent){ fireEvent(cev); txt = '有些事，得你自己拿主意。'; }
        else { maybeEvent(); txt = '这一年你随波过去了。'; }
        break;
      }

      case 'secret': {
        var sev = pickByKind('secret');
        if (sev){ fireEvent(sev); txt = '你踏进了一处不该在人间的地方。'; }
        else {
          P.xp += gain * 2;
          if (Math.random() < 0.45) tryLearnArt();
          if (!P.mate && Math.random() < 0.3) meetMate(true);
          txt = '你寻到一处旧洞府，空着，灵气却极足。修为 +' + (gain * 2);
        }
        break;
      }

      case 'boon': {
        var r = Math.random();
        if (r < 0.34){ P.luck = Math.min(ATTR_CAP + 5, P.luck + 2); log(P.age, '你在山上捡到一样东西，从此运气好了些。', 'good'); txt = '气运 +2'; }
        else if (r < 0.68){ P.lifeBonus += 40; log(P.age, '有人送来一株说不清名字的草，你吃了，觉得身子轻了。', 'good'); txt = '寿元 +40'; }
        else {
          var ba = rollArtifact();
          applyArtifact(ba);
          log(P.age, '有人把' + ba.n + '塞给你，说：「拿着，别问。」你问了，那人已经走了。', 'good');
          txt = '法宝 +1：' + ba.n;
        }
        break;
      }

      case 'doom': {
        var r2 = Math.random();
        if (r2 < 0.4){ P.body = Math.max(3, P.body - 2); P.xp = Math.floor(P.xp * 0.8); log(P.age, '天降横祸。你在血泊里躺了半年，醒来第一件事是找自己的剑。', 'bad'); txt = '体魄 -2，修为 -20%'; }
        else if (r2 < 0.7){ P.lifeBonus -= 60; log(P.age, '你的寿数被人从命册上划掉了一截。', 'bad'); txt = '寿元 -60'; }
        else {
          if (P.relics.length){
            var lost = P.relics.pop();
            log(P.age, '你护身的' + lost.n + '在夜里碎了。碎的时候，你听见一声很轻的叹息。', 'bad');
            txt = '失去法宝：' + lost.n;
          } else {
            P.luck = Math.max(0, P.luck - 2);
            log(P.age, '你什么也没有，于是老天拿走了你的运气。', 'bad');
            txt = '气运 -2';
          }
        }
        break;
      }

      case 'legend': {
        P.xp += Math.round(NEED[Math.min(P.realm, 8)] * 0.12);
        P.luck = Math.min(ATTR_CAP + 8, P.luck + 3);
        var la = rollArtifact();
        applyArtifact(la);
        log(P.age, '这一年的分量，比你此前几百年加起来都重。你不太敢回想它是怎么发生的。', 'big');
        txt = '修为暴涨，气运 +3';
        meta.legend = (meta.legend || 0) + 1;
        saveMeta();
        break;
      }

      default:
        txt = '这一年，什么也没有发生。';
    }

    updateStatus();
    return txt;
  }

  function upgradeWheel(){
    var pool = [];
    for (var i = 0; i < WHEEL.length; i++){
      if (WHEEL[i].kind === 'void') continue;
      if ((WHEEL[i].lv || 0) >= 3) continue;
      pool.push(i);
    }
    if (!pool.length) return;
    var i2 = pick(pool);
    WHEEL[i2].lv = (WHEEL[i2].lv || 0) + 1;
    log(S.P.age, '命轮上「' + WHEEL[i2].n + '」那一格比从前宽了一点。（' + WHEEL[i2].n + '+' + WHEEL[i2].lv + '）', 'good');
    drawWheel();
  }

  function spinMany(n){
    if (!S.P || !S.P.alive) return;
    for (var i = 0; i < n; i++){
      if (!S.P || !S.P.alive) break;
      if (S.tribu || S.pending) break;
      applySector(wheelRoll(), true);
    }
    updateStatus();
  }

  /* ---------- 天劫 ---------- */

  function openTribulation(){
    var P = S.P;
    if (!P.alive) return;

    S.tribu = { step:0, busy:false, hp:5 + Math.max(3, Math.min(11, P.body)) };

    log(P.age, '云层压下来，天光一寸寸熄了。你抬头，第一道雷已在酝酿。', 'big');

    tribuRender();
    document.getElementById('tribu').classList.add('show');
  }

  function tribuRate(mode){
    var P = S.P, T = S.tribu;
    var rate = 0.5 + P.wits * 0.006 + P.luck * 0.006 + P.brk - T.step * 0.018;
    rate += relicSum('tribu') * 0.6;
    if (P.mateTribu) rate += P.mateTribu * 0.6;
    if (mode === 'guard') rate += 0.18;
    if (mode === 'dao') rate += 0.30;
    return Math.max(0.08, Math.min(0.82, rate));
  }

  function tribuRender(){
    var P = S.P, T = S.tribu;
    if (!T) return;

    var dots = '';
    for (var i = 0; i < 9; i++){
      dots += '<span class="' + (i < T.step ? 'on' : 'off') + '">✦</span>';
    }
    document.getElementById('tribuDots').innerHTML = dots;

    document.getElementById('tribuMsg').textContent = TRIB_TEXT[Math.min(T.step, 8)];

    var rate = Math.round(tribuRate('hard') * 100);
    document.getElementById('tribuInfo').textContent =
      '第 ' + (T.step + 1) + ' 道 / 共九道　·　护体 ' + T.hp +
      '　·　法宝 ' + (P.relics ? P.relics.length : 0) + '　·　硬抗成算 ' + rate + '%';

    var opts = document.getElementById('tribuOpts');
    opts.innerHTML = '';

    var list = [
      { k:'hard',  d:'失败：体魄 -2', t:'硬 抗 此 雷' },
      { k:'guard', d:'成算 +18%，消耗 1 件法宝；失败体魄 -1', t:'以法宝护身' },
      { k:'dao',   d:'成算 +30%，但无论成败体魄 -1、修为 -8%', t:'以道化雷' }
    ];

    for (var j = 0; j < list.length; j++){
      (function(o){
        var b = document.createElement('button');
        b.className = 'mopt';
        b.innerHTML = o.t + '<span style="display:block;font-size:11px;color:#7f8fa3;margin-top:3px">' + o.d + '</span>';

        if (o.k === 'guard' && (!P.relics || P.relics.length <= 0)){
          b.style.opacity = '.35';
          b.style.cursor = 'not-allowed';
        }

        b.addEventListener('click', function(){
          if (o.k === 'guard' && (!P.relics || P.relics.length <= 0)) return;
          if (S.tribu && S.tribu.busy) return;
          tribuChoose(o.k);
        });

        opts.appendChild(b);
      })(list[j]);
    }
  }

  function tribuChoose(mode){
    var P = S.P, T = S.tribu;
    if (!T || T.busy) return;
    T.busy = true;

    var ok = Math.random() < tribuRate(mode);
    var msg;

    if (mode === 'guard' && P.relics && P.relics.length) P.relics.pop();
    if (mode === 'dao'){
      T.hp -= 1;
      P.xp = Math.floor(P.xp * 0.92);
    }

    if (ok){
      if (Math.random() < 0.32){
        T.hp -= 1;
        msg = '雷光擦过你的肩，皮肉焦了一片。你咬牙站住了。';
      } else {
        msg = '雷光在你身前三寸散开，你连眼睛都没有闭上。';
      }
    } else {
      T.hp -= 2;
      msg = '雷光贯穿了你的胸口，血从嘴里涌出来，烫得吓人。';
    }

    log(P.age, '第' + (T.step + 1) + '道天雷：' + msg, ok ? 'good' : 'bad');

    var dots = '';
    for (var i = 0; i < 9; i++){
      dots += '<span class="' + (i <= T.step ? 'on' : 'off') + '">✦</span>';
    }
    document.getElementById('tribuDots').innerHTML = dots;
    document.getElementById('tribuMsg').textContent = msg;
    document.getElementById('tribuOpts').innerHTML =
      '<div style="font-size:12px;color:#8fa3b6;letter-spacing:2px;padding:12px 0">雷光未散……</div>';

    T.step++;

    setTimeout(function(){
      if (!S.tribu || S.tribu !== T || !S.P) return;
      if (T.hp <= 0){ tribuFail(); return; }
      if (T.step >= 9){ tribuWin(); return; }
      T.busy = false;
      tribuRender();
    }, 1100);
  }

  function tribuWin(){
    var P = S.P;
    S.tribu = null;
    document.getElementById('tribu').classList.remove('show');
    document.getElementById('tribuOpts').innerHTML = '';

    log(P.age, '第九道雷散尽。天地忽然安静下来，安静得能听见自己的心跳。', 'big');

    setTimeout(function(){
      if (!S.P) return;
      P.realm = 9;
      P.xp = 0;
      ascend();
    }, 380);
  }

  function tribuFail(){
    var P = S.P;
    S.tribu = null;
    document.getElementById('tribu').classList.remove('show');
    document.getElementById('tribuOpts').innerHTML = '';

    P.alive = false;
    P.diedInTribu = true;
    P.body = Math.max(0, P.body);
    P.endReason = '雷光落尽，你的身体散作了尘埃。那一瞬你想起的，是青石镇的雨天。';
    log(P.age, P.endReason, 'bad');

    updateStatus();

    if (P.realm > meta.bestRealm){ meta.bestRealm = P.realm; saveMeta(); }

    setTimeout(function(){ if (S.P) showSummary(); }, 420);
  }

  function ascend(){
    var P = S.P;
    if (!P.alive) return false;

    P.alive = false;
    P.endReason = '九天雷云散开。你在云端回头看了一眼，这一世的人，从此不在人间。';
    log(P.age, P.endReason, 'big');
    updateStatus();

    if (P.realm > meta.bestRealm){
      meta.bestRealm = P.realm;
      saveMeta();
    }

    setTimeout(function(){ showSummary(); }, 420);
    return false;
  }

  function endLife(reason){
    var P = S.P;
    if (!P.alive) return false;

    // 天命免死
    if (P.flags.fate && !P.fateUsed){
      P.fateUsed = true;
      log(P.age, '你本该死了。但那一刻，有什么东西替你挡了一下——你不记得是什么。', 'big');
      P.body = Math.max(1, P.body);
      P.age = Math.max(1, P.age - 1);
      return true;
    }

    P.alive = false;
    P.endReason = reason;
    log(P.age, reason, 'bad');

    // 人走了，命轮也该收起来
    var wl = document.getElementById('wheel');
    if (wl) wl.classList.remove('show');
    S.wheel = null;

    updateStatus();

    if (P.realm > meta.bestRealm){
      meta.bestRealm = P.realm;
      saveMeta();
    }

    setTimeout(function(){ showSummary(); }, 420);
    return false;
  }

  var TITLES = [
    '一世凡人', '炼气散修', '筑基修士', '金丹真人', '元婴老祖',
    '化神尊者', '炼虚真君', '合体大能', '大乘老祖', '飞升仙人'
  ];

  /* ---------- 结局 ---------- */
  var ENDINGS = [
    { k:'天门', cond:function(P){ return P.realm >= 9; },
      t:'第九道雷散尽，天门在你头顶裂开一线。你走进去的时候，听见身后整座山都在响——那是无数人的抬头。' },
    { k:'身死道消', cond:function(P){ return P.diedInTribu; },
      t:'雷光落尽。你散作尘埃，又被山风吹散。多年后有人在崖上拾到半枚焦黑的玉牌，认不出是谁的。' },
    { k:'兵解', cond:function(P){ return P.age < 70 && P.fateUsed; },
      t:'你本该死去，却被什么东西挡了一下。后来你想明白了：那不是运气，是有人替你付了账。' },
    { k:'守城人', cond:function(P){ return P.deeds.indexOf('saveCity') >= 0; },
      t:'那座城的城墙修了三百年，你守了两百年。你死后，城里的人把你的名字写进了城隍庙的第一行。' },
    { k:'传道', cond:function(P){ return P.deeds.indexOf('teach') >= 0; },
      t:'你收过的那个笨徒弟，后来成了别人的师父。他教徒弟的第一句话，是你当年随口说的。' },
    { k:'剑折', cond:function(P){ return P.deeds.indexOf('killOld') >= 0 && P.realm >= 5; },
      t:'你的剑断在某个说不清的地方。有人说你死了，有人说你只是把剑埋了，人也一起埋了。' },
    { k:'开山立派', cond:function(P){ return !!P.sect && P.realm >= 5; },
      t:'你在自己长大的那座山头立了块碑。碑上是宗门的名字，名字是你半夜想出来的，后来没有人改。' },
    { k:'话本', cond:function(P){ return P.luck >= 18 && P.realm <= 3; },

    { k:'吞天', cond:function(P){ return P.dao === '魔道' && P.realm >= 7 && P.age >= 400; },
      t:'你终究没有飞升，也没有下地狱。你只是站在原地，把这一方天地的气运一点一点吸干。' },
    { k:'无名碑', cond:function(P){ return P.realm >= 5 && P.age < 500; },      t:'你留下的东西不多：一座空洞府，半部没写完的手记，还有一块谁都不知道给谁立的碑。' },
    { k:'教书人', cond:function(P){ return P.wits >= 18 && P.realm <= 4; },
      t:'你没有飞升，也没有成魔。你在山下开了个学堂，教孩子们认字。最后一课，你教了“仙”字。' },
    { k:'山中老怪', cond:function(P){ return P.realm >= 6 && P.age >= 800; },
      t:'你活得太久了，久到忘了自己为什么活着。后来的修士路过你的山，会绕道走——不是怕，是敬。' },
    { k:'凡人一世', cond:function(P){ return P.realm <= 1; },
      t:'你没有等到仙缘，也没有等到大难。你种了一辈子地，死的时候院子里那棵枣树刚好结果。' },
    { k:'短命', cond:function(P){ return P.age < 40; },
      t:'你死得太早，早到来不及留下什么。只有一个人记得你的名字，那个人后来也忘了。' },
    { k:'散修', cond:function(P){ return true; },
      t:'你走完了这一生，没有惊天动地，也没有遗臭万年。山上的野草又长了一茬，没有人知道你埋在哪里。' }
  ];

  function mateTail(P, e){
    if (!P || !P.mate) return e;
    var tails = [
      ' 你走后，' + P.mate.n + '还在原地站了很久。',
      ' ' + P.mate.n + '把你没说完的那句话替你说完了。',
      ' 你最后想起的，是' + P.mate.n + '说的那句“下次不许再惹这种人”。',
      ' 你的道侣' + P.mate.n + '没来送你——据说她那天正好在办别的事。'
    ];
    return { k: e.k, t: e.t + pick(tails) };
  }

  function pickEnding(P){
    var has = function(d){ return P.deeds.indexOf(d) >= 0; };

    if (P.diedInTribu){
      if (has('spareOld')) return { k:'雷下留人', t:'你死在第九道雷里。被你放走的那个老人，在你死后替你收了尸。他说，你比他强。' };
      if (has('saveCity')) return { k:'城在，人不在', t:'雷落下的那天，那城里的所有人都听见了。他们在城墙上点了三天三夜的灯。' };
      return ENDINGS[1];
    }

    if (P.realm >= 9){
      var re9 = RACE_END[P.origin || 'human'];
      if (re9 && re9.asc) return mateTail(P, pick(re9.asc));
      if (has('saveCity')) return { k:'天门 · 携一城香火', t:'你飞升那天，那座城的人全都跪下了。你带走的不是修为，是两百年的香火气。' };
      if (has('teach')) return { k:'天门 · 有人接灯', t:'你走的时候没有回头。山门里那个笨徒弟正拿着你的旧笔记，一个字一个字地读。' };
      if (has('readNote') && P.wits >= 16) return { k:'天门 · 看破', t:'你踏进天门的那一刻忽然笑了。原来那个坐化的人写的不是遗言，是路标。' };
      if (P.dao === '魔道') return { k:'天门 · 逆着走', t:'你是踩着别人的骨头上来的。天门开了，你没有犹豫，身后什么都没留下。' };
      return ENDINGS[0];
    }

    if (P.origin && P.origin !== 'human'){
      var re0 = RACE_END[P.origin];
      if (re0 && re0.fall) return mateTail(P, pick(re0.fall));
    }

    // 未触发专属结局时，按最终境界给一个体面的收束，避免一律「散修」
    if (P.realm >= 7) return pick([
      { k:'一步之遥', t:'你走到了' + realmName() + '，只差一步。寿元先到，人留在了原地。山上那株老松，那年多了一圈年轮。' },
      { k:'再等一世', t:'你在' + realmName() + '卡了很多年。有人劝你转修别道，你不肯。最后那口气散在蒲团上，姿势和前一天一模一样。' },
      { k:'差一口气', t:'天门的高度你已经摸到了。你算了算剩下的寿元，够走完这条路，不够推开门。你在门前坐化了。' }
    ]);
    if (P.realm === 6) return pick([
      { k:'山中的一声钟', t:'你死在' + realmName() + '，寿元耗尽。山门里有人敲了一声钟，敲完也没人问是敲给谁的。' },
      { k:'半步', t:'' + realmName() + '的中境，你停在这里。后来有人翻你的手记，看到最后一句是“往下不够，往上不敢”。' }
    ]);
    if (P.realm === 5) return pick([
      { k:'炉火未冷', t:'一炉丹没炼完，人先没了。那炉火在你死后还烧了三天，烧到最后自己灭了。' },
      { k:'虚了', t:'你把自己炼得很空，最后连人形都守不住。有人在山里见过一团影子，说那东西还会呼吸。' }
    ]);
    if (P.realm === 4) return pick([
      { k:'未竟', t:'你在' + realmName() + '止步。留下的只有半卷手稿，末尾一行写着“再等等”。没人等到。' },
      { k:'元胎无声', t:'你的元婴养成了，却始终不出声。到死它都没睁眼，像一件没做完的东西。' },
      { k:'洞府的主人', t:'洞府修得很齐整，丹炉、药圃、经架一应俱全。你死后三百年，才有人找到这处地方，那时你早成了一把骨头。' }
    ]);
    if (P.realm === 3) return pick([
      { k:'一粒金丹', t:'金丹是成了，仙没成。你把丹埋在洞府后山，说留给下一个路过的人。' },
      { k:'丹成，人散', t:'金丹圆成那夜，你高兴了一场，第二天就病倒了。修道这一行，有时候只差这么一点运气。' }
    ]);

    for (var i = 2; i < ENDINGS.length; i++){
      if (ENDINGS[i].cond(P)) return ENDINGS[i];
    }
    return ENDINGS[ENDINGS.length - 1];
  }

  function showSummary(){
    var P = S.P;

    var title = TITLES[Math.min(P.realm, 9)];
    if (P.diedInTribu) title = '渡劫身死';
    else if (P.realm >= 9) title = '飞升仙人';
    else if (P.dao === '魔道' && P.realm >= 3) title = '魔道尊者';
    if (P.sect && P.realm <= 2) title = '山门弟子';

    var score = P.realm * 1000 + P.age * 2 + (P.root + P.wits + P.body + P.luck) * 15;
    var rank;
    if (P.realm >= 9) rank = '传说';
    else if (P.realm >= 6) rank = '绝代';
    else if (P.realm >= 4) rank = '惊艳';
    else if (P.realm >= 2) rank = '尚可';
    else rank = '平庸';

    var inheritChoices = P.talents.map(function(t, i){
      return '<button class="mopt" data-inh="' + esc(t.n) + '" style="margin-top:6px">继承 · ' + esc(t.n) + '</button>';
    }).join('');

    var ending = pickEnding(P);

    modal.classList.add('show');
    mq.textContent = '';
    mopts.innerHTML = '' +
      '<div class="summary-title">' + title + '</div>' +
      '<div class="summary-sub">第 ' + meta.runs + ' 世 · ' + rank + '</div>' +
      '<div class="ending"><div class="ek">结局 · ' + ending.k + '</div><div class="et">' + ending.t + '</div></div>' +
      '<div class="srow"><span>最终境界</span><b class="gold">' + realmName() + '</b></div>' +
      '<div class="srow"><span>享年</span><b>' + P.age + ' 岁</b></div>' +
      '<div class="srow"><span>禀赋 / 悟性</span><b>' + P.root + ' / ' + P.wits + '</b></div>' +
      '<div class="srow"><span>体魄 / 气运</span><b>' + P.body + ' / ' + P.luck + '</b></div>' +
      '<div class="srow"><span>种族</span><b>' + esc(raceOf(P.race).n) + '</b></div>' +
      '<div class="srow"><span>法宝 / 功法</span><b>' + (P.relics ? P.relics.length : 0) + ' 件 / ' + (P.arts ? P.arts.length : 0) + ' 篇</b></div>' +
      ((P.quirks && P.quirks.length) ? '<div class="srow"><span>守过的规矩</span><b>' + P.quirks.map(function(q){ return esc(q.n); }).join('、') + '</b></div>' : '') +
      ((P.mate) ? '<div class="srow"><span>道侣</span><b class="gold">' + esc(P.mate.n) + '</b></div>' :
       (P.mates && P.mates.length ? '<div class="srow"><span>道侣</span><b>共 ' + P.mates.length + ' 位，最后一位已散</b></div>' : '')) +
      '<div class="srow"><span>道途</span><b>' + esc(P.dao || (P.sect ? P.sect : '散修')) + '</b></div>' +
      '<div class="inherit">' + esc(P.endReason) + '<br>可择一份天赋，带往下一世。' + inheritChoices + '</div>' +
      '<button class="btn ghost" id="againBtn" style="margin-top:12px">再入轮回</button>';

    modal.querySelectorAll('[data-inh]').forEach(function(b){
      b.addEventListener('click', function(){
        meta.inherit = b.getAttribute('data-inh');
        saveMeta();
        b.textContent = '已继承 · ' + b.getAttribute('data-inh');
      });
    });

    document.getElementById('againBtn').addEventListener('click', function(){
      modal.classList.remove('show');
      again();
    });
  }

  function again(){
    S.attrs = { root:0, wits:0, body:0, luck:0 };
    S.P = null;
    S.raceId = '';
    S.ended = false;
    S.pending = null;
    S.tribu = null;
    S.wheel = null;
    S.wheelBase = 0;
    S.lastWheel = 0;
    S.echoes = [];
    S.ageDone = [];
    S.ageSpin = 0;
    MATE_LIFE_LAST = -99;
    document.getElementById('tribu').classList.remove('show');
    document.getElementById('wheel').classList.remove('show');
    mopts.innerHTML = '';
    rollTalents();
    renderTalent();
  }

  /* ============================================================
     十三、启动
  ============================================================ */

  rollTalents();
  renderTalent();

  document.getElementById('spinBtn').addEventListener('click', spinWheel);
  document.getElementById('wheelClose').addEventListener('click', closeWheel);

  document.getElementById('originSpin').addEventListener('click', spinOrigin);
  document.getElementById('originOk').addEventListener('click', confirmOrigin);

})();
</script>
</body>
</html>
