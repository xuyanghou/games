<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素吞噬者 · 贪吃蛇</title>
<style>
    :root {
        --bg: #0b0f18;
        --panel: rgba(255,255,255,0.06);
        --stroke: rgba(255,255,255,0.12);
        --text: #fff;
        --dim: rgba(255,255,255,0.55);
        --lime: #7dff5c;
    }
    * { box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
        font-family:'Noto Sans SC', -apple-system, "Segoe UI", sans-serif; }
    #wrap { position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:12px; padding:16px; }

    .head { width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .title h1 { font-size:1.5rem; font-weight:900; letter-spacing:3px; color:var(--lime);
        text-shadow:0 0 18px rgba(125,255,92,0.4); }
    .title p { font-size:0.72rem; color:var(--dim); margin-top:2px; }
    .scores { display:flex; gap:8px; }
    .box { background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:6px 13px; text-align:center; min-width:72px; }
    .box .k { font-size:0.62rem; color:var(--dim); }
    .box .v { font-size:1.15rem; font-weight:900; font-variant-numeric:tabular-nums; color:var(--lime); }

    canvas { width:100%; max-width:520px; aspect-ratio:1; background:#111827; border-radius:14px;
        border:1px solid var(--stroke); display:block; box-shadow:0 18px 50px rgba(0,0,0,0.55); image-rendering:pixelated; }

    .bar { width:100%; max-width:520px; display:flex; gap:8px; }
    .btn { flex:1; padding:11px; border-radius:12px; border:1px solid var(--stroke); cursor:pointer;
        background:var(--panel); color:var(--text); font-family:inherit; font-size:0.88rem; font-weight:700; letter-spacing:1px; }
    .btn:hover { background:rgba(255,255,255,0.12); }
    .btn.primary { background:linear-gradient(90deg,var(--lime),#35e0ff); color:#062012; border:none; }

    .dpad { width:100%; max-width:520px; display:none; grid-template-columns:repeat(3,1fr); gap:8px; }
    .dpad .btn { padding:14px; font-size:1.2rem; }
    @media (pointer:coarse) { .dpad { display:grid; } }

    .tip { font-size:0.72rem; color:var(--dim); letter-spacing:1px; text-align:center; }
    .tip b { color:var(--lime); }
</style>
</head>
<body>
<div id="wrap">
    <div class="head">
        <div class="title">
            <h1>像素吞噬者</h1>
            <p>贪吃蛇 · 越吃越长</p>
        </div>
        <div class="scores">
            <div class="box"><div class="k">得分</div><div class="v" id="score">0</div></div>
            <div class="box"><div class="k">最高</div><div class="v" id="best">0</div></div>
            <div class="box"><div class="k">长度</div><div class="v" id="len">3</div></div>
        </div>
    </div>

    <canvas id="cv" width="480" height="480"></canvas>

    <div class="dpad">
        <div></div><button class="btn" data-dir="up">▲</button><div></div>
        <button class="btn" data-dir="left">◀</button><button class="btn primary" id="dpad-new">开始</button><button class="btn" data-dir="right">▶</button>
        <div></div><button class="btn" data-dir="down">▼</button><div></div>
    </div>

    <div class="bar">
        <button class="btn" id="pause-btn">⏸ 暂停</button>
        <button class="btn primary" id="new-btn">新游戏</button>
    </div>

    <p class="tip">方向键 / WASD 控制 · 吃食物变长 · 别<b>咬到自己</b></p>
</div>

<script>
'use strict';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const N = 20;                 // 网格数
const CELL = cv.width / N;
const SPEEDS = [180, 160, 140, 120, 105, 92, 80, 70, 62, 55];  // 每秒格数（毫秒/步）

let snake, dir, nextDir, food, score, best, running, paused, over, stepTimer, stepDelay, foodPulse;

best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0;

function init() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    running = true; paused = false; over = false;
    stepDelay = SPEEDS[0];
    stepTimer = 0;
    placeFood();
    updateHUD();
}

function placeFood() {
    let x, y, tries = 0;
    do {
        x = Math.floor(Math.random() * N);
        y = Math.floor(Math.random() * N);
        tries++;
    } while (tries < 200 && snake.some(s => s.x === x && s.y === y));
    food = { x, y };
    foodPulse = 0;
}

function update(dt) {
    if (!running || paused || over) return;

    stepTimer += dt * 1000;
    if (stepTimer >= stepDelay) {
        stepTimer -= stepDelay;
        step();
    }
    foodPulse += dt;
}

function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    /* 撞墙 */
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) {
        gameOver();
        return;
    }
    /* 撞自己 */
    if (snake.some((s, i) => i > 0 && s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 10;
        tone(880, 0.06, 0.07);
        setTimeout(() => tone(1320, 0.08, 0.06), 55);
        placeFood();
        /* 每 50 分加速 */
        const idx = Math.min(SPEEDS.length - 1, Math.floor(score / 50));
        stepDelay = SPEEDS[idx];
    } else {
        snake.pop();
    }
    updateHUD();
}

function gameOver() {
    over = true;
    tone(200, 0.3, 0.1);
    if (score > best) { best = score; localStorage.setItem('snake_best', String(best)); }
    updateHUD();
}

function updateHUD() {
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
    document.getElementById('len').textContent = snake.length;
}

function render() {
    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, cv.width, cv.height);

    /* 网格 */
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= N; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, cv.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(cv.width, i * CELL); ctx.stroke();
    }

    /* 食物（呼吸光） */
    const pulse = 1 + Math.sin(foodPulse * 6) * 0.14;
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    ctx.save();
    ctx.shadowColor = '#ff4d9d'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#ff4d9d';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.33 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    /* 蛇 */
    for (let i = snake.length - 1; i >= 0; i--) {
        const s = snake[i];
        const t = i / Math.max(1, snake.length - 1);
        ctx.fillStyle = i === 0 ? '#d6ff8f' : `hsl(${100 - t * 40}, 90%, ${60 - t * 18}%)`;
        const pad = i === 0 ? 1 : 2.5;
        ctx.beginPath();
        ctx.roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
        ctx.fill();
        if (i === 0) {
            ctx.shadowColor = '#7dff5c'; ctx.shadowBlur = 14;
            ctx.fill();
            ctx.shadowBlur = 0;
            /* 眼睛 */
            ctx.fillStyle = '#0b0f18';
            const ex = dir.x * 4, ey = dir.y * 4;
            ctx.beginPath(); ctx.arc(s.x * CELL + CELL / 2 + ex - 3, s.y * CELL + CELL / 2 + ey - 3, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(s.x * CELL + CELL / 2 + ex + 3, s.y * CELL + CELL / 2 + ey + 3, 2, 0, Math.PI * 2); ctx.fill();
        }
    }

    if (paused) {
        ctx.fillStyle = 'rgba(8,12,20,0.75)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#7dff5c';
        ctx.font = 'bold 38px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('已 暂 停', cv.width / 2, cv.height / 2);
    }
    if (over) {
        ctx.fillStyle = 'rgba(8,12,20,0.78)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('游戏结束', cv.width / 2, cv.height / 2 - 16);
        ctx.fillStyle = '#7dff5c';
        ctx.font = 'bold 20px "Noto Sans SC", sans-serif';
        ctx.fillText('得分 ' + score + ' · 长度 ' + snake.length, cv.width / 2, cv.height / 2 + 22);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '15px "Noto Sans SC", sans-serif';
        ctx.fillText('点击「新游戏」再来一次', cv.width / 2, cv.height / 2 + 54);
    }
}

/* ---------------- 音效 ---------------- */
let actx = null;
function tone(freq, dur, vol) {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
}

/* ---------------- 输入 ---------------- */
function setDir(dx, dy) {
    if (dx === -dir.x && dy === -dir.y) return;   // 不能直接反向
    if (dx === dir.x && dy === dir.y) return;
    nextDir = { x: dx, y: dy };
}

window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') { setDir(0, -1); e.preventDefault(); }
    else if (k === 'arrowdown' || k === 's') { setDir(0, 1); e.preventDefault(); }
    else if (k === 'arrowleft' || k === 'a') { setDir(-1, 0); e.preventDefault(); }
    else if (k === 'arrowright' || k === 'd') { setDir(1, 0); e.preventDefault(); }
    else if (k === 'p') togglePause();
});

document.querySelectorAll('.dpad .btn[data-dir]').forEach(b => {
    const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    b.addEventListener('click', () => {
        const [dx, dy] = map[b.dataset.dir];
        setDir(dx, dy);
        if (over) init();
    });
});

function togglePause() {
    if (over) return;
    paused = !paused;
    document.getElementById('pause-btn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
}

document.getElementById('new-btn').addEventListener('click', init);
document.getElementById('dpad-new').addEventListener('click', init);
document.getElementById('pause-btn').addEventListener('click', togglePause);
cv.addEventListener('click', () => { if (over) init(); });

/* 触屏滑动 */
let ts = null;
cv.addEventListener('touchstart', (e) => { ts = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY }; }, { passive: true });
cv.addEventListener('touchend', (e) => {
    if (!ts) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - ts.x, dy = t.clientY - ts.y;
    ts = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
}, { passive: true });

/* ---------------- 主循环 ---------------- */
let last = 0;
function loop(ts) {
    if (!last) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
</script>
</body>
</html>
