<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>彩虹岛冒险 · 横版平台</title>
<style>
    :root {
        --bg: #0d1524;
        --panel: rgba(255,255,255,0.06);
        --stroke: rgba(255,255,255,0.12);
        --text: #fff;
        --dim: rgba(255,255,255,0.55);
        --gold: #ffcc00;
        --green: #46e08a;
    }
    * { box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
        font-family:'Noto Sans SC', -apple-system, "Segoe UI", sans-serif; }
    #wrap { position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:10px; padding:12px; }

    .head { width:100%; max-width:760px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .title h1 { font-size:1.4rem; font-weight:900; letter-spacing:2px;
        background:linear-gradient(90deg,#ff9a3c,#ffcc00,#46e08a); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .title p { font-size:0.7rem; color:var(--dim); margin-top:2px; }
    .scores { display:flex; gap:7px; flex-wrap:wrap; }
    .box { background:var(--panel); border:1px solid var(--stroke); border-radius:11px; padding:5px 12px; text-align:center; min-width:60px; }
    .box .k { font-size:0.6rem; color:var(--dim); }
    .box .v { font-size:1.05rem; font-weight:900; font-variant-numeric:tabular-nums; }

    canvas { width:100%; max-width:760px; aspect-ratio:16/10; background:#8fd3f4; border-radius:12px;
        border:1px solid var(--stroke); display:block; box-shadow:0 16px 44px rgba(0,0,0,0.5); }

    .bar { width:100%; max-width:760px; display:flex; gap:8px; }
    .btn { flex:1; padding:10px; border-radius:11px; border:1px solid var(--stroke); cursor:pointer;
        background:var(--panel); color:var(--text); font-family:inherit; font-size:0.85rem; font-weight:700; letter-spacing:1px; }
    .btn:hover { background:rgba(255,255,255,0.12); }
    .btn.primary { background:linear-gradient(90deg,#ffcc00,#ff9a3c); color:#2a1a00; border:none; }

    .tip { font-size:0.7rem; color:var(--dim); letter-spacing:1px; text-align:center; }
    .tip b { color:var(--gold); }

    /* 触屏按钮 */
    .touch { width:100%; max-width:760px; display:none; gap:8px; }
    .touch .tb { flex:1; padding:14px 0; border-radius:12px; border:1px solid var(--stroke);
        background:var(--panel); color:var(--text); font-size:1rem; font-weight:800; text-align:center; }
    .touch .tb:active { background:rgba(255,255,255,0.2); }
    @media (pointer: coarse) { .touch { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
    <div class="head">
        <div class="title">
            <h1>彩虹岛冒险</h1>
            <p>横版卷轴 · 跑跳收集 · 打怪物</p>
        </div>
        <div class="scores">
            <div class="box"><div class="k">金币</div><div class="v" id="coin">0</div></div>
            <div class="box"><div class="k">分数</div><div class="v" id="score">0</div></div>
            <div class="box"><div class="k">生命</div><div class="v" id="lives">♥♥♥</div></div>
            <div class="box"><div class="k">关卡</div><div class="v" id="level">1</div></div>
            <div class="box"><div class="k">道具</div><div class="v" id="power">—</div></div>
        </div>
    </div>

    <canvas id="cv" width="760" height="475"></canvas>

    <div class="touch">
        <div class="tb" data-key="left">◀</div>
        <div class="tb" data-key="jump">跳</div>
        <div class="tb" data-key="shoot">射</div>
        <div class="tb" data-key="down">▼</div>
        <div class="tb" data-key="right">▶</div>
    </div>

    <div class="bar">
        <button class="btn" id="pause-btn">⏸ 暂停</button>
        <button class="btn primary" id="new-btn">重新开始</button>
    </div>

    <p class="tip"><b>← →</b> 移动 · <b>空格 / W</b> 跳跃（二段跳）· <b>↓</b> 蹲下 · <b>X</b> 射击（需⭐）· 踩扁怪物 · 触碰 🏁 过关</p>
</div>
<script>
'use strict';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND_Y = H - 70;
const LEVEL_TIME = 120;

/* ===================== 关卡数据 ===================== */
const LEVELS = [
    {
        name: '晨光草原',
        plats: [
            { x: 0, w: 300, h: 70 }, { x: 380, w: 160, h: 70 }, { x: 620, w: 130, h: 110 },
            { x: 830, w: 200, h: 70 }, { x: 1120, w: 140, h: 130 }, { x: 1350, w: 240, h: 70 },
            { x: 1680, w: 120, h: 100 }, { x: 1880, w: 520, h: 70 }
        ],
        movers: [
            { x: 520, y: GROUND_Y - 190, w: 92, h: 18, range: 130, speed: 1.5, phase: 0 },
            { x: 1560, y: GROUND_Y - 190, w: 92, h: 18, range: 150, speed: 1.2, phase: 1.6 }
        ],
        spikes: [{ x: 420, y: GROUND_Y - 70, w: 40 }, { x: 650, y: GROUND_Y - 110, w: 40 }, { x: 1380, y: GROUND_Y - 70, w: 50 }, { x: 1700, y: GROUND_Y - 100, w: 40 }],
        hearts: [{ x: 1180, y: GROUND_Y - 180 }],
        stars: [{ x: 660, y: GROUND_Y - 160 }, { x: 1400, y: GROUND_Y - 120 }]
    },
    {
        name: '峡谷飞跃',
        plats: [
            { x: 0, w: 220, h: 70 }, { x: 300, w: 120, h: 120 }, { x: 520, w: 180, h: 70 },
            { x: 780, w: 120, h: 90 }, { x: 980, w: 160, h: 140 }, { x: 1230, w: 200, h: 70 },
            { x: 1500, w: 120, h: 110 }, { x: 1720, w: 400, h: 70 }, { x: 2200, w: 720, h: 70 }
        ],
        movers: [
            { x: 440, y: GROUND_Y - 220, w: 88, h: 18, range: 120, speed: 1.8, phase: 0.4 },
            { x: 700, y: GROUND_Y - 250, w: 88, h: 18, range: 130, speed: 2.1, phase: 2.2 },
            { x: 1160, y: GROUND_Y - 230, w: 88, h: 18, range: 140, speed: 1.6, phase: 1.1 },
            { x: 2000, y: GROUND_Y - 210, w: 88, h: 18, range: 160, speed: 1.9, phase: 0.9 }
        ],
        spikes: [{ x: 230, y: GROUND_Y - 70, w: 40 }, { x: 830, y: GROUND_Y - 90, w: 40 }, { x: 1460, y: GROUND_Y - 70, w: 50 }, { x: 2160, y: GROUND_Y - 70, w: 40 }],
        hearts: [{ x: 1010, y: GROUND_Y - 190 }, { x: 2300, y: GROUND_Y - 110 }],
        stars: [{ x: 320, y: GROUND_Y - 170 }, { x: 1560, y: GROUND_Y - 160 }, { x: 2500, y: GROUND_Y - 120 }]
    },
    {
        name: '彩虹之巅',
        plats: [
            { x: 0, w: 260, h: 70 }, { x: 340, w: 140, h: 140 }, { x: 560, w: 140, h: 90 },
            { x: 800, w: 200, h: 70 }, { x: 1080, w: 120, h: 120 }, { x: 1300, w: 160, h: 70 },
            { x: 1540, w: 120, h: 150 }, { x: 1760, w: 180, h: 70 }, { x: 2050, w: 120, h: 100 },
            { x: 2270, w: 820, h: 70 }
        ],
        movers: [
            { x: 480, y: GROUND_Y - 240, w: 86, h: 18, range: 110, speed: 2.2, phase: 0.2 },
            { x: 700, y: GROUND_Y - 280, w: 86, h: 18, range: 120, speed: 2.4, phase: 1.4 },
            { x: 1000, y: GROUND_Y - 260, w: 86, h: 18, range: 100, speed: 2.0, phase: 2.8 },
            { x: 1440, y: GROUND_Y - 250, w: 86, h: 18, range: 130, speed: 2.6, phase: 0.8 },
            { x: 1940, y: GROUND_Y - 230, w: 86, h: 18, range: 140, speed: 2.1, phase: 2.0 },
            { x: 2180, y: GROUND_Y - 200, w: 86, h: 18, range: 120, speed: 1.7, phase: 1.0 }
        ],
        spikes: [{ x: 280, y: GROUND_Y - 70, w: 40 }, { x: 600, y: GROUND_Y - 90, w: 40 }, { x: 1320, y: GROUND_Y - 70, w: 40 }, { x: 1990, y: GROUND_Y - 70, w: 40 }],
        hearts: [{ x: 360, y: GROUND_Y - 190 }, { x: 1560, y: GROUND_Y - 200 }, { x: 2900, y: GROUND_Y - 110 }],
        stars: [{ x: 585, y: GROUND_Y - 140 }, { x: 1100, y: GROUND_Y - 170 }, { x: 1780, y: GROUND_Y - 120 }, { x: 2400, y: GROUND_Y - 150 }]
    }
];

/* ===================== 全局状态 ===================== */
let platforms, coins, enemies, items, darts, particles, player, camX;
let score, coinCount, lives, level, gameState, flag, hurtTimer, invuln, jumpBuffer;
let timeLeft, shake, combo, comboT, checkpoint, stageBanner, stageBannerT, running, paused;
let best = parseInt(localStorage.getItem('island_best') || '0', 10) || 0;

/* ===================== 载入关卡 ===================== */
function loadLevel(idx) {
    level = idx;
    const L = LEVELS[idx % LEVELS.length];
    platforms = L.plats.map(p => ({ x: p.x, y: GROUND_Y - p.h, w: p.w, h: p.h }));
    platforms.movers = L.movers.map(m => ({
        baseX: m.x, baseY: m.y, x: m.x, y: m.y, w: m.w, h: m.h,
        range: m.range, speed: m.speed, phase: m.phase, dx: 0, dy: 0
    }));
    coins = []; enemies = []; items = []; darts = []; particles = [];

    /* 金币：平台上均匀铺开 */
    for (const p of platforms) {
        const n = Math.max(1, Math.floor(p.w / 90));
        for (let i = 0; i < n; i++) {
            coins.push({
                x: p.x + 40 + i * 88 + Math.random() * 20,
                y: p.y - 45,
                taken: false,
                bob: Math.random() * 6.28
            });
        }
    }

    /* 敌人生成（避开出生点） */
    const weights = ['slime', 'slime', 'walker', 'walker', 'flyer'];
    for (let pi = 1; pi < platforms.length; pi++) {
        const p = platforms[pi];
        if (p.w < 130) continue;
        const count = p.w > 240 ? 2 : 1;
        for (let i = 0; i < count; i++) {
            if (Math.random() < 0.5) continue;
            const type = weights[Math.floor(Math.random() * weights.length)];
            enemies.push(makeEnemy(type, p.x + 50 + Math.random() * Math.max(10, p.w - 120), p));
        }
    }
    /* 空中飞怪 */
    for (let i = 0; i < 2 + level; i++) {
        const p = platforms[1 + Math.floor(Math.random() * (platforms.length - 1))];
        const e = makeEnemy('flyer', p.x + 60 + Math.random() * Math.max(10, p.w - 100), p);
        e.y = p.y - 90 - Math.random() * 70;
        e.baseY = e.y;
        e.air = true;
        e.homeX = e.x;
        e.range = 70 + Math.random() * 50;
        enemies.push(e);
    }
    /* 固定尖刺怪 */
    for (let pi = 1; pi < platforms.length; pi++) {
        const p = platforms[pi];
        if (p.w < 160) continue;
        if (Math.random() < 0.35) {
            const e = makeEnemy('spike', p.x + p.w * (0.4 + Math.random() * 0.25), p);
            enemies.push(e);
        }
    }

    /* 道具 */
    spikes.length = 0;
    for (const s of L.spikes) spikes.push(s);
    for (const h of L.hearts) items.push({ x: h.x, y: h.y, kind: 'heart', t: Math.random() * 6, taken: false });
    for (const s of L.stars) items.push({ x: s.x, y: s.y, kind: 'star', t: Math.random() * 6, taken: false });

    /* 终点 */
    const last = platforms[platforms.length - 1];
    flag = { x: last.x + last.w - 80, y: last.y - 118, taken: false };

    player = {
        x: 80, y: platforms[0].y - 46, w: 30, h: 46,
        vx: 0, vy: 0,
        onGround: false,
        jumps: 0,
        maxJumps: 2,
        facing: 1,
        crouch: false,
        walk: 0,
        power: 0,          // 0 无 / 1 星星（可射击）
        shootCd: 0,
        coyote: 0
    };

    camX = 0;
    score = 0; coinCount = 0; lives = 3;
    gameState = 'play';
    hurtTimer = 0; invuln = 0; jumpBuffer = 0;
    timeLeft = LEVEL_TIME;
    shake = 0; combo = 0; comboT = 0;
    checkpoint = { x: 80, y: platforms[0].y - 46 };
    stageBanner = '第 ' + (idx + 1) + ' 关 · ' + L.name;
    stageBannerT = 2.4;
    document.getElementById('pause-btn').textContent = '⏸ 暂停';
    updateHUD();
}
let spikes = [];

function makeEnemy(type, x, p) {
    const base = {
        x, y: p.y - 28, vx: -60, vy: 0, w: 30, h: 28,
        hp: 1, alive: true, type, walk: Math.random() * 6.28, onGround: true,
        score: 30, air: false, baseY: p.y - 28, speed: 60, stompable: true,
        homeX: x, range: 90
    };
    if (type === 'slime') { base.speed = 46; base.score = 30; }
    if (type === 'walker') { base.speed = 78; base.score = 50; }
    if (type === 'spike') { base.speed = 0; base.vx = 0; base.hp = 1; base.score = 80; base.stompable = false; base.fixed = true; base.h = 30; base.w = 32; }
    if (type === 'flyer') { base.speed = 95; base.hp = 1; base.score = 60; base.air = true; base.w = 30; base.h = 26; }
    return base;
}

/* ===================== HUD ===================== */
function updateHUD() {
    document.getElementById('coin').textContent = coinCount;
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = '♥'.repeat(Math.max(0, lives)) || '—';
    document.getElementById('level').textContent = level + 1;
    document.getElementById('power').textContent = player && player.power ? '⭐' : '—';
}

/* ===================== 平台查询 ===================== */
function allPlatforms() {
    const list = platforms.slice();
    for (const m of platforms.movers) list.push(m);
    return list;
}
function platformUnder(x, y, w, h) {
    const list = allPlatforms();
    for (const p of list) {
        if (x + w > p.x && x < p.x + p.w) {
            const top = p.y;
            if (y + h >= top && y + h <= top + 26) return p;
        }
    }
    return null;
}

/* ===================== 主更新 ===================== */
function update(dt) {
    if (gameState !== 'play' || paused) return;

    const P = player;

    /* 移动平台 */
    for (const m of platforms.movers) {
        const ox = m.x, oy = m.y;
        const t = performance.now() * 0.001;
        m.x = m.baseX + Math.sin(t * m.speed + m.phase) * m.range;
        m.y = m.baseY + Math.sin(t * m.speed * 1.4 + m.phase) * 18;
        m.dx = m.x - ox; m.dy = m.y - oy;
    }

    /* 水平移动 */
    const accel = P.onGround ? 2400 : 1500;
    const maxSpd = P.crouch ? 135 : 280;
    if (keys.left) { P.vx -= accel * dt; P.facing = -1; }
    else if (keys.right) { P.vx += accel * dt; P.facing = 1; }
    else {
        const fr = P.onGround ? 2800 : 700;
        if (P.vx > 0) P.vx = Math.max(0, P.vx - fr * dt);
        else P.vx = Math.min(0, P.vx + fr * dt);
    }
    P.vx = Math.max(-maxSpd, Math.min(maxSpd, P.vx));
    P.crouch = keys.down && P.onGround;
    const bodyH = P.crouch ? 30 : 46;

    /* 跳跃（含 coyote time 与预输入） */
    if (P.onGround) P.coyote = 0.1; else P.coyote = Math.max(0, P.coyote - dt);
    jumpBuffer -= dt;
    if (keys.jumpJust) { jumpBuffer = 0.13; keys.jumpJust = false; }
    if (jumpBuffer > 0 && (P.onGround || P.coyote > 0) && P.jumps < P.maxJumps) {
        P.vy = -625; P.jumps = 1; P.onGround = false; P.coyote = 0; jumpBuffer = 0;
        tone(520, 0.08, 0.06);
        spawnDust(P.x + P.w / 2, P.y + bodyH, 5, '#ffffff');
    } else if (jumpBuffer > 0 && P.jumps < P.maxJumps) {
        P.vy = -545; P.jumps = 2; P.onGround = false; jumpBuffer = 0;
        tone(720, 0.08, 0.06);
        spawnParticles(P.x + P.w / 2, P.y + bodyH, '#bfe9ff', 8);
    }

    /* 重力 */
    P.vy += 1850 * dt;
    if (P.vy > 950) P.vy = 950;

    /* 水平位移 + 边界 */
    P.x += P.vx * dt;
    if (P.x < 0) { P.x = 0; P.vx = 0; }
    const maxX = flag.x + 40;
    if (P.x > maxX) { P.x = maxX; P.vx = 0; }

    /* 垂直位移 + 落地 */
    const prevBottom = P.y + bodyH;
    P.y += P.vy * dt;
    P.onGround = false;
    const newBottom = P.y + bodyH;
    for (const p of allPlatforms()) {
        if (P.x + P.w > p.x && P.x < p.x + p.w) {
            if (P.vy >= 0 && prevBottom <= p.y + 3 && newBottom >= p.y && newBottom <= p.y + 34) {
                if (!P.onGround) spawnDust(P.x + P.w / 2, p.y, 6, '#ffffff');
                P.y = p.y - bodyH;
                P.vy = 0;
                P.onGround = true;
                P.jumps = 0;
                if (p.dx) P.x += p.dx;
            }
        }
    }
    if (P.y > H - 6) hurtPlayer(true);

    /* 动画 & 跑步尘土 */
    if (Math.abs(P.vx) > 30) {
        P.walk += dt * 13;
        if (P.onGround && Math.random() < dt * 14) spawnDust(P.x + P.w / 2 - P.facing * 8, P.y + bodyH, 1, '#e8f6ff');
    }

    /* 相机 */
    const target = Math.max(0, P.x - W * 0.35);
    camX += (target - camX) * Math.min(1, 8 * dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 3.2);

    /* 金币 */
    for (const c of coins) {
        if (c.taken) continue;
        const cx = c.x - camX;
        if (cx < -40 || cx > W + 40) continue;
        const cy = c.y + Math.sin(performance.now() * 0.004 + c.bob) * 5;
        if (Math.abs(P.x + P.w / 2 - c.x) < 26 && Math.abs(P.y + bodyH / 2 - cy) < 32) {
            c.taken = true;
            coinCount++; score += 10;
            tone(1100, 0.06, 0.06);
            setTimeout(() => tone(1560, 0.08, 0.05), 45);
            spawnParticles(c.x, cy, '#ffcc00', 8);
            updateHUD();
        }
    }

    /* 道具 */
    for (const it of items) {
        if (it.taken) continue;
        it.t += dt;
        const ix = it.x - camX;
        if (ix < -40 || ix > W + 40) continue;
        const iy = it.y + Math.sin(it.t * 3) * 6;
        if (Math.abs(P.x + P.w / 2 - it.x) < 26 && Math.abs(P.y + bodyH / 2 - iy) < 30) {
            it.taken = true;
            if (it.kind === 'heart') {
                lives = Math.min(5, lives + 1);
                score += 50;
                spawnParticles(it.x, iy, '#ff6b9d', 16);
                tone(700, 0.1, 0.08); setTimeout(() => tone(1050, 0.12, 0.07), 90);
                stageBanner = '生命 +1'; stageBannerT = 1.4;
            } else {
                P.power = 1;
                score += 30;
                spawnParticles(it.x, iy, '#ffcc00', 18);
                tone(900, 0.1, 0.08); setTimeout(() => tone(1350, 0.12, 0.07), 90);
                stageBanner = '获得 ⭐ ！按 X 射击'; stageBannerT = 1.8;
            }
            updateHUD();
        }
    }

    /* 发射星星弹 */
    P.shootCd -= dt;
    if (keys.shootJust) {
        keys.shootJust = false;
        if (P.power > 0 && P.shootCd <= 0) {
            P.shootCd = 0.26;
            darts.push({
                x: P.x + P.w / 2 + P.facing * 14,
                y: P.y + bodyH / 2 - 4,
                vx: P.facing * 640, vy: 0, life: 1.4
            });
            tone(1250, 0.04, 0.05);
        }
    }

    /* 星星弹飞行 & 命中 */
    for (let i = darts.length - 1; i >= 0; i--) {
        const d = darts[i];
        d.x += d.vx * dt; d.life -= dt;
        let hit = false;
        for (const e of enemies) {
            if (!e.alive) continue;
            if (Math.abs(d.x - (e.x + e.w / 2)) < e.w / 2 + 6 && Math.abs(d.y - (e.y + e.h / 2)) < e.h / 2 + 6) {
                e.alive = false;
                score += e.score;
                combo++; comboT = 1.2;
                spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#ffcc00', 14);
                tone(320, 0.08, 0.07);
                shake = Math.max(shake, 0.18);
                updateHUD();
                hit = true; break;
            }
        }
        if (hit || d.life <= 0) darts.splice(i, 1);
    }

    /* 敌人 */
    for (const e of enemies) {
        if (!e.alive) continue;
        const ex = e.x - camX;
        if (ex < -160 || ex > W + 160) continue;

        e.walk += dt * 6;

        if (e.air) {
            e.x += (e.vx > 0 ? 1 : -1) * e.speed * dt;
            e.y = e.baseY + Math.sin(e.walk * 0.9) * 22;
            /* 在自身活动范围内来回飞，不会飘到玩家脸上 */
            if (e.x < e.homeX - e.range) { e.vx = Math.abs(e.vx); e.x = e.homeX - e.range; }
            if (e.x > e.homeX + e.range) { e.vx = -Math.abs(e.vx); e.x = e.homeX + e.range; }
        } else if (e.fixed) {
            /* 固定不动的尖刺怪 */
            e.vy += 1750 * dt;
            e.y += e.vy * dt;
            const p = platformUnder(e.x, e.y, e.w, e.h);
            if (p && e.y + e.h > p.y) { e.y = p.y - e.h; e.vy = 0; }
        } else {
            /* 巡逻：走到平台边缘就转向 */
            e.vy += 1750 * dt;
            e.x += e.vx * dt;
            e.y += e.vy * dt;

            const p = platformUnder(e.x, e.y, e.w, e.h);
            if (p) {
                if (e.y + e.h > p.y) { e.y = p.y - e.h; e.vy = 0; }
                const atEdge = (e.x < p.x + 6) || (e.x + e.w > p.x + p.w - 6);
                if (atEdge) e.vx = -e.vx;
                /* 巡逻中的 walker 偶尔起跳 */
                if (e.type === 'walker' && Math.random() < dt * 0.7) { e.vy = -430; e.onGround = false; }
            } else {
                /* 掉出平台边缘：转向并补上速度 */
                if (e.vx === 0) e.vx = -e.speed;
            }
            if (e.y > H + 50) { e.alive = false; continue; }
        }

        /* 碰撞 */
        if (P.x + P.w > e.x + 4 && P.x < e.x + e.w - 4 &&
            P.y + bodyH > e.y + 4 && P.y < e.y + e.h - 4) {
            const stomping = e.stompable && P.vy > 60 && P.y + bodyH < e.y + e.h * 0.72;
            if (stomping) {
                e.alive = false;
                score += e.score;
                combo++; comboT = 1.2;
                P.vy = -450; P.jumps = 1;
                spawnParticles(e.x + e.w / 2, e.y + e.h / 2, e.type === 'spike' ? '#ff9a3c' : '#ff6b9d', 14);
                tone(240, 0.09, 0.08);
                shake = Math.max(shake, 0.15);
                updateHUD();
            } else if (invuln <= 0) {
                hurtPlayer(false);
            }
        }
    }

    /* 尖刺 */
    for (const s of spikes) {
        if (P.x + P.w > s.x + 3 && P.x < s.x + s.w - 3 &&
            P.y + bodyH > s.y - 16 && P.y < s.y + 6) {
            if (invuln <= 0) hurtPlayer(false);
        }
    }

    /* 检查点：放在安全的平台中点上 */
    if (!checkpoint.taken && P.x > 260 + level * 100) {
        let cp = null;
        for (const p of platforms) {
            if (p.x + 30 < P.x && P.x < p.x + p.w - 30 && p.w > 120) { cp = p; break; }
        }
        if (cp) {
            checkpoint.taken = true;
            checkpoint.x = cp.x + cp.w / 2 - 15;
            checkpoint.y = cp.y - 46;
            stageBanner = '✔ 检查点'; stageBannerT = 1.6;
            spawnParticles(P.x, P.y, '#46e08a', 12);
        }
    }

    /* 终点旗杆 */
    if (!flag.taken && P.x + P.w > flag.x) {
        flag.taken = true;
        score += 300 + lives * 60 + combo * 20;
        combo = 0;
        gameState = 'win';
        if (score > best) { best = score; localStorage.setItem('island_best', String(best)); }
        showBanner('过 关 啦！', '得分 ' + score + (level + 1 < LEVELS.length ? ' · 按 空格 进入下一关' : ' · 通关！按 空格 重新开始'));
        updateHUD();
    }

    /* 计时 */
    timeLeft -= dt;
    if (timeLeft <= 0) {
        gameState = 'lose';
        if (score > best) { best = score; localStorage.setItem('island_best', String(best)); }
        showBanner('时 间 到！', '你没能到达终点。下次跑快一点！');
    }

    if (invuln > 0) invuln -= dt;
    if (hurtTimer > 0) hurtTimer -= dt;
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    if (stageBannerT > 0) stageBannerT -= dt;

    updateParticles(dt);
}

function hurtPlayer(fell) {
    if (invuln > 0 && !fell) return;
    lives--;
    invuln = 1.8;
    hurtTimer = 0.35;
    score = Math.max(0, score - 40);
    combo = 0;
    shake = 0.4;
    tone(140, 0.2, 0.1);
    if (fell) {
        /* 回到最近踩过的安全平台，而不是每次都回原点 */
        let safe = null;
        for (const p of platforms) {
            if (p.x + 40 < player.x && p.x + p.w > player.x) { safe = p; break; }
        }
        if (!safe && checkpoint.taken) {
            player.x = checkpoint.x; player.y = checkpoint.y;
        } else if (safe) {
            player.x = Math.max(safe.x + 10, Math.min(safe.x + safe.w - player.w - 10, player.x));
            player.y = safe.y - 46;
        } else {
            player.x = 80; player.y = platforms[0].y - 46;
        }
        player.vx = 0; player.vy = 0;
        camX = Math.max(0, player.x - W * 0.35);
    } else {
        player.vy = -320;
        player.vx = -player.facing * 240;
    }
    if (lives <= 0) {
        gameState = 'lose';
        if (score > best) { best = score; localStorage.setItem('island_best', String(best)); }
        showBanner('游 戏 结 束', '最终得分 ' + score + ' · 最高 ' + best);
    }
    updateHUD();
}

/* ===================== 粒子 ===================== */
function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 60 + Math.random() * 220;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 0.45 + Math.random() * 0.35, color, size: 2 + Math.random() * 3 });
    }
}
function spawnDust(x, y, n, color) {
    for (let i = 0; i < n; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 16, y,
            vx: (Math.random() - 0.5) * 90, vy: -Math.random() * 70,
            life: 0.3 + Math.random() * 0.25, color: color, size: 2 + Math.random() * 3
        });
    }
}
function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 700 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

/* ===================== 渲染 ===================== */
function render() {
    const sx = shake > 0 ? (Math.random() - 0.5) * shake * 14 : 0;
    const sy = shake > 0 ? (Math.random() - 0.5) * shake * 14 : 0;
    ctx.save();
    ctx.translate(sx, sy);

    /* 天空 */
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#4aa9e8');
    sky.addColorStop(0.5, '#8fd3f4');
    sky.addColorStop(1, '#d4f0dc');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    /* 彩虹 */
    const rc = ['rgba(255,80,80,0.16)', 'rgba(255,180,60,0.16)', 'rgba(255,230,80,0.16)', 'rgba(110,220,120,0.16)', 'rgba(90,170,255,0.16)', 'rgba(180,110,255,0.16)'];
    rc.forEach((col, i) => {
        ctx.strokeStyle = col;
        ctx.lineWidth = 16;
        ctx.beginPath();
        ctx.arc(W * 0.72 - (camX * 0.05) % 400 - 120, H + 130, 250 - i * 16, Math.PI, Math.PI * 2);
        ctx.stroke();
    });

    /* 远山 */
    ctx.fillStyle = 'rgba(70,150,110,0.3)';
    for (let i = 0; i < 12; i++) {
        const bx = i * 260 - (camX * 0.22) % 260;
        ctx.beginPath();
        ctx.moveTo(bx - 140, GROUND_Y);
        ctx.quadraticCurveTo(bx, GROUND_Y - 190, bx + 140, GROUND_Y);
        ctx.fill();
    }
    /* 中景树 */
    ctx.fillStyle = 'rgba(50,140,90,0.45)';
    for (let i = 0; i < 16; i++) {
        const bx = i * 170 - (camX * 0.5) % 170;
        ctx.fillRect(bx + 30, GROUND_Y - 80, 14, 80);
        ctx.beginPath();
        ctx.arc(bx + 37, GROUND_Y - 92, 34, 0, Math.PI * 2);
        ctx.fill();
    }
    /* 云 */
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 9; i++) {
        const bx = ((i * 230 - camX * 0.13) % (W + 300)) - 150;
        const by = 46 + (i % 3) * 44;
        ctx.beginPath();
        ctx.arc(bx, by, 24, 0, Math.PI * 2);
        ctx.arc(bx + 24, by + 6, 18, 0, Math.PI * 2);
        ctx.arc(bx - 24, by + 6, 16, 0, Math.PI * 2);
        ctx.fill();
    }

    /* 平台 */
    for (const p of platforms) {
        const px = p.x - camX;
        if (px > W + 60 || px < -p.w - 60) continue;
        ctx.fillStyle = '#4fc35a';
        ctx.beginPath(); ctx.roundRect(px, p.y, p.w, p.h, 6); ctx.fill();
        ctx.fillStyle = '#3aa845';
        ctx.beginPath(); ctx.roundRect(px, p.y + 16, p.w, p.h - 16, 6); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        for (let i = 0; i < p.w; i += 34) ctx.fillRect(px + i + 6, p.y + 24, 10, 8);
        /* 草地边 */
        ctx.fillStyle = '#7ee08a';
        for (let i = 0; i < p.w; i += 14) {
            const bh = 4 + (i % 3) * 2;
            ctx.fillRect(px + i, p.y - bh, 3, bh);
        }
    }
    /* 移动平台 */
    for (const m of platforms.movers) {
        const px = m.x - camX;
        if (px > W + 80 || px < -m.w - 80) continue;
        ctx.fillStyle = '#c98a3c';
        ctx.beginPath(); ctx.roundRect(px, m.y, m.w, m.h, 6); ctx.fill();
        ctx.fillStyle = '#a86f28';
        ctx.fillRect(px + 4, m.y + m.h - 5, m.w - 8, 4);
        ctx.fillStyle = '#ffdca8';
        ctx.beginPath(); ctx.roundRect(px, m.y, m.w, 5, 3); ctx.fill();
    }

    /* 尖刺 */
    for (const s of spikes) {
        const px = s.x - camX;
        if (px > W + 60 || px < -s.w - 60) continue;
        ctx.fillStyle = '#8e97a8';
        const n = Math.max(2, Math.round(s.w / 18));
        for (let i = 0; i < n; i++) {
            const sx2 = px + i * (s.w / n);
            ctx.beginPath();
            ctx.moveTo(sx2, s.y + 4);
            ctx.lineTo(sx2 + s.w / n / 2, s.y - 16);
            ctx.lineTo(sx2 + s.w / n, s.y + 4);
            ctx.closePath();
            ctx.fill();
        }
    }

    /* 金币 */
    for (const c of coins) {
        if (c.taken) continue;
        const cx = c.x - camX;
        if (cx < -40 || cx > W + 40) continue;
        const cy = c.y + Math.sin(performance.now() * 0.004 + c.bob) * 5;
        ctx.save();
        ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 10;
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath(); ctx.ellipse(cx, cy, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.ellipse(cx - 2, cy - 3, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
    }

    /* 道具 */
    for (const it of items) {
        if (it.taken) continue;
        const ix = it.x - camX;
        if (ix < -40 || ix > W + 40) continue;
        const iy = it.y + Math.sin(it.t * 3) * 6;
        ctx.save();
        ctx.translate(ix, iy);
        ctx.rotate(it.t * 1.6);
        if (it.kind === 'heart') {
            ctx.fillStyle = '#ff5c8a';
            ctx.beginPath();
            ctx.arc(-7, -4, 8, Math.PI, 0);
            ctx.arc(7, -4, 8, Math.PI, 0);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-14, -2); ctx.lineTo(14, -2); ctx.lineTo(0, 15);
            ctx.closePath(); ctx.fill();
        } else {
            ctx.fillStyle = '#ffcc00';
            ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 14;
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
                const r = i % 2 === 0 ? 13 : 6;
                const a = -Math.PI / 2 + i * Math.PI / 5;
                const fn = i === 0 ? 'moveTo' : 'lineTo';
                ctx[fn](Math.cos(a) * r, Math.sin(a) * r);
            }
            ctx.closePath(); ctx.fill();
        }
        ctx.restore();
    }

    /* 终点旗杆 */
    {
        const fx = flag.x - camX;
        if (fx > -60 && fx < W + 60) {
            ctx.fillStyle = '#dfe6ef';
            ctx.fillRect(fx, flag.y, 6, GROUND_Y - flag.y);
            ctx.fillStyle = flag.taken ? '#8be36b' : '#ff5c5c';
            ctx.beginPath();
            ctx.moveTo(fx + 6, flag.y + 4);
            ctx.lineTo(fx + 46, flag.y + 18);
            ctx.lineTo(fx + 6, flag.y + 32);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px "Noto Sans SC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('终点', fx + 20, flag.y - 10);
        }
    }

    /* 敌人 */
    for (const e of enemies) {
        if (!e.alive) continue;
        const ex = e.x - camX;
        if (ex < -60 || ex > W + 60) continue;
        if (e.type === 'slime') {
            const sq = 1 + Math.sin(e.walk) * 0.12;
            ctx.fillStyle = '#ff6b9d';
            ctx.beginPath();
            ctx.ellipse(ex + e.w / 2, e.y + e.h, e.w / 2, e.h / 2 * sq, 0, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(ex, e.y + e.h - 4, e.w, 4);
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(ex + 9, e.y + 12, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex + 21, e.y + 12, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(ex + 10, e.y + 12, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex + 22, e.y + 12, 2.5, 0, Math.PI * 2); ctx.fill();
        } else if (e.type === 'walker') {
            ctx.fillStyle = '#7a4bd6';
            ctx.beginPath(); ctx.roundRect(ex, e.y + 6, e.w, e.h - 6, 6); ctx.fill();
            ctx.fillStyle = '#a97cff';
            ctx.beginPath(); ctx.roundRect(ex + 4, e.y, e.w - 8, 12, 4); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(ex + 10, e.y + 6, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex + 20, e.y + 6, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(ex + 10, e.y + 6, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex + 20, e.y + 6, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#5a35a0';
            const lg = Math.sin(e.walk) * 4;
            ctx.fillRect(ex + 3, e.y + e.h - 5 + lg, 7, 6);
            ctx.fillRect(ex + e.w - 10, e.y + e.h - 5 - lg, 7, 6);
        } else if (e.type === 'spike') {
            ctx.fillStyle = '#c8402e';
            ctx.beginPath(); ctx.roundRect(ex, e.y + 8, e.w, e.h - 8, 5); ctx.fill();
            ctx.fillStyle = '#7a2418';
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const sx2 = ex + 4 + i * 7;
                ctx.moveTo(sx2, e.y + 10); ctx.lineTo(sx2 + 3.5, e.y - 2); ctx.lineTo(sx2 + 7, e.y + 10);
                ctx.closePath();
            }
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(ex + 11, e.y + 18, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex + 21, e.y + 18, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(ex + 11, e.y + 18, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex + 21, e.y + 18, 2, 0, Math.PI * 2); ctx.fill();
        } else {
            /* 飞怪 */
            const flap = Math.sin(e.walk * 2.2);
            ctx.fillStyle = '#ff9a3c';
            ctx.beginPath();
            ctx.ellipse(ex + e.w / 2, e.y + e.h / 2, e.w / 2, e.h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,220,160,0.9)';
            ctx.beginPath();
            ctx.ellipse(ex + 4, e.y + e.h / 2 - flap * 6, 11, 6, -0.4 + flap * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(ex + e.w - 4, e.y + e.h / 2 - flap * 6, 11, 6, 0.4 - flap * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(ex + 10, e.y + 10, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex + 20, e.y + 10, 2, 0, Math.PI * 2); ctx.fill();
        }
    }

    /* 星星弹 */
    for (const d of darts) {
        ctx.save();
        ctx.translate(d.x - camX, d.y);
        ctx.rotate(performance.now() * 0.02);
        ctx.fillStyle = '#ffcc00';
        ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 12;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const r = i % 2 === 0 ? 8 : 3.5;
            const a = -Math.PI / 2 + i * Math.PI / 5;
            const fn = i === 0 ? 'moveTo' : 'lineTo';
            ctx[fn](Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
    }

    /* 玩家 */
    {
        const P = player;
        const px = P.x - camX;
        const py = P.y;
        const ph = P.crouch ? 30 : P.h;
        const pyy = P.y + (P.h - ph);

        if (!(invuln > 0 && Math.floor(invuln * 14) % 2 === 0)) {
            ctx.save();
            ctx.translate(px + P.w / 2, pyy);
            ctx.scale(P.facing, 1);

            ctx.fillStyle = hurtTimer > 0 ? '#ff8a8a' : '#3d7ef5';
            ctx.beginPath(); ctx.roundRect(-P.w / 2, 4, P.w, ph - 4, 8); ctx.fill();
            ctx.fillStyle = hurtTimer > 0 ? '#ffd0d0' : '#ffd9b3';
            ctx.beginPath(); ctx.arc(0, 2, 13, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#e84a27';
            ctx.beginPath(); ctx.arc(0, 0, 13, Math.PI, 0); ctx.fill();
            ctx.fillRect(-13, -1, 26, 4);
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(4, 4, 2.2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffd9b3';
            ctx.beginPath(); ctx.arc(-4, 16, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, 16, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#2a4b9e';
            if (P.onGround && Math.abs(P.vx) > 30) {
                const lg = Math.sin(P.walk) * 7;
                ctx.fillRect(-9, ph - 2 + lg, 7, 10);
                ctx.fillRect(2, ph - 2 - lg, 7, 10);
            } else {
                ctx.fillRect(-9, ph - 8, 7, 10);
                ctx.fillRect(2, ph - 8, 7, 10);
            }
            ctx.restore();
        }
    }

    /* 粒子 */
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x - camX, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* 时间条 */
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 0, W * Math.max(0, timeLeft / LEVEL_TIME), 5);
    ctx.fillStyle = timeLeft < 20 ? '#ff5c5c' : '#ffcc00';
    ctx.fillRect(0, 0, W * Math.max(0, timeLeft / LEVEL_TIME), 5);

    /* 连击 */
    if (combo > 1) {
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 20px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'right'; ctx.textBaseline = 'top';
        ctx.fillText('连击 x' + combo, W - 16, 14);
    }

    /* 关卡横幅 */
    if (stageBannerT > 0) {
        ctx.fillStyle = 'rgba(10,16,28,' + Math.min(0.75, stageBannerT) + ')';
        ctx.fillRect(0, H / 2 - 30, W, 54);
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 28px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(stageBanner, W / 2, H / 2 - 3);
    }

    ctx.restore();

    /* 结束横幅 */
    if (gameState !== 'play') {
        ctx.fillStyle = 'rgba(10,16,28,0.74)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 42px "Noto Sans SC", sans-serif';
        ctx.fillText(bannerTitle, W / 2, H / 2 - 26);
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 19px "Noto Sans SC", sans-serif';
        ctx.fillText(bannerDesc, W / 2, H / 2 + 18);
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.font = '15px "Noto Sans SC", sans-serif';
        ctx.fillText('按 空格 / 点击继续', W / 2, H / 2 + 54);
    }

    if (paused) {
        ctx.fillStyle = 'rgba(10,16,28,0.66)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('已 暂 停', W / 2, H / 2);
    }
}

let bannerTitle = '', bannerDesc = '';
function showBanner(t, d) { bannerTitle = t; bannerDesc = d; }

/* ===================== 音效 ===================== */
let actx = null;
function tone(freq, dur, vol, type) {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
}

/* ===================== 输入 ===================== */
const keys = { left: false, right: false, down: false, jumpJust: false, shootJust: false };
window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') { keys.left = true; e.preventDefault(); }
    if (k === 'arrowright' || k === 'd') { keys.right = true; e.preventDefault(); }
    if (k === 'arrowdown' || k === 's') { keys.down = true; e.preventDefault(); }
    if (k === ' ' || k === 'arrowup' || k === 'w') { keys.jumpJust = true; e.preventDefault(); }
    if (k === 'x' || k === 'j') { keys.shootJust = true; e.preventDefault(); }
    if (k === 'p') togglePause();
    if (gameState !== 'play' && (k === ' ' || k === 'enter')) advance();
});
window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.left = false;
    if (k === 'arrowright' || k === 'd') keys.right = false;
    if (k === 'arrowdown' || k === 's') keys.down = false;
});

/* 触屏按钮 */
document.querySelectorAll('.tb').forEach(el => {
    const key = el.dataset.key;
    const down = (e) => {
        e.preventDefault();
        if (key === 'left') keys.left = true;
        else if (key === 'right') keys.right = true;
        else if (key === 'down') keys.down = true;
        else if (key === 'jump') keys.jumpJust = true;
        else if (key === 'shoot') keys.shootJust = true;
    };
    const up = (e) => {
        e.preventDefault();
        if (key === 'left') keys.left = false;
        else if (key === 'right') keys.right = false;
        else if (key === 'down') keys.down = false;
    };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
});

function advance() {
    if (gameState === 'win') {
        if (level + 1 < LEVELS.length) loadLevel(level + 1);
        else loadLevel(0);
    } else if (gameState === 'lose') {
        loadLevel(level);
    }
}

function togglePause() {
    if (gameState !== 'play') return;
    paused = !paused;
    document.getElementById('pause-btn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
}

document.getElementById('new-btn').addEventListener('click', () => loadLevel(0));
document.getElementById('pause-btn').addEventListener('click', togglePause);
cv.addEventListener('click', () => { if (gameState !== 'play') advance(); });

/* ===================== 主循环 ===================== */
let last = 0;
function loop(ts) {
    if (!last) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.033);
    last = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
}
loadLevel(0);
requestAnimationFrame(loop);
</script>
