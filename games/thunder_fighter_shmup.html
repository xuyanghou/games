<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雷霆战机 · 纵版空战</title>
<style>
    :root {
        --bg: #070b16;
        --panel: rgba(255,255,255,0.06);
        --stroke: rgba(255,255,255,0.12);
        --text: #fff;
        --dim: rgba(255,255,255,0.55);
        --sky: #35e0ff;
    }
    * { box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
        font-family:'Noto Sans SC', -apple-system, "Segoe UI", sans-serif; }
    #wrap { position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:10px; padding:12px; }

    .head { width:100%; max-width:640px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .title h1 { font-size:1.4rem; font-weight:900; letter-spacing:3px;
        background:linear-gradient(90deg,#35e0ff,#a06eff); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .title p { font-size:0.7rem; color:var(--dim); margin-top:2px; }
    .scores { display:flex; gap:7px; flex-wrap:wrap; }
    .box { background:var(--panel); border:1px solid var(--stroke); border-radius:11px; padding:5px 12px; text-align:center; min-width:56px; }
    .box .k { font-size:0.6rem; color:var(--dim); }
    .box .v { font-size:1.05rem; font-weight:900; font-variant-numeric:tabular-nums; }

    canvas { width:100%; max-width:640px; aspect-ratio:4/5; background:#050a16; border-radius:12px;
        border:1px solid var(--stroke); display:block; box-shadow:0 16px 44px rgba(0,0,0,0.6); }

    .bar { width:100%; max-width:640px; display:flex; gap:8px; }
    .btn { flex:1; padding:10px; border-radius:11px; border:1px solid var(--stroke); cursor:pointer;
        background:var(--panel); color:var(--text); font-family:inherit; font-size:0.85rem; font-weight:700; letter-spacing:1px; }
    .btn:hover { background:rgba(255,255,255,0.12); }
    .btn.primary { background:linear-gradient(90deg,#35e0ff,#a06eff); color:#04121c; border:none; }

    .tip { font-size:0.7rem; color:var(--dim); letter-spacing:1px; text-align:center; }
    .tip b { color:var(--sky); }
</style>
</head>
<body>
<div id="wrap">
    <div class="head">
        <div class="title">
            <h1>雷霆战机</h1>
            <p>纵版空战 · 弹幕躲雷</p>
        </div>
        <div class="scores">
            <div class="box"><div class="k">分数</div><div class="v" id="score">0</div></div>
            <div class="box"><div class="k">最高</div><div class="v" id="best">0</div></div>
            <div class="box"><div class="k">命</div><div class="v" id="lives">♥♥♥</div></div>
            <div class="box"><div class="k">炸弹</div><div class="v" id="bombs">●●●</div></div>
            <div class="box"><div class="k">火力</div><div class="v" id="lv">1</div></div>
        </div>
    </div>

    <canvas id="cv" width="560" height="700"></canvas>

    <div class="bar">
        <button class="btn" id="pause-btn">⏸ 暂停</button>
        <button class="btn primary" id="new-btn">重新开始</button>
    </div>

    <p class="tip"><b>鼠标 / WASD</b> 移动 · 自动开火 · <b>空格</b> 放炸弹清屏 · <b>C</b> 切换副武器 · 拾取 ⭐ 升级火力</p>
</div>

<script>
'use strict';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const WEAPONS = [
    { name: '标准', cd: 0.14, dmg: 1, count: 1, spread: 0, speed: 680, color: '#b8f4ff' },
    { name: '散射', cd: 0.16, dmg: 1, count: 3, spread: 0.16, speed: 640, color: '#ffd08a' },
    { name: '激光', cd: 0.1,  dmg: 2, count: 1, spread: 0, speed: 1100, color: '#7df3ff' },
    { name: '双翼', cd: 0.12, dmg: 1, count: 2, spread: 0, speed: 700, color: '#b0ff9d' }
];
const SEC = ['none', 'missile', 'laser'];

let player, bullets, eBullets, enemies, powerups, stars, particles, boss;
let score, lives, level, firePower, gameState, spawnTimer, starTimer, bossTimer, scrollY, invuln;
let bombs, weaponIdx, secIdx, secCd, shake, banner, bannerT, paused, combo, comboT;
let best = parseInt(localStorage.getItem('thunder_best') || '0', 10) || 0;

function reset() {
    player = { x: W / 2, y: H - 110, w: 34, h: 40, speed: 460, tilt: 0, fireCd: 0, r: 13 };
    bullets = []; eBullets = []; enemies = []; powerups = []; particles = []; stars = [];
    boss = null;
    score = 0; lives = 4; level = 1; firePower = 1;
    bombs = 3;
    weaponIdx = 0; secIdx = 'none'; secCd = 0;
    gameState = 'play';
    spawnTimer = 0.5; starTimer = 8; bossTimer = 20;
    scrollY = 0; invuln = 2;
    shake = 0; combo = 0; comboT = 0;
    banner = ''; bannerT = 0;
    for (let i = 0; i < 70; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.8 + 0.4, v: Math.random() * 90 + 30 });
    }
    updateHUD();
}

function updateHUD() {
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
    document.getElementById('lives').textContent = '♥'.repeat(Math.max(0, lives)) || '—';
    document.getElementById('bombs').textContent = '●'.repeat(Math.max(0, bombs)) || '—';
    document.getElementById('lv').textContent = firePower + (secIdx !== 'none' ? ' +' : '');
}

/* ===================== 输入 ===================== */
const keys = {};
let mouseX = W / 2, mouseY = H / 2, usingMouse = false;
window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === 'p') togglePause();
    if (k === 'c') cycleSecondary();
    if (k === ' ' || k === 'spacebar') { fireBomb(); e.preventDefault(); }
    if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener('mousemove', (e) => {
    const r = cv.getBoundingClientRect();
    mouseX = (e.clientX - r.left) / r.width * W;
    mouseY = (e.clientY - r.top) / r.height * H;
    usingMouse = true;
});
cv.addEventListener('touchmove', (e) => {
    const t = e.changedTouches[0];
    const r = cv.getBoundingClientRect();
    mouseX = (t.clientX - r.left) / r.width * W;
    mouseY = (t.clientY - r.top) / r.height * H;
    usingMouse = true;
}, { passive: true });
cv.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    const r = cv.getBoundingClientRect();
    mouseX = (t.clientX - r.left) / r.width * W;
    mouseY = (t.clientY - r.top) / r.height * H;
    usingMouse = true;
    fireBomb();
}, { passive: true });

function cycleSecondary() {
    const order = ['none', 'missile', 'laser'];
    let i = order.indexOf(secIdx);
    i = (i + 1) % order.length;
    secIdx = order[i];
    secCd = 0;
    banner = '副武器：' + (secIdx === 'none' ? '无' : (secIdx === 'missile' ? '追踪导弹' : '集束激光'));
    bannerT = 1.4;
    updateHUD();
}

function fireBomb() {
    if (gameState !== 'play' || bombs <= 0) return;
    bombs--;
    updateHUD();
    shake = 0.5;
    /* 清屏 */
    for (const e of enemies) {
        spawnParticles(e.x, e.y, '#35e0ff', 12);
        score += 30;
    }
    enemies = [];
    for (const b of eBullets) {
        spawnParticles(b.x, b.y, '#a06eff', 4);
    }
    eBullets = [];
    if (boss) {
        boss.hp -= 18;
        boss.flash = 0.15;
        if (boss.hp <= 0) killBoss();
    }
    spawnParticles(player.x, player.y, '#ffffff', 40);
    tone(90, 0.45, 0.14);
    banner = 'B O M B !';
    bannerT = 1.2;
}

/* ===================== 更新 ===================== */
function update(dt) {
    if (gameState !== 'play') return;

    scrollY += 260 * dt;
    for (const s of stars) {
        s.y += s.v * dt;
        if (s.y > H) { s.y = -4; s.x = Math.random() * W; }
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 2.6);

    /* 玩家移动 */
    const P = player;
    let tx = mouseX, ty = mouseY;
    if (!usingMouse) {
        tx = P.x; ty = P.y;
        if (keys['a'] || keys['arrowleft']) tx -= 110;
        if (keys['d'] || keys['arrowright']) tx += 110;
        if (keys['w'] || keys['arrowup']) ty -= 110;
        if (keys['s'] || keys['arrowdown']) ty += 110;
    }
    const dx = tx - P.x, dy = ty - P.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 1.5) {
        const step = Math.min(dist, P.speed * dt);
        P.x += (dx / dist) * step;
        P.y += (dy / dist) * step;
        P.tilt += ((dx / dist) * 0.45 - P.tilt) * Math.min(1, 11 * dt);
    } else {
        P.tilt += (0 - P.tilt) * Math.min(1, 8 * dt);
    }
    P.x = Math.max(26, Math.min(W - 26, P.x));
    P.y = Math.max(46, Math.min(H - 32, P.y));

    /* 开火 */
    const wpn = WEAPONS[Math.min(weaponIdx, WEAPONS.length - 1)];
    P.fireCd -= dt;
    if (P.fireCd <= 0) {
        P.fireCd = wpn.cd;
        const extra = Math.min(2, Math.floor((firePower - 1) / 2));
        const count = wpn.count + extra;
        for (let i = 0; i < count; i++) {
            let ang = -Math.PI / 2;
            let ox = 0;
            if (count > 1) {
                const step2 = count > 3 ? 11 : 14;
                ox = (i - (count - 1) / 2) * step2;
                if (wpn.count === 3) ang += (i - 1) * wpn.spread;
            }
            bullets.push({
                x: P.x + ox, y: P.y - 20,
                vx: ox * 2.4 + (Math.random() - 0.5) * 12,
                vy: -wpn.speed,
                dmg: wpn.dmg, color: wpn.color, life: 2
            });
        }
        tone(760, 0.03, 0.03);
    }

    /* 副武器 */
    if (secIdx !== 'none') {
        secCd -= dt;
        if (secCd <= 0) {
            secCd = secIdx === 'missile' ? 1.5 : 0.5;
            if (secIdx === 'missile') {
                const targets = enemies.slice(0, 2).concat(boss ? [boss] : []);
                for (let i = 0; i < 2; i++) {
                    const tgt = targets[i];
                    bullets.push({
                        x: P.x + (i === 0 ? -18 : 18), y: P.y + 4,
                        vx: (i === 0 ? -1 : 1) * 120, vy: -180,
                        dmg: 4, color: '#ffb04d', life: 3.4, homing: true, target: tgt || null
                    });
                }
                tone(300, 0.06, 0.05);
            } else {
                for (let i = 0; i < 3; i++) {
                    bullets.push({ x: P.x, y: P.y - 16 - i * 16, vx: 0, vy: -1000, dmg: 3, color: '#7df3ff', life: 1.2, pierce: true });
                }
                tone(1100, 0.05, 0.05);
            }
        }
    }

    /* 生成敌机 */
    spawnTimer -= dt;
    if (spawnTimer <= 0 && !boss) {
        const rate = Math.max(0.34, 1.35 - level * 0.1);
        spawnTimer = rate;
        spawnWave();
    }

    /* BOSS 触发 */
    bossTimer -= dt;
    if (!boss && bossTimer <= 0) {
        const lv = 1 + Math.floor((score / 5000) | 0);
        boss = {
            x: W / 2, y: -90, w: 140, h: 96,
            hp: 60 + lv * 30, maxHp: 60 + lv * 30,
            phase: 0, t: 0, cool: 0, entered: false, flash: 0, dead: false
        };
        bossTimer = 32;
        banner = 'W A R N I N G';
        bannerT = 2.4;
        tone(120, 0.5, 0.1);
    }

    /* 敌机 */
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.t += dt;
        e.y += e.vy * dt;
        if (e.type === 'sine') e.x = e.bx + Math.sin(e.t * 2.4) * e.amp;
        else if (e.type === 'chase') {
            e.x += (e.x < P.x ? 1 : -1) * e.speed * dt;
            e.x = Math.max(24, Math.min(W - 24, e.x));
        } else e.x += e.vx * dt;

        if (e.shooter && e.cool <= 0) {
            e.cool = 1.6 + Math.random() * 1.6;
            const ang = Math.atan2(P.y - e.y, P.x - e.x);
            eBullets.push({ x: e.x, y: e.y + 12, vx: Math.cos(ang) * 175, vy: Math.sin(ang) * 175, life: 4 });
        }
        e.cool -= dt;

        if (e.y > H + 40) { enemies.splice(i, 1); continue; }

        if (Math.abs(e.x - P.x) < e.r + 12 && Math.abs(e.y - P.y) < e.r + 14) {
            enemies.splice(i, 1);
            spawnParticles(e.x, e.y, '#ff9a3c', 12);
            if (invuln <= 0) hurtPlayer();
            continue;
        }
    }

    /* BOSS */
    if (boss) updateBoss(dt);

    /* 玩家子弹 */
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.homing) {
            if (b.target && !b.target.dead && b.target.hp !== undefined) {
                const ang = Math.atan2(b.target.y - b.y, b.target.x - b.x);
                b.vx += Math.cos(ang) * 900 * dt;
                b.vy += Math.sin(ang) * 900 * dt;
                const sp = Math.hypot(b.vx, b.vy) || 1;
                const cap = 560;
                if (sp > cap) { b.vx = b.vx / sp * cap; b.vy = b.vy / sp * cap; }
            }
        }
        b.x += b.vx * dt; b.y += b.vy * dt;
        b.life -= dt;
        if (b.dead || b.y < -30 || b.x < -20 || b.x > W + 20) { bullets.splice(i, 1); continue; }

        let hit = false;
        if (boss && !boss.dead) {
            if (b.x > boss.x - boss.w / 2 && b.x < boss.x + boss.w / 2 &&
                b.y > boss.y - boss.h / 2 && b.y < boss.y + boss.h / 2) {
                boss.hp -= b.dmg;
                boss.flash = 0.07;
                spawnParticles(b.x, b.y, b.color || '#fff', 3);
                if (boss.hp <= 0) { killBoss(); bullets.splice(i, 1); continue; }
                if (!b.pierce) { bullets.splice(i, 1); continue; }
                hit = true;
            }
        }

        if (!hit) {
            for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                if (Math.abs(b.x - e.x) < e.r && Math.abs(b.y - e.y) < e.r) {
                    e.hp -= b.dmg;
                    e.flash = 0.08;
                    spawnParticles(b.x, b.y, b.color || '#35e0ff', 4);
                    if (e.hp <= 0) {
                        score += e.score;
                        combo++; comboT = 1.4;
                        spawnParticles(e.x, e.y, '#ff9a3c', 12);
                        if (Math.random() < 0.14) powerups.push({ x: e.x, y: e.y, t: 0 });
                        enemies.splice(j, 1);
                        updateHUD();
                    }
                    hit = true;
                    break;
                }
            }
        }
        if (hit && !b.pierce) bullets.splice(i, 1);
    }

    /* 敌方子弹 */
    for (let i = eBullets.length - 1; i >= 0; i--) {
        const b = eBullets[i];
        b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
        if (b.life <= 0 || b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) { eBullets.splice(i, 1); continue; }
    /* 玩家受击判定：稍微宽容一点 */
    if (Math.abs(b.x - P.x) < 11 && Math.abs(b.y - P.y) < 12) {
        eBullets.splice(i, 1);
        spawnParticles(b.x, b.y, '#ff6b6b', 5);
        if (invuln <= 0) hurtPlayer();
    }
    }

    /* 火力道具 */
    starTimer -= dt;
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += 90 * dt;
        p.t += dt;
        if (p.y > H + 30) { powerups.splice(i, 1); continue; }
        if (Math.abs(p.x - P.x) < 22 && Math.abs(p.y - P.y) < 24) {
            firePower = Math.min(6, firePower + 1);
            powerups.splice(i, 1);
            spawnParticles(p.x, p.y, '#ffcc00', 14);
            tone(1200, 0.12, 0.08);
            banner = '火力升级 Lv' + firePower;
            bannerT = 1.4;
            updateHUD();
        }
    }

    if (invuln > 0) invuln -= dt;
    if (bannerT > 0) bannerT -= dt;
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    updateParticles(dt);
}

function updateBoss(dt) {
    boss.t += dt;
    boss.flash -= dt;
    boss.cool -= dt;

    if (!boss.entered) {
        boss.y += 100 * dt;
        if (boss.y >= 100) { boss.y = 100; boss.entered = true; }
        return;
    }
    boss.x = W / 2 + Math.sin(boss.t * 0.9) * (W / 2 - 90);
    boss.phase = boss.hp < boss.maxHp * 0.35 ? 2 : (boss.hp < boss.maxHp * 0.7 ? 1 : 0);

    if (boss.cool <= 0) {
        if (boss.phase === 0) {
            boss.cool = 0.6;
            for (let k = -3; k <= 3; k++) {
                const ang = Math.PI / 2 + k * 0.26;
                eBullets.push({ x: boss.x, y: boss.y + 34, vx: Math.cos(ang) * 220, vy: Math.sin(ang) * 220, life: 4.5 });
            }
        } else if (boss.phase === 1) {
            boss.cool = 0.42;
            const ang = Math.atan2(player.y - boss.y, player.x - boss.x);
            for (let k = -1; k <= 1; k++) {
                const a2 = ang + k * 0.3;
                eBullets.push({ x: boss.x, y: boss.y + 34, vx: Math.cos(a2) * 250, vy: Math.sin(a2) * 250, life: 4.5 });
            }
            /* 侧翼小炮 */
            for (let s = -1; s <= 1; s += 2) {
                eBullets.push({ x: boss.x + s * 62, y: boss.y + 20, vx: s * 150, vy: 120, life: 3.6 });
            }
        } else {
            boss.cool = 0.35;
            const base = boss.t * 2.6;
            for (let k = 0; k < 10; k++) {
                const ang = base + k * Math.PI / 5;
                eBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 250, vy: Math.sin(ang) * 250, life: 4.5 });
            }
        }
        tone(160, 0.05, 0.04);
    }
}

function killBoss() {
    if (!boss || boss.dead) return;
    boss.dead = true;
    score += 3000;
    shake = 0.6;
    spawnParticles(boss.x, boss.y, '#ff5c5c', 50);
    for (let i = 0; i < 8; i++) {
        setTimeout(() => spawnParticles(boss.x + (Math.random() - 0.5) * 80, boss.y + (Math.random() - 0.5) * 70, '#ffcc00', 16), i * 140);
    }
    tone(90, 0.6, 0.12);
    boss = null;
    level++;
    bombs = Math.min(5, bombs + 1);
    banner = 'B O S S 击 破 ！';
    bannerT = 2.2;
    updateHUD();
}

function spawnWave() {
    const kind = Math.random();
    if (kind < 0.36) {
        const x = 40 + Math.random() * (W - 80);
        enemies.push({ x, y: -30, vx: 0, vy: 200, r: 15, hp: 1, score: 100, type: 'line', t: 0, cool: 0, shooter: false, flash: 0, bx: x, amp: 0, speed: 0 });
    } else if (kind < 0.64) {
        const x = 60 + Math.random() * (W - 120);
        enemies.push({ x, y: -30, vx: 0, vy: 155, r: 16, hp: 2, score: 160, type: 'sine', t: 0, cool: 0, shooter: false, flash: 0, bx: x, amp: 70, speed: 0 });
    } else if (kind < 0.9) {
        const x = 50 + Math.random() * (W - 100);
        enemies.push({ x, y: -30, vx: 0, vy: 108, r: 18, hp: 3, score: 250, type: 'gun', t: 0, cool: 2.0, shooter: true, flash: 0, bx: x, amp: 0, speed: 0 });
    } else if (kind < 0.96) {
        const x = 60 + Math.random() * (W - 120);
        enemies.push({ x, y: -40, vx: 0, vy: 98, r: 22, hp: 6, score: 500, type: 'elite', t: 0, cool: 2.2, shooter: true, flash: 0, bx: x, amp: 40, speed: 0 });
    } else {
        /* 追踪型 */
        const x = 60 + Math.random() * (W - 120);
        enemies.push({ x, y: -40, vx: 0, vy: 130, r: 19, hp: 4, score: 380, type: 'chase', t: 0, cool: 1.5, shooter: true, flash: 0, bx: x, amp: 0, speed: 105 });
    }
}

function hurtPlayer() {
    lives--;
    invuln = 1.9;
    firePower = Math.max(1, firePower - 1);
    combo = 0;
    shake = 0.35;
    spawnParticles(player.x, player.y, '#ff5c5c', 18);
    tone(120, 0.22, 0.1);
    if (lives <= 0) {
        gameState = 'lose';
        if (score > best) { best = score; localStorage.setItem('thunder_best', String(best)); }
        banner = 'G A M E  O V E R';
        bannerT = 99;
    }
    updateHUD();
}

function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 40 + Math.random() * 200;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.35 + Math.random() * 0.45, color, size: 1.5 + Math.random() * 3 });
    }
}
function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

/* ===================== 渲染 ===================== */
function render() {
    const sx = shake > 0 ? (Math.random() - 0.5) * shake * 10 : 0;
    const sy = shake > 0 ? (Math.random() - 0.5) * shake * 10 : 0;
    ctx.save();
    ctx.translate(sx, sy);

    ctx.fillStyle = '#050a16';
    ctx.fillRect(0, 0, W, H);

    /* 星星 */
    for (const s of stars) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + s.s * 0.3) + ')';
        ctx.fillRect(s.x, s.y, s.s, s.s * 2.5);
    }
    /* 云层带 */
    ctx.fillStyle = 'rgba(60,90,140,0.25)';
    for (let i = 0; i < 5; i++) {
        const yy = ((i * 220 + scrollY * 0.5) % (H + 300)) - 150;
        ctx.beginPath();
        ctx.ellipse((i * 137) % W, yy, 130, 26, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    /* 敌机 */
    for (const e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.fillStyle = e.flash > 0 ? '#fff' : (e.type === 'elite' ? '#c8402e' : e.type === 'gun' ? '#e07a2c' : e.type === 'chase' ? '#8a4bd6' : '#7a8fb8');
        ctx.beginPath();
        ctx.moveTo(0, e.r);
        ctx.lineTo(-e.r, -e.r * 0.4);
        ctx.lineTo(-e.r * 0.5, 0);
        ctx.lineTo(e.r * 0.5, 0);
        ctx.lineTo(e.r, -e.r * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(0, -e.r * 0.15, e.r * 0.3, 0, Math.PI * 2);
        ctx.fill();
        if (e.type === 'chase') {
            ctx.fillStyle = '#ff5c5c';
            ctx.beginPath(); ctx.arc(0, -e.r * 0.2, e.r * 0.16, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
        if (e.hp > 1) {
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2, 3);
            ctx.fillStyle = '#ff5c5c';
            ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2 * (e.hp / 6), 3);
        }
    }

    /* BOSS */
    if (boss) {
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.fillStyle = boss.flash > 0 ? '#fff' : '#6a2fb8';
        ctx.beginPath();
        ctx.moveTo(0, boss.h / 2);
        ctx.lineTo(-boss.w / 2, -boss.h / 3);
        ctx.lineTo(-boss.w / 3, -boss.h / 2);
        ctx.lineTo(0, -boss.h / 3);
        ctx.lineTo(boss.w / 3, -boss.h / 2);
        ctx.lineTo(boss.w / 2, -boss.h / 3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = boss.phase === 2 ? '#ffcc00' : '#ff5c5c';
        ctx.beginPath(); ctx.arc(-24, 6, 10, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(24, 6, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(-boss.w / 2 + 8, -boss.h / 3 - 6, boss.w - 16, 5);
        ctx.restore();

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(50, 18, W - 100, 8);
        ctx.fillStyle = '#ff5c5c';
        ctx.fillRect(50, 18, (W - 100) * Math.max(0, boss.hp / boss.maxHp), 8);
    }

    /* 玩家战机 */
    {
        const P = player;
        if (!(invuln > 0 && Math.floor(invuln * 16) % 2 === 0)) {
            ctx.save();
            ctx.translate(P.x, P.y);
            ctx.rotate(P.tilt);
            /* 尾焰 */
            ctx.fillStyle = 'rgba(255,160,60,' + (0.6 + Math.random() * 0.4) + ')';
            ctx.beginPath();
            ctx.moveTo(-6, 16); ctx.lineTo(0, 30 + Math.random() * 10); ctx.lineTo(6, 16);
            ctx.closePath();
            ctx.fill();
            /* 机身 */
            ctx.fillStyle = '#35e0ff';
            ctx.beginPath();
            ctx.moveTo(0, -22);
            ctx.lineTo(-9, -4);
            ctx.lineTo(-16, 12);
            ctx.lineTo(-6, 9);
            ctx.lineTo(0, 17);
            ctx.lineTo(6, 9);
            ctx.lineTo(16, 12);
            ctx.lineTo(9, -4);
            ctx.closePath();
            ctx.fill();
            /* 座舱 */
            ctx.fillStyle = '#a06eff';
            ctx.beginPath();
            ctx.ellipse(0, -4, 5, 9, 0, 0, Math.PI * 2);
            ctx.fill();
            /* 副武器挂架 */
            if (secIdx !== 'none') {
                ctx.fillStyle = '#ffb04d';
                ctx.fillRect(-20, 2, 7, 12);
                ctx.fillRect(13, 2, 7, 12);
            }
            ctx.restore();
        }
    }

    /* 子弹 */
    for (const b of bullets) {
        if (b.homing) {
            ctx.fillStyle = b.color;
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
            ctx.beginPath();
            ctx.moveTo(0, -8); ctx.lineTo(6, 6); ctx.lineTo(0, 3); ctx.lineTo(-6, 6);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        } else {
            ctx.strokeStyle = b.color || '#b8f4ff';
            ctx.lineWidth = b.pierce ? 4 : 2.5;
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x - b.vx * 0.018, b.y - b.vy * 0.018);
            ctx.stroke();
        }
    }
    for (const b of eBullets) {
        ctx.fillStyle = '#ff6b6b';
        ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    /* 道具 */
    for (const p of powerups) {
        const s = 1 + Math.sin(p.t * 5) * 0.15;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.t * 2);
        ctx.fillStyle = '#ffcc00';
        ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 12;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const r = i % 2 === 0 ? 13 * s : 5.5 * s;
            const a = -Math.PI / 2 + i * Math.PI / 5;
            const fn = i === 0 ? 'moveTo' : 'lineTo';
            ctx[fn](Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    /* 粒子 */
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    /* 火力 / 武器信息 */
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(10, 12, 120, 26);
    ctx.fillStyle = '#ffcc00';
    ctx.font = 'bold 13px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('火力 Lv' + firePower, 20, 26);
    if (secIdx !== 'none') {
        ctx.fillStyle = '#ffb04d';
        ctx.fillText('副武: ' + (secIdx === 'missile' ? '导弹' : '激光'), 10, 52);
    }
    /* 炸弹 */
    ctx.fillStyle = '#a06eff';
    ctx.fillText('BOMB x' + bombs, 10, secIdx !== 'none' ? 74 : 52);

    /* 连击 */
    if (combo > 2) {
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 18px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'right'; ctx.textBaseline = 'top';
        ctx.fillText('x' + combo, W - 14, 14);
    }

    /* 横幅 */
    if (bannerT > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, H / 2 - 34, W, 56);
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 30px "Noto Sans SC", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(banner, W / 2, H / 2 - 6);
    }

    /* 结束 */
    if (gameState !== 'play') {
        ctx.fillStyle = 'rgba(4,8,18,0.8)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ff5c5c';
        ctx.font = 'bold 44px "Noto Sans SC", sans-serif';
        ctx.fillText('G A M E  O V E R', W / 2, H / 2 - 30);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px "Noto Sans SC", sans-serif';
        ctx.fillText('得分 ' + score + ' · 最高 ' + best, W / 2, H / 2 + 10);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '15px "Noto Sans SC", sans-serif';
        ctx.fillText('点击「重新开始」再战', W / 2, H / 2 + 44);
    }
}

/* ===================== 音效 ===================== */
let actx = null;
function tone(freq, dur, vol) {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
}

/* ===================== 控制 ===================== */
function togglePause() {
    if (gameState !== 'play') return;
    paused = !paused;
    document.getElementById('pause-btn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
}
document.getElementById('new-btn').addEventListener('click', reset);
document.getElementById('pause-btn').addEventListener('click', togglePause);
cv.addEventListener('click', () => { if (gameState !== 'play') reset(); });

/* ===================== 主循环 ===================== */
let last = 0;
function loop(ts) {
    if (!last) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.033);
    last = ts;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
