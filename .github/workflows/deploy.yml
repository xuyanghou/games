name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 允许流水线写内容
permissions:
  contents: read
  pages: write
  id-token: write

# 同一次运行只保留一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备静态站点
        run: |
          set -e
          # 把仓库内容复制到 _site（排除 .git 和 .github 本身）
          mkdir -p _site
          rsync -a --exclude '.git/' --exclude '.github/' --exclude '_site/' ./ _site/
          # 重新扫描 games 目录，保证清单与实际游戏一致
          if [ -f _site/scan.js ]; then
            node _site/scan.js
          fi
          echo "---- 站点内容 ----"
          ls -la _site
          echo "---- games 目录 ----"
          ls -la _site/games

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
